   P("Section 3.4 — Suivi, Évaluation et Assurance Qualité","Le Bureau de l’AHSIA est chargé d’évaluer, de suivre et de contrôler en continu la qualité des soins et la sécurité des patients à travers le Réseau de Santé Adventiste, en utilisant le cadre d’Alignement Missionnaire, de Performance des Systèmes et d’Assurance Qualité (MSQ) pour recueillir des données opérationnelles et examiner les indicateurs de performance."),
   P("Section 3.5 — Gouvernance, Leadership, Fonctionnement et Appui Financier","Le Bureau de l’AHSIA fournit des services de conseil stratégique et de renforcement des capacités pour consolider la gouvernance, le leadership et la gestion des Institutions Membres — tout en respectant strictement leur propriété locale, leurs conseils locaux et leur autonomie juridique — notamment par le coaching, le mentorat, la formation des conseils, le développement professionnel, ainsi que la facilitation de l’appui opérationnel et financier et de la mobilisation des ressources.")
 ]},
{num:4, roman:"IV", title:"Fonctionnement",
 original:[
   H("De l’Article IV de 2022 — Objectifs (Sections 1–15)"),
   P(null,"Les objectifs généraux de l’AHSIA comprennent, sans s’y limiter :"),
   L(null,[
     "Section 1. Participer directement à la gouvernance des principales institutions de santé en tant que membre de conseil d’office.",
     "Section 2. Élaborer, maintenir, mettre à jour et faire appliquer un modèle approprié de politiques de santé (un Manuel de Fonctionnement des Institutions de Santé Adventistes), en harmonie avec la philosophie, les croyances et la mission de l’Église adventiste, et conforme aux meilleures pratiques actuelles en matière de soins de santé.",
     "Section 3. Élaborer un manuel du conseil, des procédures ainsi qu’un programme de formation et d’orientation pour promouvoir les principes généraux de gouvernance en santé.",
     "Section 4. Élaborer et maintenir à jour un modèle de Statuts Médicaux que chaque conseil d’institution pourra adopter et adapter selon les besoins pour régir son personnel médical et ses activités médicales.",
     "Section 5. Fournir des conseils, sur demande, concernant l’ouverture, la fermeture et l’expansion majeure des institutions de santé.",
     "Section 6. Favoriser et coordonner les échanges administratifs, professionnels et techniques entre les institutions, et créer des mécanismes adéquats de coopération entre elles.",
     "Section 7. Favoriser, aider à établir et coordonner, chaque fois que possible et recommandable, des systèmes de santé adventistes nationaux ou à l’échelle de l’Union efficaces.",
     "Section 8. Établir et coordonner la formation continue des dirigeants, gestionnaires, employés, bénévoles et membres de conseil des institutions.",
     "Section 9. Soutenir et coordonner toutes les initiatives d’intérêt commun, telles que les achats groupés, la standardisation des équipements, l’entretien et la maintenance.",
     "Section 10. Favoriser et faciliter des services de conseil aux institutions membres pour l’élaboration de plans directeurs, de stratégies de marketing, d’analyses des tendances financières et d’autres tâches spécialisées.",
     "Section 11. Élaborer et exploiter un système de « Programme de Qualité des Soins et de Sécurité des Patients ».",
     "Section 12. Élaborer et exécuter un programme d’accréditation pertinent pour les institutions de santé adventistes du territoire de l’IAD.",
     "Section 13. Rechercher, négocier et coordonner le meilleur programme d’accréditation possible pour tous les hôpitaux, et permettre un programme adéquat d’évaluation/accréditation pour tous les autres types d’institutions de santé.",
     "Section 14. Concevoir, ou rechercher et promouvoir, des systèmes appropriés de rapports administratifs, médicaux et financiers, facilitant un meilleur suivi managérial, professionnel et financier, ainsi qu’une croissance et un développement adéquats dans tout le système.",
     "Section 15. Fournir des conseils sur des questions particulières telles que la couverture de responsabilité civile générale et professionnelle, et les régimes de retraite des employés du secteur de la santé adventiste, en consultation avec les différents organes de gouvernance."
   ]),
   H("De l’Article V de 2022 — Fonctionnement (Conseil, Consultants, Partenariats)"),
   P(null,"L’AHSIA était gouvernée par le « Conseil de l’AHSIA », composé comme suit :"),
   L(null,["Le Président de l’IAD ou son représentant désigné","Le Président de l’AHSIA","Le Trésorier de l’AHSIA","Tous les autres administrateurs de l’IAD","Tous les présidents des Unions possédant des institutions de santé","Le président de l’Université de Montemorelos","Le Directeur des Ministères de la Santé de la Conférence Générale ou son représentant désigné","Les présidents de conseil de tous les autres hôpitaux ou systèmes de santé nationaux/à l’échelle de l’Union (le cas échéant)","Tous les administrateurs d’hôpitaux ou de systèmes de santé nationaux/à l’échelle de l’Union"]),
   P(null,"Les activités générales étaient dirigées par le Président, nommé par le Conseil de l’AHSIA."),
   L("Un groupe de Consultants Professionnels, comprenant, sans s’y limiter, des spécialistes dans les domaines suivants :",["Questions financières","Philanthropie","Approvisionnement, logistique et soutien général","Questions infirmières","Santé numérique et technologies de l’information","Questions de laboratoire clinique","Questions de qualité","Gestion des installations","Questions biomédicales","Maintenance","Imagerie","Gestion des risques","Gouvernance, évaluation et formation des conseils","Formation continue et développement professionnel"]),
   L("Partenariats internationaux que le Président de l’AHSIA cherchait à développer et à renforcer :",["Les Ministères de la Santé de la Conférence Générale","Adventist Health International (AHI)","Le Global Healthcare Institute de la LLUH","La Global Health Footprint Initiative d’AdventHealth","Adventist Health Services (AHS)","L’Université de Montemorelos","ADRA International","Les universités pertinentes de l’IAD","D’autres institutions adventistes ayant un intérêt pour la santé, telles que l’IADPA ou la compagnie alimentaire","Toute entité adventiste ou non adventiste pertinente"])
 ],
 updated:[
   P("Section 4.1 — Structure de Gouvernance","L’AHSIA fonctionne selon une structure de gouvernance à trois niveaux."),
   H("1. La Constituante de l’AHSIA"),
   P(null,"L’organe représentatif du Réseau de l’AHSIA et de la Division Interaméricaine. Elle approuve les politiques majeures, les normes du système et l’orientation stratégique. La Constituante se réunit tous les cinq (5) ans, en phase avec le cycle quinquennal de la Division Interaméricaine."),
   H("2. Le Conseil d’Administration de l’AHSIA"),
   P(null,"L’organe de gouvernance principal, responsable de la supervision, du développement du système, de l’alignement missionnaire, de l’accréditation et de la reddition de comptes. Le Conseil d’Administration se réunit deux (2) fois par an."),
   H("3. La Direction Exécutive de l’AHSIA (Bureau de l’AHSIA)"),
   P(null,"L’équipe de l’AHSIA chargée de mettre en œuvre les politiques, de coordonner le système, de faciliter la mise en réseau et de soutenir les Institutions Membres."),
   P("Section 4.2 — Composition de la Constituante de l’AHSIA","La Constituante de l’AHSIA est l’Assemblée Générale de l’IAD."),
   P("Section 4.3 — Composition du Conseil d’Administration de l’AHSIA","Le Conseil d’Administration est établi par le Conseil de l’IAD et comprend un nombre impair de membres afin de garantir des décisions claires. Le Conseil d’Administration comprend :"),
   L(null,["Le Président de l’IAD ou son représentant désigné (Président du Conseil)","Le Président de l’AHSIA (Secrétaire)","Le Trésorier de l’AHSIA","Le Directeur des Ministères de la Santé de l’IAD","Trois (3) représentants des Unions (rotatifs)","Trois (3) directeurs généraux d’Institutions Membres (rotatifs)","Deux (2) professionnels laïcs (santé, finances, droit)"]),
   P("Section 4.4 — Direction Exécutive (Bureau de l’AHSIA)","La Direction Exécutive comprend :"),
   L(null,["Le Président de l’AHSIA","Des Vice-présidents (régionaux ou fonctionnels)","Le Secrétaire","Le Trésorier","Des Conseillers Principaux pour les domaines critiques ou stratégiques, selon les besoins"]),
   P("Section 4.5 — Gouvernance, Direction Exécutive et Gestion des Institutions Membres","Le Bureau de l’AHSIA peut soutenir la gouvernance ou l’équipe de direction exécutive des institutions, selon le cas, mais ne doit en aucune circonstance s’immiscer dans la gestion quotidienne des institutions. Les Institutions Membres demeurent autonomes et sont gouvernées par leur propre conseil, qui met en place ses propres équipes de direction et de gestion.")
 ]},
{num:5, roman:"V", title:"Fonctions des Dirigeants",
 original:[
   H("Fonctions du Président"),
   P(null,"Le Président de l’AHSIA :"),
   L(null,[
     "Section 1. Est membre d’office de tous les conseils hospitaliers, afin de rester informé de tous les aspects de leur fonctionnement, et peut éventuellement présider ces conseils selon les besoins.",
     "Section 2. Coordonne le réseau des institutions de santé de l’AHSIA.",
     "Section 3. Assure le leadership dans la coordination du réseau des institutions de santé de l’AHSIA.",
     "Section 4. Élabore un plan opérationnel annuel de l’organisation, à soumettre au Conseil de l’AHSIA lors de sa réunion annuelle.",
     "Section 5. Travaille avec le Trésorier de l’AHSIA à la préparation d’un budget opérationnel et de développement annuel, à soumettre au conseil pour approbation lors de sa réunion annuelle.",
     "Section 6. Développe et entretient tous les partenariats nécessaires, professionnels et financiers, pour remplir les objectifs de l’AHSIA et servir les intérêts de ses institutions membres.",
     "Section 7. Soumet des rapports réguliers sur ces relations et leurs bénéfices au conseil, lors de sa réunion annuelle ou selon les besoins.",
     "Section 8. Veille à ce que l’objet et les objectifs de l’AHSIA demeurent toujours une priorité dans les opérations de l’institution.",
     "Section 9. Fournit une orientation et une mise à jour régulières aux membres du conseil sur les tendances récentes en matière de gouvernance et de gestion de la santé."
   ]),
   H("Fonctions du Trésorier — Partie I"),
   L(null,[
     "Section 10. Administre les ressources financières de l’institution conformément au budget de fonctionnement approuvé et aux politiques et décisions du Conseil de l’AHSIA.",
     "Section 11. Prépare le budget opérationnel et de développement annuel de l’institution.",
     "Section 12. Fournit des conseils, informations et analyses financiers."
   ]),
   H("Partie II — Institutions (Hôpitaux et Cliniques)"),
   L(null,[
     "Section 13. Veille à ce que chaque institution prépare et soumette ses états financiers mensuels au plus tard le 15 du mois suivant.",
     "Section 14. Veille à ce que l’audit annuel de chaque institution, accompagné de la réponse de la direction aux auditeurs, soit archivé.",
     "Section 15. Prépare des analyses financières et formule des recommandations.",
     "Section 16. Applique les politiques financières de la Conférence Générale et de la Division Interaméricaine, en harmonie avec le Manuel de Comptabilité."
   ])
 ],
 updated:[
   P("Section 5.1 — Président de l’AHSIA","Le Président de l’AHSIA agit en tant que Directeur Général (CEO) du Bureau de l’AHSIA et est responsable du leadership stratégique, de la coordination et du développement du Réseau de l’AHSIA. Le Président doit :"),
   L(null,["Assurer un leadership à l’échelle du système, en accord avec la mission, les valeurs et les priorités stratégiques de l’IAD.","Diriger la mise en œuvre des Modèles Adventistes de Services de Santé (tels que le MAPS et le MASH) dans tout le Réseau de l’AHSIA.","Superviser le Système d’Accréditation de l’AHSIA, y compris ses quatre niveaux progressifs (Étoile, Argent, Or, Platine).","Assurer le rapportage MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité) et l’alignement à l’échelle du système, en examinant les indicateurs cliniques, de gouvernance, financiers et d’impact communautaire.","Élaborer le plan opérationnel et de développement annuel du Bureau de l’AHSIA, pour examen et approbation par le Conseil d’Administration.","Préparer le budget annuel du Bureau de l’AHSIA en étroite collaboration avec le Trésorier.","Renforcer la collaboration entre les Institutions Membres et faciliter les services partagés et le renforcement du système.","Développer des partenariats stratégiques avec des Partenaires Institutionnels et des Partenaires Techniques, sans leur conférer d’autorité de gouvernance ou de décision sur le Réseau ou le Bureau de l’AHSIA.","Représenter l’AHSIA auprès de la Division Interaméricaine et des partenaires externes.","Assurer la stricte conformité de toutes les opérations avec la présente Constitution, ses statuts et les politiques approuvées par le Conseil d’Administration."]),
   P("Section 5.2 — Vice-présidents","Les Vice-présidents soutiennent le Président dans des fonctions de leadership régional ou fonctionnel. Ils doivent :"),
   L(null,["Assurer la supervision et la coordination des régions géographiques ou domaines fonctionnels qui leur sont assignés au sein du Réseau de l’AHSIA.","Soutenir les Institutions Membres dans la mise en œuvre des normes d’accréditation, du rapportage MSQ et de l’alignement missionnaire.","Contribuer au développement du leadership, au mentorat professionnel et aux initiatives de formation.","Faciliter la communication, les échanges entre pairs et la collaboration entre les Institutions Membres."]),
   P("Section 5.3 — Secrétaire","Le Secrétaire du Bureau de l’AHSIA doit :"),
   L(null,["Tenir les registres officiels, les procès-verbaux et la documentation juridique du Bureau de l’AHSIA, des réunions du Conseil d’Administration et des sessions de la Constituante.","Soutenir la communication entre le Conseil d’Administration, la Constituante et les Institutions Membres.","Assurer l’archivage adéquat de tous les registres d’accréditation, des rapports d’évaluation MSQ et des documents de politique, conformément aux directives de conservation de l’IAD."]),
   P("Section 5.4 — Trésorier","Le Trésorier du Bureau de l’AHSIA doit :"),
   L(null,["Administrer les ressources financières du Bureau de l’AHSIA conformément au budget approuvé et aux décisions du Conseil d’Administration.","Préparer le budget opérationnel et de développement annuel du Bureau de l’AHSIA en collaboration avec le Président.","Fournir des rapports financiers réguliers au Conseil d’Administration et à son Comité des Finances.","Veiller à ce que les opérations financières du Bureau de l’AHSIA respectent les politiques financières de la Conférence Générale (CG) et de l’IAD."]),
   N("Limitation : le Trésorier ne supervise pas directement les finances institutionnelles et n’intervient pas dans la gouvernance financière locale ni dans les décisions des conseils locaux."),
   P("Section 5.5 — Conseillers Principaux","Les Conseillers Principaux sont des experts techniques de haut niveau engagés ou nommés par le Bureau de l’AHSIA pour fournir des conseils spécialisés dans les domaines clinique, opérationnel et spirituel. Ils doivent :"),
   L(null,["Fournir des conseils d’experts dans des domaines incluant, sans s’y limiter : la Qualité Clinique et la Sécurité des Patients, les Questions Infirmières, la Durabilité Financière, la Santé Numérique et les Technologies de l’Information, l’Approvisionnement et la Chaîne Logistique, la Mission et les Soins Spirituels, la Santé Publique, et la Formation à la Gouvernance.","Diriger et soutenir les initiatives techniques, les programmes de formation et le renforcement des capacités à l’échelle du système, dans leurs domaines respectifs.","Soutenir la mise en œuvre du cadre MSQ et fournir une assistance technique aux Institutions Membres à mesure qu’elles progressent dans les Niveaux d’Accréditation de l’AHSIA (Étoile, Argent, Or, Platine).","Collaborer avec la direction du Bureau de l’AHSIA, les Vice-présidents régionaux et les institutions locales pour partager les meilleures pratiques et les innovations techniques."]),
   N("Limitation : les Conseillers Principaux exercent strictement des fonctions techniques, consultatives ou éducatives. Ils ne détiennent aucune autorité de gouvernance, ne participent ni à la prise de décision ni au vote du Conseil d’Administration, et n’exercent aucune autorité de supervision directe sur le Bureau de l’AHSIA ni sur aucune Institution Membre.")
 ]},
{num:6, roman:"VI", title:"Quorum",
 original:[
   P(null,"Le quorum des réunions officielles du conseil est de cinq membres, y compris le président ou son représentant désigné.")
 ],
 updated:[
   N("(Révisé, corrigé et amélioré)"),
   P("Section 6.1 — Quorum de la Constituante","Le quorum d’une réunion dûment convoquée de la Constituante de l’AHSIA est constitué d’une majorité simple de tous les délégués accrédités de la Constituante. La Constituante se réunit tous les cinq (5) ans, sauf convocation d’une session spéciale par l’Administration de la Division Interaméricaine."),
   P("Section 6.2 — Quorum du Conseil d’Administration","Le quorum d’une réunion dûment convoquée du Conseil d’Administration de l’AHSIA est constitué de sept (7) membres, y compris le Président du Conseil ou son représentant désigné. Le Conseil d’Administration se réunit deux (2) fois par an, avec des réunions supplémentaires convoquées selon les besoins.")
 ]},
{num:7, roman:"VII", title:"Finances",
 original:[
   P(null,"L’AHSIA fonctionnera avec un budget annuel, dont les fonds proviendront comme suit :"),
   L(null,["Une allocation annuelle de l’Administration de la Division Interaméricaine.","Les institutions membres et/ou leurs organisations propriétaires respectives contribueront un montant annuel établi selon une position votée par le Conseil de l’AHSIA.","Des dons et des programmes philanthropiques."])
 ],
 updated:[
   P("Section 7.1 — Structure Financière du Bureau de l’AHSIA","Le Bureau de l’AHSIA fonctionnera selon un budget annuel soutenant ses fonctions administratives, stratégiques et missionnaires. La structure financière comprend :"),
   L(null,["Un budget administratif, couvrant les salaires et frais connexes du Président de l’AHSIA et des assistants professionnels désignés.","Un budget de développement de programmes, consacré aux priorités à l’échelle du système, notamment : le soutien aux hôpitaux et institutions de santé ; les projets prioritaires et la formation en collaboration avec l’Unité Missionnaire Médicale (MMU) ; les consultants, le soutien technique et la technologie ; le suivi et l’évaluation de la qualité ; et les services de conseil et les réunions d’équipe."]),
   P(null,"Le budget annuel du Bureau de l’AHSIA sera examiné et approuvé par le Conseil d’Administration de l’AHSIA."),
   P("Section 7.2 — Sources de Financement du Bureau de l’AHSIA","Au-delà de l’allocation de l’IAD, le financement du Bureau de l’AHSIA proviendra des sources suivantes :"),
   L(null,["Allocation du budget annuel de l’IAD.","Contributions annuelles des Institutions Membres, déterminées par le Conseil d’Administration et proportionnées selon la taille, la capacité ou le niveau d’accréditation de l’institution.","Dons, subventions et soutien philanthropique, favorisant la mission, la formation et le développement du système.","Frais d’accréditation, de formation et de services, perçus pour les visites d’accréditation, les programmes de leadership, les activités liées au MAPS et les initiatives de formation à l’échelle du système."]),
   P("Section 7.2 (bis) — Sources de Financement des Institutions Membres","Le financement des Institutions Membres peut provenir des sources suivantes :"),
   L(null,["Ventes génératrices de revenus de produits, programmes et services liés à la santé.","Frais d’abonnement pour les programmes de santé et de bien-être.","Philanthropie, dons et cadeaux.","Allocations, soutien et investissements en capital des entités adventistes qui les parrainent.","Investissements sociaux de tiers.","Prêts bancaires, et fonds renouvelables ou de pension de l’Église."]),
   P("Section 7.3 — Fonds de Solidarité et de Renforcement du Système","Le Bureau de l’AHSIA maintiendra un Fonds de Solidarité et de Renforcement du Système pour soutenir :"),
   L(null,["Les institutions ayant des besoins financiers majeurs.","Les institutions situées dans des régions vulnérables ou mal desservies.","Les institutions progressant dans les niveaux d’accréditation.","Les initiatives de mission et de santé communautaire alignées sur le modèle MAPS."]),
   P(null,"Ce fonds comprendra un mécanisme de capital renouvelable, avec la participation des Unions, des Institutions Membres, de la Division Interaméricaine, d’organisations philanthropiques et d’investisseurs à impact potentiels. Les allocations de ce fonds seront approuvées par le Conseil d’Administration de l’AHSIA."),
   P("Section 7.4 — Redevabilité Financière du Bureau de l’AHSIA","Le Bureau de l’AHSIA doit :"),
   L(null,["Maintenir des registres financiers transparents et auditables.","Fournir des rapports financiers annuels au Conseil d’Administration de l’AHSIA.","Assurer la conformité avec les politiques financières de l’IAD et de la Conférence Générale.","Se soumettre à des examens ou audits financiers réguliers selon les exigences de l’IAD."]),
   P("Section 7.5 — Rapportage Financier Institutionnel","Les Institutions Membres doivent :"),
   L(null,["Participer au rapportage financier MSQ et à l’analyse comparative à l’échelle du système.","Maintenir la conformité avec les politiques financières et les normes comptables adventistes.","Coopérer aux analyses financières et évaluations comparatives à l’échelle du système."]),
   N("Limitation : le Bureau de l’AHSIA n’interviendra pas dans la gouvernance financière interne des Institutions Membres."),
   P("Section 7.6 — Utilisation des Fonds","Les fonds administrés par le Bureau de l’AHSIA seront utilisés exclusivement pour :"),
   L(null,["Le développement et le renforcement du système.","L’avancement de la mission et des initiatives de santé communautaire.","L’accréditation et l’amélioration de la qualité.","Le développement du leadership et la formation.","Les initiatives du Mouvement de Santé Totale.","Les opérations administratives du Bureau de l’AHSIA."]),
   N("Aucun fonds ne sera utilisé pour soutenir la participation à la gouvernance des Partenaires Techniques ou des Conseillers Principaux.")
 ]},
{num:8, roman:"VIII", title:"Partenaires Techniques",
 original:[
   H("Comme l’Article IX de 2022 — Partenaires Opérationnels"),
   P(null,"L’AHSIA recherche et entretient des relations étroites avec les acteurs pertinents du domaine de la santé opérant sous l’égide de la Conférence Générale. En particulier, la relation avec l’AHI (Adventist Health International) sera définie par un protocole d’accord (MOU) entre les deux organisations, afin d’assister la gestion des organisations de santé de l’IAD.")
 ],
 updated:[
   P("Section 8.1 — Nature des Partenariats Opérationnels","L’AHSIA peut collaborer avec des organisations externes — adventistes ou non adventistes — qui apportent une expertise technique, une formation, de la recherche, un soutien missionnaire ou des ressources pour le développement du système. Ces organisations sont reconnues comme Partenaires Techniques."),
   P("Section 8.2 — Objet des Partenariats","Les partenariats opérationnels visent à soutenir :"),
   L(null,["La mise en œuvre des Modèles Adventistes de Santé.","L’avancement de la qualité et de la sécurité des patients.","Le développement du leadership et la formation.","La santé numérique et les systèmes de données.","L’accréditation et l’alignement avec les modèles MAPS/MASH.","Les initiatives de santé communautaire et de mission.","Un soutien technique spécialisé selon les besoins.","Le soutien financier.","Les dons de matériel et d’équipement."]),
   P("Section 8.3 — Protocoles d’Accord (MOU)","Le Bureau de l’AHSIA peut conclure des protocoles d’accord avec des Partenaires Techniques pour définir la portée de la collaboration. Ces protocoles doivent :"),
   L(null,["Soutenir le développement du système.","Respecter la propriété institutionnelle.","Préserver l’autonomie de gouvernance de l’AHSIA.","Éviter tout transfert d’autorité ou de contrôle de gestion."])
 ]},
{num:9, roman:"IX", title:"Responsabilité et Indemnisation",
 original:[
   H("Comme l’Article X de 2022"),
   P(null,"Cette organisation et ses partenaires ne sont responsables d’aucune responsabilité, de quelque nature que ce soit, découlant des activités de l’une quelconque des entités de santé qui la composent, comme cela doit être indiqué dans leurs statuts respectifs.")
 ],
 updated:[
   P("Section 9.1 — Responsabilité Institutionnelle","Chaque Institution Membre est seule responsable de ses propres activités, dettes, obligations et expositions juridiques. Le Bureau de l’AHSIA, la Division Interaméricaine et les autres Institutions Membres ne sauraient être tenus responsables des réclamations découlant des actes, omissions ou activités d’une institution individuelle."),
   P("Section 9.2 — Responsabilité du Bureau de l’AHSIA","Le Bureau de l’AHSIA n’est responsable que des obligations découlant directement de ses propres actes, décisions et opérations autorisés par le Conseil d’Administration. Les Institutions Membres ne sauraient être tenues responsables des actes ou obligations du Bureau de l’AHSIA."),
   P("Section 9.3 — Partenaires Techniques et Conseillers Principaux","Les Partenaires Techniques et les Conseillers Principaux exercent strictement des fonctions consultatives ou techniques. Ils ne détiennent aucune autorité de gouvernance, n’assument aucune responsabilité opérationnelle et n’encourent aucune responsabilité pour les actes du Bureau de l’AHSIA ou des Institutions Membres ; de même, le Bureau de l’AHSIA et les Institutions Membres n’assument aucune responsabilité pour les actes ou omissions des Partenaires Techniques ou des Conseillers Principaux."),
   P("Section 9.4 — Exigence Relative aux Statuts Institutionnels","Chaque Institution Membre doit inclure dans ses propres statuts une déclaration précisant qu’elle est seule responsable de ses propres obligations, qu’elle n’assume aucune responsabilité pour le Bureau de l’AHSIA ou pour d’autres Institutions Membres, et que sa participation à l’AHSIA ne crée aucune responsabilité partagée ou solidaire."),
   P("Section 9.5 — Exigence d’Assurance Responsabilité Professionnelle","Toutes les Institutions Membres du Réseau de l’AHSIA doivent participer au Programme d’Assurance Groupe de Responsabilité Professionnelle établi par la Division Interaméricaine par l’intermédiaire d’Adventist Risk Management (ARM). Les institutions qui ne participent pas à ce programme groupé doivent fournir la preuve documentée d’un plan d’assurance responsabilité professionnelle, contracté localement ou internationalement, dont la couverture, les limites et les protections sont comparables ou supérieures au programme groupé de l’ARM. Le Bureau de l’AHSIA se réserve le droit d’examiner cette preuve et de déterminer si la couverture alternative répond aux normes du système.")
 ]},
{num:10, roman:"X", title:"Dissolution",
 original:[
   H("Comme l’Article XI de 2022"),
   P(null,"En cas de dissolution de l’AHSIA, et une fois toutes ses obligations satisfaites, le Comité Exécutif de l’IAD distribuera de manière discrétionnaire les actifs restants entre les institutions participantes.")
 ],
 updated:[
   P("Section 10.1 — Autorité de Dissolution","L’AHSIA ne peut être dissoute que par un vote de la Constituante de l’AHSIA, convoquée en session régulière ou spéciale, et ratifié par le Comité Exécutif de la Division Interaméricaine."),
   P("Section 10.2 — Dissolution du Bureau de l’AHSIA","En cas de dissolution du Bureau de l’AHSIA, toutes les obligations, dettes et responsabilités juridiques en cours doivent être pleinement satisfaites avant toute distribution des actifs restants."),
   P("Section 10.3 — Distribution des Actifs","Une fois toutes les obligations satisfaites, les actifs restants du Bureau de l’AHSIA seront distribués par le Comité Exécutif de l’IAD comme suit :"),
   L(null,["Premièrement, pour soutenir la poursuite de la mission, de la formation et du développement du système de santé adventiste au sein de la Division Interaméricaine.","Deuxièmement, pour renforcer les Institutions Membres du Réseau de l’AHSIA, en donnant la priorité aux institutions situées dans des régions vulnérables ou mal desservies.","Troisièmement, aux entités adventistes de santé ou d’éducation au sein de la Division Interaméricaine dont la mission est alignée sur le Mouvement de Santé Totale."]),
   N("Aucun actif ne sera transféré à un Partenaire Technique, un Conseiller Principal ou une organisation externe."),
   P("Section 10.4 — Continuité des Institutions Membres","La dissolution du Bureau de l’AHSIA ne dissout ni ne modifie le statut juridique, la propriété ou la gouvernance d’aucune Institution Membre au sein du Réseau de l’AHSIA. Chaque institution continuera de fonctionner sous sa propre entité de l’Église adventiste."),
   P("Section 10.5 — Dissolution des Institutions Membres","La dissolution de toute Institution Membre au sein du Réseau de l’AHSIA ne peut être décidée que par l’entité de l’Église adventiste qui en est propriétaire. Ni le Bureau de l’AHSIA ni le Conseil d’Administration de l’AHSIA n’ont autorité pour dissoudre une Institution Membre."),
   P("Section 10.6 — Registres et Archives","Lors de la dissolution, tous les registres officiels, documents d’accréditation, rapports MSQ et archives historiques du Bureau de l’AHSIA seront transférés à la Division Interaméricaine pour conservation."),
   P("Section 10.7 — Conformité Légale","Le processus de dissolution doit se conformer à toutes les lois, règlements et politiques applicables de la Division Interaméricaine et de la Conférence Générale des Adventistes du Septième Jour.")
 ]},
{num:11, roman:"XI", title:"Conflit d’Intérêts",
 original:[ N(NEW_ARTICLE_NOTE_FR) ],
 updated:[
   P("Section 11.1 — Objet","Le présent article a pour objet de garantir que toutes les décisions et actions prises au sein de l’AHSIA le soient dans le meilleur intérêt du Réseau de l’AHSIA, à l’abri de toute influence indue, gain personnel ou loyauté concurrente."),
   P("Section 11.2 — Champ d’Application","Cette politique s’applique à :"),
   L(null,["Les membres du Conseil d’Administration de l’AHSIA.","Les délégués de la Constituante de l’AHSIA.","Les dirigeants du Bureau de l’AHSIA.","Les directeurs et vice-présidents du Bureau de l’AHSIA.","Les Conseillers Principaux, lorsqu’ils agissent à titre consultatif.","Toute personne participant aux comités, aux équipes d’accréditation ou aux processus décisionnels de l’AHSIA."]),
   P("Section 11.3 — Définition du Conflit d’Intérêts","Un conflit d’intérêts existe lorsque les intérêts personnels, financiers, professionnels ou relationnels d’une personne pourraient raisonnablement être perçus comme influençant, compromettant ou biaisant son jugement ou ses actions au nom de l’AHSIA. Les conflits peuvent inclure :"),
   L(null,["Des intérêts financiers dans un fournisseur, un entrepreneur ou une organisation partenaire.","Des relations d’emploi ou de consultation avec des Institutions Membres ou des Partenaires Techniques.","Des relations familiales ou personnelles étroites avec des personnes affectées par des décisions de l’AHSIA.","Des rôles doubles créant des loyautés divisées.","Des cadeaux, faveurs ou avantages susceptibles d’influencer la prise de décision.","La participation à des décisions dont la personne pourrait tirer un avantage personnel ou professionnel."]),
   P("Section 11.4 — Obligation de Divulgation","Toutes les personnes visées par cet article doivent :"),
   L(null,["Divulguer par écrit au Président de l’AHSIA ou au Président du Conseil tout conflit d’intérêts réel, potentiel ou perçu.","Mettre à jour les divulgations chaque année et chaque fois que les circonstances changent.","S’abstenir de participer aux discussions ou aux votes relatifs au conflit divulgué."]),
   P("Section 11.5 — Exigences de Récusation","Toute personne ayant un conflit d’intérêts doit :"),
   L(null,["S’abstenir de voter.","Quitter la réunion pendant les délibérations.","Ne pas tenter d’influencer la décision.","Ne pas recevoir d’informations confidentielles relatives à l’affaire."]),
   P(null,"Le Conseil d’Administration consignera toutes les récusations dans les procès-verbaux officiels."),
   P("Section 11.6 — Conduite Interdite","Les actions suivantes sont strictement interdites :"),
   L(null,["Utiliser sa position à des fins de gain personnel ou financier.","Accepter des cadeaux, paiements ou avantages destinés à influencer des décisions.","Participer à des décisions d’approvisionnement impliquant une partie liée.","Occuper simultanément des rôles compromettant l’indépendance ou l’objectivité.","Utiliser des informations confidentielles à des fins d’avantage personnel."]),
   P("Section 11.7 — Examen et Détermination","Le Conseil d’Administration examinera toutes les divulgations et déterminera l’existence d’un conflit. Le Conseil peut :"),
   L(null,["Exiger une récusation.","Demander des informations supplémentaires.","Imposer des mesures correctives.","Retirer une personne de son rôle, si nécessaire."]),
   P("Section 11.8 — Violations","Le défaut de divulguer un conflit d’intérêts, ou la violation de cette politique, peut entraîner :"),
   L(null,["Le retrait du Conseil d’Administration.","Le retrait du Bureau de l’AHSIA.","La cessation des fonctions consultatives.","La disqualification des équipes d’accréditation.","D’autres mesures disciplinaires déterminées par le Conseil d’Administration."]),
   P("Section 11.9 — Transparence","Le Bureau de l’AHSIA tiendra un registre confidentiel de toutes les divulgations de conflits d’intérêts et veillera à ce que le Conseil d’Administration reçoive des rapports annuels de conformité.")
 ]},
{num:12, roman:"XII", title:"Annexes",
 original:[ N(NEW_ARTICLE_NOTE_FR) ],
 updated:[
   P("Section 12.1 — Objet et Autorité des Annexes","Afin d’assurer une gouvernance normalisée, une harmonie opérationnelle et l’intégrité missionnaire à travers le Réseau de Santé Adventiste, les politiques, chartes et directives opérationnelles spécifiques régissant les Institutions Membres sont établies dans les Annexes jointes à la présente Constitution."),
   P("Section 12.2 — Caractère Contraignant","Les dispositions contenues dans ces Annexes sont juridiquement contraignantes pour toutes les Institutions Membres de l’AHSIA. Chaque Institution Membre doit aligner ses statuts locaux, ses politiques opérationnelles et ses structures de conseil sur les normes définies dans ces Annexes."),
   P("Section 12.3 — Modification et Révision des Annexes","Contrairement aux articles principaux de la présente Constitution, qui requièrent la ratification de la Constituante et du Comité Exécutif de l’IAD, les Annexes peuvent être révisées, modifiées ou mises à jour à la majorité simple du Conseil d’Administration de l’AHSIA lors de l’une quelconque de ses sessions régulières, en consultation avec la Division Interaméricaine. Cela permet aux directives opérationnelles de demeurer flexibles et réactives face à l’évolution de l’environnement de santé, tout en préservant la stabilité de la Constitution centrale."),
   N("Le texte complet des Annexes I à IX (composition du Conseil d’Administration, Comité Exécutif, Comité des Finances et de l’Audit, Comité de la Qualité et de la Sécurité des Patients, Comité de l’Orientation Missionnaire, la Charte des Droits des Patients/Employés/Usagers, le Code d’Éthique, la Charte de Gouvernance des Données, et le Système d’Accréditation de l’AHSIA) est disponible dans le document complet de la constitution, accessible depuis la page d’Introduction.")
 ]},
{num:13, roman:"XIII", title:"Normes de Modification des Statuts pour les Institutions Membres",
 original:[ N(NEW_ARTICLE_NOTE_FR) ],
 updated:[
   P("Section 13.1 — Objet et Autorité","Les entités ecclésiastiques de tutelle (Unions ou Champs locaux) conservent l’autorité ultime. Aucune modification locale n’est valide sans la ratification de l’Union et l’examen consultatif du Bureau de l’AHSIA."),
   P("Section 13.2 — Proposants","Les propositions sont limitées aux dirigeants de l’Union, au Président du Conseil, au directeur général local, ou à une pétition écrite signée par un tiers du conseil local."),
   P("Section 13.3 — Calendrier Obligatoire","Impose un calendrier rigoureux : soumission en 90 jours, préavis de 60 jours, vote des deux tiers du conseil, et ratification écrite finale par le Comité Exécutif de l’Union."),
   P("Section 13.4 — Restrictions Fondamentales","Interdit toute modification qui :"),
   L(null,["Modifierait la propriété ecclésiastique des biens matériels.","Transférerait la gouvernance à des tiers.","Accorderait des droits de vote aux Partenaires Techniques ou aux Conseillers Principaux.","Entrerait en conflit avec la Politique de Travail de l’IAD/CG.","Diluerait l’identité adventiste du septième jour, y compris l’observation du sabbat, l’alimentation végétarienne et le Mouvement de Santé Totale."]),
   P("Sections 13.5 et 13.6 — Administration et Entrée en Vigueur","Normalise les corrections rédactionnelles non substantielles et établit la date d’entrée en vigueur dès la ratification de l’Union.")
 ]}
];

var SUMMARY_ES = [
 {n:1, title:"Nombre, Historia y Sede", map:"Art. I 2026 ↔ Art. I 2022", text:"Establece el nombre, el origen histórico (20 de mayo de 2010) y la sede de AHSIA en la oficina de la División Interamericana en Miami, Florida. Crucialmente, la revisión de 2026 introduce una distinción estructural vital: AHSIA como una entidad dual compuesta por la “Red de Salud Adventista” (el grupo coordinado de clínicas y hospitales miembro locales) y la “Oficina de AHSIA” central (responsable de la alineación misional, la acreditación y la evaluación de calidad). Esta distinción es estratégicamente relevante porque previene la confusión legal y administrativa entre las instalaciones clínicas locales y el cuerpo regulador central."},
 {n:2, title:"Miembros", map:"Art. II 2026 ↔ Art. II 2022", text:"Define la membresía dentro de la red para incluir todas las instalaciones de salud adventistas del séptimo día (hospitales, clínicas ambulatorias, centros de estilo de vida, clínicas móviles y servicios comunitarios) propiedad de, u operadas por, una entidad eclesiástica dentro de la División Interamericana. La actualización de 2026 formaliza estas instalaciones como la “Red de Salud Adventista” colectiva. Su relevancia estratégica radica en definir claramente los límites legales y eclesiásticos de la red, asegurando que solo las entidades reconocidas oficialmente y propiedad de la iglesia puedan reclamar la membresía en la red y beneficiarse de sus recursos."},
 {n:3, title:"Propósito", map:"Art. III 2026 ↔ Art. III 2022", text:"Este artículo describe los deberes centrales de la Oficina de AHSIA: salvaguardar la alineación misional adventista del séptimo día, establecer modelos del sistema, gestionar el sistema de acreditación progresivo, realizar el monitoreo de calidad y brindar apoyo financiero y de desarrollo de capacidades operativas. Traslada el enfoque de las “aspiraciones” institucionales generales de 2022 hacia responsabilidades operativas concretas. Esta revisión es de suma relevancia porque exige la integración de la Filosofía Adventista de Salud Integral (Movimiento de Salud Total) en toda práctica clínica y administrativa, asegurando que el crecimiento clínico nunca comprometa la integridad espiritual."},
 {n:4, title:"Operaciones", map:"Art. IV 2026 ↔ Art. IV (Objetivos) y Art. V (Operación) 2022", text:"Este artículo modernizado establece el sistema de gobernanza de tres niveles de AHSIA: la Asamblea Constituyente de AHSIA, la Junta Directiva de AHSIA (de número impar) y el Liderazgo Ejecutivo de AHSIA (Oficina de AHSIA). Describe la composición específica y rotativa de la junta, que incluye representantes de Unión, directores ejecutivos locales y profesionales laicos. La relevancia estratégica de esta reescritura es doble: proporciona mecanismos estructurales de control y equilibrio, y prohíbe explícitamente que la Oficina de AHSIA interfiera en las operaciones diarias de las instituciones miembro, preservando así la autonomía administrativa y legal de las juntas locales."},
 {n:5, title:"Funciones de los Oficiales", map:"Art. V 2026 ↔ Art. V 2022 (secciones del Presidente y del Tesorero)", text:"Este artículo detalla los deberes específicos del Presidente, los Vicepresidentes regionales o funcionales, el Secretario y el Tesorero de la Oficina de AHSIA, además de definir el rol de los Asesores Principales. Su relevancia estratégica crítica radica en la inclusión de límites operativos estrictos: al Tesorero se le prohíbe intervenir en las decisiones financieras de las juntas locales, y los Asesores Principales se limitan estrictamente a funciones técnicas de asesoría sin voto. Esto previene la injerencia administrativa central y protege los límites legales y financieros de las entidades eclesiásticas locales."},
 {n:6, title:"Quórum", map:"Art. VI 2026 ↔ Art. VI 2022", text:"La revisión de 2026 reemplaza la regla de quórum única y vaga de 2022 por dos umbrales claros y distintos: un quórum de reunión de la Constituyente que requiere una mayoría simple de delegados acreditados, y un quórum de reunión de la Junta Directiva que requiere siete (7) miembros, incluido el Presidente o su designado. Esta división precisa asegura la legalidad procesal, evita que resoluciones votadas por una minoría vinculen al sistema, y refuerza una disciplina administrativa rigurosa durante la toma de decisiones de alto nivel."},
 {n:7, title:"Finanzas", map:"Art. VII 2026 ↔ Art. VII 2022 (puntos 1–3)", text:"Este artículo ampliado describe las estructuras financieras de la Oficina de AHSIA y de las Instituciones Miembro, e introduce el Fondo de Solidaridad y Fortalecimiento del Sistema — un fondo de capital rotativo diseñado para asistir a las clínicas vulnerables o con acreditación insuficiente. Estratégicamente, este artículo es de máxima relevancia porque refuerza la rendición de cuentas financiera conforme a las políticas de la Asociación General y la IAD, exige que las instituciones locales presenten reportes financieros mensuales a la Oficina de AHSIA a más tardar el día 15, y prohíbe explícitamente el uso de fondos de la red para apoyar a los Socios Técnicos."},
 {n:8, title:"Socios Técnicos", map:"Art. VIII 2026 ↔ Art. IX 2022 (Socios Operativos)", text:"Este artículo regula la colaboración con organizaciones externas adventistas y no adventistas (como la Universidad de Loma Linda, AdventHealth o ADRA) mediante memorandos de entendimiento (MOU) formales. Es altamente relevante porque protege legalmente a la red al declarar que todo MOU debe respetar estrictamente la propiedad institucional local, proteger la autonomía de gobernanza de AHSIA y evitar toda transferencia de autoridad administrativa o de decisión a terceros."},
 {n:9, title:"Responsabilidad e Indemnización", map:"Art. IX 2026 ↔ Art. X 2022", text:"Este artículo separa las responsabilidades legales de la Oficina de AHSIA, las Instituciones Miembro individuales y los Socios Técnicos, estableciendo que cada uno es únicamente responsable de sus propias acciones. Una actualización estratégica crítica en 2026 es el requisito obligatorio de que todas las Instituciones Miembro participen en el Seguro Grupal de Responsabilidad Profesional de la División Interamericana a través de Adventist Risk Management (ARM), o mantengan una póliza independiente equivalente o superior. Esto protege a las entidades eclesiásticas locales y a la denominación en general de una devastación financiera conjunta derivada de litigios clínicos localizados."},
 {n:10, title:"Disolución", map:"Art. X 2026 ↔ Art. XI 2022", text:"Este artículo establece que AHSIA solo puede disolverse mediante un voto de la Constituyente ratificado por el Comité Ejecutivo de la IAD, y define la distribución progresiva de los activos restantes hacia los ministerios de salud adventistas desatendidos. El núcleo estratégico de este artículo es la Sección 10.4, que garantiza que la disolución de la Oficina de AHSIA no disolverá ni alterará el estatus legal, la propiedad eclesiástica ni la gobernanza local de las Instituciones Miembro individuales, protegiendo así los activos regionales de una posible pérdida."},
 {n:11, title:"Conflicto de Intereses", map:"Nuevo — sin artículo correspondiente en 2022", text:"Este artículo completamente nuevo introduce una política integral de conflicto de intereses aplicable a todos los miembros de junta, oficiales, delegados y asesores. Define los conflictos, establece obligaciones anuales de divulgación por escrito, exige la recusación inmediata durante discusiones y votaciones que involucren a partes relacionadas, y establece sanciones disciplinarias por violaciones. Esta adición es altamente relevante para 2026, ya que asegura la transparencia, previene el nepotismo y protege la reputación ética y espiritual del sistema de salud de la iglesia."},
 {n:12, title:"Anexos", map:"Nuevo — sin artículo correspondiente en 2022", text:"Este nuevo artículo sirve como puente legal que autoriza la incorporación de políticas, cartas y directrices operativas vinculantes y especializadas para las Instituciones Miembro (como las pautas de junta locales, la gobernanza de datos y el código de ética). Representa una mejora legislativa significativa: permite que estos anexos operativos detallados sean enmendados por mayoría simple de la Junta Directiva de AHSIA. Esto brinda a la red flexibilidad y agilidad operativa, permitiendo que las directrices se adapten a un entorno de salud cambiante sin requerir una ratificación completa y costosa de la Constituyente."},
 {n:13, title:"Normas de Enmienda de Estatutos para las Instituciones Miembro", map:"Nuevo — sin artículo correspondiente en 2022", text:"Este nuevo artículo estandariza la manera en que las Instituciones Miembro locales pueden enmendar sus estatutos, estableciendo un cronograma de 90 días para la presentación, un requisito de voto de dos tercios de la junta, y la ratificación obligatoria por parte del Comité Ejecutivo de la Unión patrocinadora. Su relevancia estratégica crítica radica en la cláusula de “Restricciones Fundamentales”, que prohíbe estrictamente toda enmienda local que intente alterar la propiedad eclesiástica de los bienes, transferir la gestión a terceros, otorgar derechos de junta a los Socios Técnicos, o diluir los estándares de salud integral adventista del séptimo día. Esto asegura de manera permanente la identidad denominacional y la propiedad eclesiástica de todos los hospitales y clínicas de la red."}
];

var SUMMARY_FR = [
 {n:1, title:"Nom, Historique et Siège", map:"Art. I 2026 ↔ Art. I 2022", text:"Cet article établit le nom, l’origine historique (20 mai 2010) et le siège de l’AHSIA au bureau de la Division Interaméricaine à Miami, en Floride. Fait crucial, la révision de 2026 introduit une distinction structurelle essentielle en définissant l’AHSIA comme une entité double composée du « Réseau de Santé Adventiste » (le groupe coordonné de cliniques et hôpitaux membres locaux) et du « Bureau de l’AHSIA » central (responsable de l’alignement missionnaire, de l’accréditation et de l’évaluation de la qualité). Cette distinction est stratégiquement pertinente car elle prévient toute confusion juridique et administrative entre les établissements cliniques locaux et l’organe de régulation central."},
 {n:2, title:"Membres", map:"Art. II 2026 ↔ Art. II 2022", text:"Cet article définit l’appartenance au réseau afin d’inclure tous les établissements de santé adventistes du septième jour (hôpitaux, cliniques ambulatoires, centres de style de vie, cliniques mobiles et services communautaires) détenus ou exploités par une entité de l’Église au sein de la Division Interaméricaine. La mise à jour de 2026 formalise ces établissements en tant que « Réseau de Santé Adventiste » collectif. Sa pertinence stratégique réside dans la définition claire des limites juridiques et ecclésiastiques du réseau, garantissant que seules les entités officiellement reconnues et détenues par l’Église puissent revendiquer l’appartenance au réseau et bénéficier de ses ressources."},
 {n:3, title:"Objet", map:"Art. III 2026 ↔ Art. III 2022", text:"Cet article décrit les responsabilités fondamentales du Bureau de l’AHSIA : préserver l’alignement missionnaire adventiste du septième jour, établir des modèles de système, gérer le système d’accréditation progressif, assurer le suivi de la qualité et fournir un appui financier et un renforcement des capacités opérationnelles. Il déplace l’accent des « ambitions » institutionnelles générales de 2022 vers des responsabilités opérationnelles concrètes. Cette révision est hautement pertinente car elle impose l’intégration de la Philosophie Adventiste de la Santé Globale (Mouvement de Santé Totale) dans toutes les pratiques cliniques et administratives, garantissant que la croissance clinique ne compromette jamais l’intégrité spirituelle."},
 {n:4, title:"Fonctionnement", map:"Art. IV 2026 ↔ Art. IV (Objectifs) et Art. V (Fonctionnement) 2022", text:"Cet article modernisé établit le système de gouvernance à trois niveaux de l’AHSIA : la Constituante de l’AHSIA, le Conseil d’Administration de l’AHSIA (à nombre impair de membres) et la Direction Exécutive de l’AHSIA (Bureau de l’AHSIA). Il décrit la composition spécifique et rotative du conseil, incluant des représentants des Unions, des directeurs généraux locaux et des professionnels laïcs. La pertinence stratégique de cette réécriture est double : elle instaure des mécanismes structurels de contrôle et d’équilibre, et interdit explicitement au Bureau de l’AHSIA de s’immiscer dans les opérations quotidiennes des institutions membres, préservant ainsi l’autonomie administrative et juridique des conseils locaux."},
 {n:5, title:"Fonctions des Dirigeants", map:"Art. V 2026 ↔ Art. V 2022 (sections relatives au Président et au Trésorier)", text:"Cet article détaille les fonctions spécifiques du Président, des Vice-présidents régionaux ou fonctionnels, du Secrétaire et du Trésorier du Bureau de l’AHSIA, tout en définissant le rôle des Conseillers Principaux. Sa pertinence stratégique critique réside dans l’inclusion de limitations opérationnelles strictes : il est interdit au Trésorier d’intervenir dans les décisions financières des conseils locaux, et les Conseillers Principaux sont strictement cantonnés à des rôles techniques consultatifs sans droit de vote. Cela prévient toute ingérence administrative centrale et protège les limites juridiques et financières des entités ecclésiastiques locales."},
 {n:6, title:"Quorum", map:"Art. VI 2026 ↔ Art. VI 2022", text:"La révision de 2026 remplace la règle de quorum unique et vague de 2022 par deux seuils clairs et distincts : un quorum de réunion de la Constituante exigeant une majorité simple des délégués accrédités, et un quorum de réunion du Conseil d’Administration exigeant sept (7) membres, y compris le Président ou son représentant désigné. Cette division précise garantit la légalité procédurale, empêche les résolutions votées par une minorité de lier le système, et impose une discipline administrative rigoureuse lors des prises de décision de haut niveau."},
 {n:7, title:"Finances", map:"Art. VII 2026 ↔ Art. VII 2022 (points 1–3)", text:"Cet article élargi décrit les structures financières du Bureau de l’AHSIA et des Institutions Membres, et introduit le Fonds de Solidarité et de Renforcement du Système — un fonds de capital renouvelable destiné à aider les cliniques vulnérables ou insuffisamment accréditées. Sur le plan stratégique, cet article revêt une importance capitale car il renforce la redevabilité financière conformément aux politiques de la Conférence Générale et de l’IAD, exige que les institutions locales soumettent des rapports financiers mensuels au Bureau de l’AHSIA au plus tard le 15 du mois, et interdit explicitement l’utilisation des fonds du réseau pour soutenir les Partenaires Techniques."},
 {n:8, title:"Partenaires Techniques", map:"Art. VIII 2026 ↔ Art. IX 2022 (Partenaires Opérationnels)", text:"Cet article régit la collaboration avec des organisations externes, adventistes et non adventistes (telles que l’Université Loma Linda, AdventHealth ou ADRA), au moyen de protocoles d’accord (MOU) formels. Il est hautement pertinent car il protège juridiquement le réseau en déclarant que tout MOU doit strictement respecter la propriété institutionnelle locale, préserver l’autonomie de gouvernance de l’AHSIA, et empêcher tout transfert d’autorité administrative ou décisionnelle à des tiers."},
 {n:9, title:"Responsabilité et Indemnisation", map:"Art. IX 2026 ↔ Art. X 2022", text:"Cet article distingue les responsabilités juridiques du Bureau de l’AHSIA, des Institutions Membres individuelles et des Partenaires Techniques, chacun étant seul responsable de ses propres actes. Une mise à jour stratégique majeure de 2026 est l’exigence obligatoire pour toutes les Institutions Membres de participer à l’Assurance Groupe de Responsabilité Professionnelle de la Division Interaméricaine par l’intermédiaire d’Adventist Risk Management (ARM), ou de détenir une police indépendante équivalente ou supérieure. Cela protège les entités ecclésiastiques locales et la dénomination dans son ensemble contre une dévastation financière conjointe résultant de litiges cliniques localisés."},
 {n:10, title:"Dissolution", map:"Art. X 2026 ↔ Art. XI 2022", text:"Cet article établit que l’AHSIA ne peut être dissoute que par un vote de la Constituante, ratifié par le Comité Exécutif de l’IAD, et définit la distribution progressive des actifs restants vers les ministères de santé adventistes mal desservis. Le cœur stratégique de cet article est la Section 10.4, qui garantit que la dissolution du Bureau de l’AHSIA ne dissoudra ni ne modifiera le statut juridique, la propriété ecclésiastique ou la gouvernance locale des Institutions Membres individuelles, protégeant ainsi les actifs régionaux contre toute perte."},
 {n:11, title:"Conflit d’Intérêts", map:"Nouveau — aucun article correspondant en 2022", text:"Cet article entièrement nouveau introduit une politique complète de conflit d’intérêts applicable à tous les membres de conseil, dirigeants, délégués et conseillers. Il définit les conflits, impose des obligations annuelles de divulgation écrite, exige une récusation immédiate lors des discussions et votes impliquant des parties liées, et prévoit des sanctions disciplinaires en cas de violation. Cet ajout est hautement pertinent pour 2026, car il assure la transparence, prévient le népotisme et protège la réputation éthique et spirituelle du système de santé de l’Église."},
 {n:12, title:"Annexes", map:"Nouveau — aucun article correspondant en 2022", text:"Ce nouvel article sert de pont juridique autorisant l’intégration de politiques, chartes et directives opérationnelles contraignantes et spécialisées pour les Institutions Membres (telles que les directives des conseils locaux, la gouvernance des données et le code d’éthique). Il représente une amélioration législative significative : il permet à ces annexes opérationnelles détaillées d’être modifiées à la majorité simple du Conseil d’Administration de l’AHSIA. Cela confère au réseau une flexibilité et une agilité opérationnelles, permettant aux directives de s’adapter à un environnement de santé en constante évolution sans nécessiter une ratification complète et coûteuse de la Constituante."},
 {n:13, title:"Normes de Modification des Statuts pour les Institutions Membres", map:"Nouveau — aucun article correspondant en 2022", text:"Ce nouvel article normalise la façon dont les Institutions Membres locales peuvent modifier leurs propres statuts, en établissant un calendrier de soumission de 90 jours, une exigence de vote aux deux tiers du conseil, et une ratification obligatoire par le Comité Exécutif de l’Union de tutelle. Sa pertinence stratégique critique réside dans la clause des « Restrictions Fondamentales », qui interdit strictement toute modification locale visant à altérer la propriété ecclésiastique des biens, à transférer la gestion à des tiers, à accorder des droits de conseil aux Partenaires Techniques, ou à diluer les normes de santé globale adventiste du septième jour. Cela garantit de façon permanente l’identité dénominationnelle et la propriété ecclésiastique de tous les hôpitaux et cliniques du réseau."}
];

var ANNEXES_EN = [
{id:"I", title:"Governing Board Composition and Operational Guidelines for AHSIA Member Institutions",
 blocks:[
   H("Section 1 — General Framework"),
   L(null,[
     "Role and Purpose: The Governing Board (or Board of Trustees) is the strategic governance body of the healthcare institutions of the Inter-American Division (IAD).",
     "Establishment: The Governing Board is formally established by the constituents of the sponsoring entity during its regular session every five (5) years.",
     "Cycle: It is highly recommended that this mandate coincide with the regular five (5)-year administrative cycles of the world Seventh-day Adventist Church.",
     "Compliance: The Governing Board operates in strict accordance with the policies of the Inter-American Division, AHSIA-Office standards, and the core governance principles of the Adventist health system.",
     "Primary Responsibilities: The Governing Board is primarily responsible for the mission, quality, compliance, strategic planning, and budgeting of the Member Institution."
   ]),
   H("Section 2 — Composition of the Governing Board"),
   P(null,"To ensure professional management, spiritual leadership, and local accountability, the composition of the Board shall consist of mandatory statutory members and optional members."),
   L("2.1 Statutory Members (Mandatory) — the Governing Board of each Member Institution must be composed of:",[
     "The Administrators of the Sponsoring Entity (President, Secretary, Treasurer).",
     "If the Union is the sponsor, one or more Presidents of a local territory/field.",
     "The Health Ministries Director of the Union or the corresponding local field.",
     "The Institution's Chief Executive Officer (CEO) or Administrator.",
     "Professional local or international laypersons with advanced expertise in relevant fields (including but not limited to: management, finance, law, health, and medicine).",
     "One Seventh-day Adventist layperson representing the community of users of the healthcare institution."
   ]),
   L("2.2 Optional Members — at the discretion of the Sponsoring Union, the Board may also include:",[
     "One representative of AHSIA-Office (highly recommended for hospitals and large healthcare institutions).",
     "Representatives from national or international partners."
   ]),
   H("Section 3 — Board Leadership"),
   L(null,[
     "Chair of the Governing Board: The President of the Sponsoring Entity or his/her designee shall serve as the Chair.",
     "Secretary of the Governing Board: The CEO of the Member Institution shall serve as the Secretary."
   ]),
   H("Section 4 — Mandate and Responsibilities"),
   P(null,"The Governing Board shall exercise the following functions to ensure institutional success and missional alignment:"),
   L(null,[
     "Define and safeguard the strategic and missional vision of the institution.",
     "Approve major institutional policies and operational procedures.",
     "Oversee the financial and operational performance of the institution.",
     "Ensure full compliance with local, national and regional laws, as well as the standards of AHSIA-Office, the Inter-American Division, and General Conference Health Ministries.",
     "Guarantee clinical quality, patient safety, and comprehensive risk management.",
     "Strengthen missional integration and Seventh-day Adventist identity across all services.",
     "Establish search committees for key administrative appointments (such as members of the administrative team) as considered necessary and proceed with nominations.",
     "Validate annual operating budgets, independent audits, and capital investment plans.",
     "Conduct the annual performance evaluation of the CEO and the executive leadership team."
   ]),
   H("Section 5 — Standing Committees of the Board"),
   P(null,"To streamline governance and provide focused oversight, the Governing Board shall establish standing committees with clear mandates:"),
   TB(["Committee","Chairperson","Primary Role"],[
     ["Executive Committee","Board Chair","Handles urgent decisions, close operational supervision, and follow-up on board resolutions."],
     ["Finance and Audit Committee","Treasurer of the Sponsoring Entity","Oversees institutional budgets, independent audits, investments, and financial risk management."],
     ["Quality and Patient Safety Committee","An expert Board Member","Monitors clinical quality, AHSIA accreditation progress, patient safety, and healthcare performance indicators."],
     ["Mission Focus Committee","Appointed Board Member","Safeguards Adventist identity, staff and patient spirituality, and promotes mission-focused health programs."]
   ]),
   H("Section 6 — Administrative Provisions"),
   L(null,[
     "Term of Office: Members of the Board are appointed for a five (5)-year term, aligned with the Sponsoring Union's administrative cycle, and may be reappointed.",
     "Meetings: The Governing Board shall meet at least twice (2) per year. Standing committees shall meet quarterly or as needed.",
     "Quorum: A quorum is constituted by five (5) to seven (7) voting members.",
     "Ethics & Confidentiality: All board and committee members must sign a Confidentiality Statement and a Conflict-of-Interest Statement annually.",
     "Revision: These guidelines and composition rules may be revised by the Sponsoring Entity at any time as deemed necessary."
   ])
 ]},
{id:"II", title:"Executive Committee of the Governing Board of AHSIA Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Authority"),
   P(null,"The Executive Committee of the Governing Board of each Member Institution is established to assist the Board in its governance duties between regular sessions. It acts as an advisory and executive body, handling delegated administrative matters to ensure the continuous and efficient operation of the healthcare institution."),
   L(null,[
     "Subordination: The Executive Committee is a subordinate body of the local Governing Board. It possesses no authority to amend institutional bylaws, approve annual operating budgets, appoint the Chief Executive Officer (CEO), or override decisions made by the full Governing Board.",
     "Delegated Authority: The full Governing Board may formally delegate specific, non-reserved decision-making powers to the Executive Committee to facilitate rapid administrative response."
   ]),
   H("Section 2 — Composition and Leadership"),
   P(null,"To maintain administrative alignment with the sponsoring Church entity and the institution's executive leadership, the Executive Committee shall be structured as follows:"),
   L(null,[
     "Chairperson: The Chairperson of the Governing Board (typically the President of the sponsoring Union or local Church field) shall serve as the Chair of the Executive Committee.",
     "Secretary: The Chief Executive Officer (CEO) / Administrator of the healthcare institution shall serve as the Secretary.",
     "Voting Members: the Treasurer of the sponsoring Church entity (or designee); at least one (1) professional or lay member of the Governing Board; key members of the institution's administrative team (e.g. Chief Financial Officer, Chief Medical Officer, or Chief Nursing Officer) may be appointed as voting or invitee members, as determined by the sponsoring entity's local board regulations."
   ]),
   H("Section 3 — Mandate and Key Responsibilities"),
   P(null,"The Executive Committee shall perform the following duties:"),
   L(null,[
     "Urgent Decisions: Review and act upon urgent institutional matters that arise between regular meetings of the Governing Board, which cannot wait for a full board session.",
     "Operational Supervision: Provide close and continuous supervision of the institution's daily administrative operations, ensuring alignment with the strategic plan approved by the Governing Board.",
     "Resolution Follow-Up: Monitor and ensure the systematic implementation of all policies, resolutions, and strategic directives voted by the full Governing Board.",
     "Strategic Advisory: Act as a sounding board for the CEO on critical operational issues, emergency management, and community relations.",
     "Policy Recommendations: Prepare and recommend operational guidelines and administrative policies for review and formal approval by the full Governing Board."
   ]),
   H("Section 4 — Meetings, Quorum, and Reporting"),
   L(null,[
     "Frequency: The Executive Committee shall meet at least quarterly, or more frequently as convened by the Chair or requested by the Secretary (CEO) in response to urgent operational needs.",
     "Quorum: A quorum for any meeting of the Executive Committee shall consist of a simple majority of its voting members, which must include either the Chair (or designated alternate) and the Secretary.",
     "Reporting: Detailed minutes of all Executive Committee meetings must be recorded by the Secretary. A comprehensive report of all actions, deliberations, and decisions taken by the Executive Committee must be submitted to the full Governing Board for review and formal ratification at its next scheduled session."
   ])
 ]},
{id:"III", title:"Finance and Audit Committee of the Governing Board of AHSIA Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Authority"),
   P(null,"The Finance and Audit Committee is a standing committee of the Governing Board of each Member Institution. It is established to ensure financial stewardship, transparency, internal control, and rigorous financial compliance across all institutional operations in harmony with the Seventh-day Adventist Church financial policies."),
   H("Section 2 — Composition and Leadership"),
   P(null,"To guarantee professional financial oversight and seamless integration with the Church's financial network:"),
   L(null,[
     "Chairperson: The Treasurer of the Sponsoring Entity (the Union or the local Church field) shall serve as the Chair.",
     "Secretary: The Chief Financial Officer (CFO) / Treasurer of the Member Institution shall serve as the Secretary.",
     "Members: at least two (2) members of the Governing Board who possess financial, accounting, or business expertise; the Chief Executive Officer (CEO) of the institution (ex-officio, non-voting or voting as determined by local board policies); lay professionals with corporate financial or auditing expertise, appointed by the Governing Board."
   ]),
   H("Section 3 — Key Responsibilities"),
   P(null,"The Finance and Audit Committee shall perform the following functions:"),
   L(null,[
     "Budget Analysis and Validation: Conduct in-depth analysis and validation of the annual operating and capital investment budgets before they are formally submitted to the full Governing Board for approval.",
     "Internal Control & Risk Management: Monitor and supervise internal control systems, financial policies, and accounting procedures to mitigate risk, prevent fraud, and protect institutional assets.",
     "Audit Coordination: Coordinate directly with external auditors, including the General Conference Auditing Service (GCAS) or authorized independent auditing firms. The committee shall review audit reports, evaluate the management letters, and monitor the implementation of corrective action plans.",
     "System-Wide Financial Reporting (MSQ): Ensure that the institution prepares and submits its monthly Financial Statements to AHSIA-Office by the 15th of each following month. This reporting is mandatory for financial benchmarking, comparative analysis, and MSQ (Mission Alignment, Systems Performance & Quality Assurance) evaluation."
   ]),
   H("Section 4 — Meetings and Reporting"),
   L(null,[
     "Frequency: The Finance and Audit Committee shall meet at least quarterly, preceding regular Governing Board sessions.",
     "Reporting: The committee shall submit comprehensive financial reports, audit evaluations, and budget recommendations to the Governing Board at each of its regular meetings."
   ])
 ]},
{id:"IV", title:"Quality and Patient Safety Committee of the Governing Board of AHSIA Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Authority"),
   P(null,"The Quality and Patient Safety Committee is a standing committee of the Governing Board of each Member Institution. It is established to safeguard clinical excellence, ensure patient-centered care, minimize clinical risks, and guide the institution through progressive quality improvement standards."),
   H("Section 2 — Composition and Leadership"),
   P(null,"To maintain professional clinical standards and oversight:"),
   L(null,[
     "Chairperson: An expert member of the Governing Board (preferably a physician, registered nurse, or public health professional) shall serve as the Chair.",
     "Secretary: The Chief Medical Officer (CMO), Chief Nursing Officer (CNO), or Director of Quality of the Member Institution shall serve as the Secretary.",
     "Members: the CEO of the institution; representatives from the medical and nursing leadership; external healthcare professionals or quality systems experts appointed by the Governing Board."
   ]),
   H("Section 3 — Key Responsibilities"),
   P(null,"The Quality and Patient Safety Committee shall perform the following functions:"),
   L(null,[
     "Clinical Surveillance: Continuously monitor key clinical quality and safety benchmarks, including but not limited to readmission rates, hospital-acquired infections (HAIs), surgical outcomes, medication errors, and patient mortality rates.",
     "Risk and Grievance Management: Oversee proactive clinical risk management programs, investigate sentinel events, perform root-cause analyses, and review patient grievances and satisfaction reports to recommend corrective measures.",
     "Accreditation Progression: Supervise the institution's self-assessments, preparations, and strategic progression through the four incremental AHSIA Accreditation Levels (Star Standard, Silver Standard, Gold Standard, and Platinum Standard).",
     "Credentialing and Privileging: Review qualifications and provide formal recommendations to the Governing Board regarding the credentialing and clinical privileging of medical, nursing, and allied health staff to ensure they meet professional and ethical standards."
   ]),
   H("Section 4 — Meetings and Reporting"),
   L(null,[
     "Frequency: The Quality and Patient Safety Committee shall meet at least quarterly.",
     "Reporting: The committee shall submit detailed reports on clinical quality indicators, sentinel events, risk assessments, and accreditation readiness to the Governing Board at each regular session."
   ])
 ]},
{id:"V", title:"Mission Focus Committee of the Governing Board of AHSIA Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Authority"),
   P(null,"The Mission Focus Committee is a standing committee of the Governing Board of each Member Institution. It is established to protect, nurture, and evaluate the unique Seventh-day Adventist identity, values, healing ministry, and spiritual life of the healthcare institution."),
   H("Section 2 — Composition and Leadership"),
   P(null,"To ensure strong spiritual leadership and missional continuity:"),
   L(null,[
     "Chairperson: A member of the Governing Board appointed by the Board (such as a Sponsoring Union or field administrator, or the Union Health Ministries Director) shall serve as the Chair.",
     "Secretary: The Director of Mission Integration, Chaplain, or Spiritual Care Coordinator of the Member Institution shall serve as the Secretary.",
     "Members: the CEO of the institution; the Chief Nursing Officer (CNO) or a representative of clinical staff; local or district Seventh-day Adventist pastors representing the community; the Health Ministries Director of the sponsoring local field."
   ]),
   H("Section 3 — Key Responsibilities"),
   P(null,"The Mission Focus Committee shall perform the following functions:"),
   L(null,[
     "Adventist Identity and Ethics: Safeguard the Seventh-day Adventist character of the institution, ensuring strict adherence to Adventist medical ethics, bioethical positions, wholistic health principles, clean/vegetarian nutrition standards, and Sabbath-keeping guidelines.",
     "Chaplaincy and Spiritual Care: Oversee the operation of the chaplaincy department, the coordination of spiritual care programs for patients, families, and staff, and the provision of spiritual counseling.",
     "Spiritual Leadership and Culture: Promote regular devotional life, spiritual retreats, and professional ethical training programs for employees, fostering a culture of compassionate care modeled after the healing ministry of Jesus Christ.",
     "Community Health and Total Health Movement: Collaborate with local SDA churches, conferences, and community actors to execute public health initiatives, lifestyle programs, and evangelistic health outreach aligned with the Total Health Movement.",
     "MSQ Spiritual Benchmarking: Monitor and evaluate spiritual care indicators and mission-impact metrics under the MSQ (Mission Alignment, Systems Performance & Quality Assurance) framework, reporting outcomes to the Governing Board and AHSIA-Office."
   ]),
   H("Section 4 — Meetings and Reporting"),
   L(null,[
     "Frequency: The Mission Focus Committee shall meet at least quarterly.",
     "Reporting: The committee shall submit a comprehensive spiritual activities, ethical compliance, and mission-impact report to the Governing Board at each regular session."
   ])
 ]},
{id:"VI", title:"Patient, Employee, and User Rights and Responsibilities Charter for AHSIA Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Theological Foundation"),
   P(null,"Following the healing ministry of Jesus Christ, who cared for the whole person — body, mind, and spirit — AHSIA Member Institutions are committed to delivering clinical care that promotes wholistic health, personal dignity, and compassionate service. This Charter defines the mutual rights and responsibilities of patients, employees, visitors, and institutions within the Adventist Healthcare Network. It serves to:"),
   L(null,["Foster a safe, healing, and collaborative environment.","Strengthen trust and shared accountability between healthcare providers, patients, and families.","Align institutional operations with Seventh-day Adventist values, the Total Health Movement, and the standards of the MSQ (Mission Alignment, Systems Performance & Quality Assurance) framework."]),
   H("Section 2 — Patient Rights"),
   P(null,"Every patient receiving care at an AHSIA Member Institution has the right to:"),
   L(null,[
     "Dignified and Respectful Care: Receive compassionate, respectful care free from any form of discrimination based on race, ethnicity, religion, gender, age, nationality, or disability.",
     "Spiritual Support: Access wholistic and spiritual care, including chaplaincy services, prayer, and support that respects the patient's personal religious beliefs. Sponsoring Seventh-day Adventist clergy and ministers of all creeds are welcomed to visit.",
     "Participation in Decisions: Be fully informed about their diagnosis, prognosis, treatment options, risks, and benefits, and actively participate in planning their care and treatment.",
     "Informed Consent and Refusal: Give informed consent prior to any clinical procedure or research participation, and have the right to refuse treatment to the extent permitted by law, after being informed of the clinical consequences of such refusal.",
     "Privacy and Confidentiality: Expect strict confidentiality regarding all clinical, financial, and personal data, in compliance with the AHSIA Data Governance Charter. Physical privacy shall be respected during examinations, treatments, and consultations.",
     "Quality and Safe Care: Receive care in a clean, safe, secure, and professional environment that meets or exceeds national clinical standards and AHSIA quality metrics.",
     "Access to Information: Request and receive clear, understandable information regarding their medical records, billing statements, and institutional policies, including those related to financial assistance or payment plans.",
     "Grievance and Complaint Mechanism: Voice complaints, concerns, or feedback regarding their care without fear of retaliation, and receive a timely, transparent, and fair review of their grievance through the institution's formal complaint system."
   ]),
   H("Section 3 — Patient Responsibilities"),
   P(null,"To ensure the safety, effectiveness, and mutual respect of the healthcare partnership, patients are responsible for:"),
   L(null,[
     "Providing Accurate Information: Providing complete and truthful information regarding their medical history, past illnesses, hospitalizations, medications, allergies, and other matters relating to their health.",
     "Adhering to the Treatment Plan: Following the agreed-upon treatment plan, clinical recommendations, and instructions of the healthcare team, and communicating clearly if they are unable or unwilling to follow them.",
     "Respecting Staff and Others: Treating all healthcare professionals, administrative staff, volunteers, and other patients with courtesy, respect, and dignity.",
     "Compliance with Regulations: Abiding by the institution's rules and operational regulations, including maintaining a quiet healing environment, respecting visiting hours, and complying with the prohibition of tobacco, alcohol, illicit drugs, and weapon possession.",
     "Sabbath Atmosphere: Respecting the sacredness of the Sabbath (from Friday sunset to Saturday sunset) by cooperating with the institution's effort to maintain a peaceful, restful Sabbath atmosphere, which limits routine business and non-emergency clinical interventions.",
     "Financial Obligations: Fulfilling their financial agreements and administrative obligations promptly, or working collaboratively with the billing office to establish acceptable payment arrangements.",
     "Asking Questions: Seeking clarification from the medical or nursing team whenever they do not understand their diagnosis, treatment plan, or instructions."
   ]),
   H("Section 4 — Employee Rights"),
   P(null,"Employees, as the living agents of the Seventh-day Adventist healing ministry, have the right to:"),
   L(null,[
     "Safe and Secure Working Environment: Work in a clean, professional, and secure environment that is free from physical, verbal, or psychological abuse, harassment, or workplace hazards.",
     "Fair and Equitable Treatment: Be treated with dignity, fairness, and professional respect by leadership, board members, peers, and users of the institution.",
