     "4.3 Decisión de Acreditación: Con base en el informe de la visita de evaluación, la Junta Directiva de AHSIA emitirá, renovará o ajustará el nivel formal de acreditación de la institución.",
     "4.4 Monitoreo Continuo de Datos: La acreditación in situ está condicionada a que la institución mantenga su reporte MSQ mensual (clínico, financiero y espiritual) a la Oficina de AHSIA."
   ]),
   H("Sección 5 — Consecuencias del Incumplimiento y Mecanismos de Apoyo"),
   L(null,[
     "5.1 Apoyo a Instituciones en Dificultad: Si una institución cae por debajo de su estatus de acreditación objetivo o tiene dificultades para cumplir con los indicadores de seguridad esenciales, la Oficina de AHSIA desplegará apoyo de asesoría técnica y consultoría específicos.",
     "5.2 Priorización del Fondo de Solidaridad: Las instituciones vulnerables que trabajen activamente para mejorar su estatus de acreditación recibirán acceso prioritario al Fondo de Solidaridad y Fortalecimiento del Sistema para infraestructura, equipo de calidad o mejoras digitales.",
     "5.3 Sanciones Progresivas: La falta persistente de participación en las autoevaluaciones, de recepción de las visitas de evaluación, o de subsanación de deficiencias críticas de seguridad/misión, resultará en sanciones administrativas progresivas por parte de la Junta Directiva de AHSIA, incluyendo una advertencia formal y un plan de acción correctiva obligatorio, la retención de recursos técnicos o financieros del Fondo de Solidaridad, y la suspensión temporal del estatus de Membresía de AHSIA y de los derechos de voto."
   ]),
   H("Sección 6 — Alineación Internacional"),
   P(null,"El Sistema de Acreditación de AHSIA opera en armonía con los estándares globales del Consejo Internacional de Atención de Salud Adventista (IAHC), conforme a la Política de Trabajo de la Asociación General (FH 35), asegurando que la excelencia en salud interamericana local sea reconocida y respetada a nivel mundial.")
 ]}
];

var APPENDIX_ES = {
 title:"Apéndice — Definiciones e Interpretación de la Constitución y los Estatutos de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Alcance"),
   P(null,"Este Apéndice proporciona las definiciones oficiales y estandarizadas, así como los principios interpretativos fundamentales, que rigen la totalidad de la Constitución de AHSIA, sus Estatutos y los Anexos Institucionales que la acompañan. Para prevenir la fricción administrativa, las disputas legales y las desviaciones teológicas, todas las entidades dentro de la Red de Salud Adventista — incluyendo la Oficina de AHSIA, las Uniones patrocinadoras, las Juntas Directivas locales y los equipos de liderazgo ejecutivo — interpretarán y aplicarán las disposiciones de esta Constitución en estricta conformidad con los términos y las reglas aquí establecidos."),
   H("Sección 2 — Definiciones"),
   P(null,"Para los efectos de esta Constitución y sus Estatutos, los siguientes términos se definen de la siguiente manera:"),
   DL([
     {term:"AHSIA", def:"Servicios de Salud Adventista Interamericana (que se pronuncia “ah-shiyá”), establecida el 20 de mayo de 2010. Se refiere a la organización de estructura dual que opera dentro de la División Interamericana (IAD), compuesta por la Oficina de AHSIA (órgano coordinador) y la Red de Salud Adventista (red operativa)."},
     {term:"Oficina de AHSIA", def:"La oficina central administrativa, estratégica y coordinadora de AHSIA, con sede en las oficinas de la División Interamericana en Miami, Florida, Estados Unidos. Funciona bajo la autoridad directa de la IAD y es responsable del modelado del sistema, las revisiones de acreditación, la supervisión del MAPS, el apoyo de asesoría y la alineación de toda la red."},
     {term:"Red de Salud Adventista (Red de AHSIA)", def:"La red coordinada de todas las instituciones de salud adventistas del séptimo día que operan dentro del territorio geográfico de la División Interamericana. Esto incluye hospitales, clínicas ambulatorias, sanatorios, centros de salud y estilo de vida, clínicas móviles, centros de diagnóstico, hogares de ancianos y otras iniciativas enfocadas en la salud que sean propiedad de, u operadas por, organizaciones denominacionales."},
     {term:"Institución Miembro", def:"Cualquier instalación de salud o servicio relacionado con la salud, operado por una entidad de la Iglesia Adventista del Séptimo Día (Unión, Asociación, Misión o División) dentro del territorio de la División Interamericana, que sea formalmente reconocido como miembro de la Red de AHSIA y participe en el Sistema de Acreditación de AHSIA."},
     {term:"Constituyente (Constituyente de AHSIA)", def:"El órgano representativo de la Red de AHSIA y de la División Interamericana, que se reúne en sesión cada cinco (5) años para aprobar los estándares mayores del sistema, revisar los informes de desempeño, elegir a los oficiales y votar sobre las enmiendas constitucionales."},
     {term:"Junta Directiva (Junta Directiva de AHSIA)", def:"El órgano principal de toma de decisiones y supervisión de AHSIA. Compuesta por trece (13) miembros, es responsable de la gobernanza del sistema, la aprobación de los presupuestos operativos, el monitoreo de los resultados de acreditación y el aseguramiento del cumplimiento de las políticas de la Asociación General."},
     {term:"Socio Técnico", def:"Una organización externa — adventista o no adventista — que colabora con la Oficina de AHSIA o con Instituciones Miembro individuales para brindar experiencia clínica especializada, capacitación educativa, desarrollo de investigación, asistencia logística o financiamiento estratégico. Los Socios Técnicos quedan explícitamente excluidos de roles de gobernanza, no poseen derechos de voto y no poseen autoridad administrativa directa dentro de AHSIA ni de sus miembros. Entre los ejemplos se incluyen Loma Linda University Health (LLUH), AdventHealth Global Missions, la Universidad de Andrews y ADRA."},
     {term:"Asesor Principal", def:"Un experto de salud, clínico, financiero o de gobernanza, ampliamente reconocido, invitado formalmente por la Oficina de AHSIA para brindar orientación técnica y estratégica. Los Asesores Principales actúan estrictamente en calidad de asesores, no poseen poder de gobernanza ni ejecutivo, y no tienen derecho de voto en la Junta Directiva ni en sus comités."},
     {term:"MAPS (Modelo de Servicios de Salud Primaria Adventista)", def:"El marco oficial adventista del séptimo día para la prestación de servicios de salud primaria. Proporciona una plantilla operativa estandarizada e impulsada por la misión, diseñada para brindar una atención primaria accesible, de alta calidad y costo-efectiva, que incorpora la medicina del estilo de vida, la educación en salud y el cuidado espiritual."},
     {term:"Niveles de Acreditación de AHSIA", def:"El sistema de evaluación progresivo de cuatro niveles, administrado por la Oficina de AHSIA para reconocer, evaluar comparativamente e incentivar la excelencia organizacional, la calidad de la atención y la integridad misional en toda la Red: Estándar Estrella (cumplimiento fundacional de las expectativas misionales adventistas, los requisitos básicos de seguridad clínica y los sistemas administrativos esenciales); Estándar Plata (progresión medible hacia un desempeño de sistemas integrado, programas activos de salud comunitaria y prácticas de gobernanza fortalecidas); Estándar Oro (alineación de alto nivel con la Filosofía Adventista de Salud Integral (Wholística), excelencia clínica y financiera constante, e impacto espiritual sostenido); Estándar Platino (desempeño ejemplar y líder del sistema, integración fluida de la calidad clínica y la misión, madurez operativa avanzada, y resultados de bienestar comunitario demostrablemente superiores)."},
     {term:"Marco MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad)", def:"El marco integral de evaluación y reporte de toda la red, utilizado por la Oficina de AHSIA para evaluar y acreditar a las Instituciones Miembro. Monitorea indicadores cualitativos y cuantitativos en tres pilares: la alineación de la misión espiritual, el desempeño operativo/financiero del sistema, y la calidad clínica/seguridad del paciente."},
     {term:"Movimiento de Salud Total (Filosofía de la Salud Integral/Wholística)", def:"El marco teológico y filosófico de la Iglesia Adventista del Séptimo Día que concibe la salud como la restauración completa de las dimensiones física, mental, social y espiritual de la vida humana, siguiendo el modelo del ministerio de sanidad de Jesucristo."},
     {term:"Comité Permanente", def:"Un órgano asesor o preparatorio permanente, establecido por la Junta Directiva de AHSIA (o por una junta institucional) para brindar una supervisión continua y especializada de un área funcional fundamental (por ejemplo, Ejecutivo, Finanzas, Calidad o Enfoque Misional), y reportar sus hallazgos en las sesiones regulares de la junta."},
     {term:"Comisión", def:"Un órgano temporal, ad hoc y de duración limitada, designado por la Junta Directiva para ejecutar un proyecto o una investigación específica y claramente definida, el cual se disuelve automáticamente al presentar su informe final."},
     {term:"Constitución", def:"El instrumento fundamental de gobierno de Servicios de Salud Adventista Interamericana, que incluye todos los Artículos principales (Artículos I al XIII), sus Anexos obligatorios que los acompañan (Anexos I al IX), y este Apéndice."}
   ]),
   H("Sección 3 — Principios de Interpretación"),
   P(null,"Para garantizar la estabilidad legal y la integridad teológica, la interpretación de esta Constitución y sus estatutos se regirá por los siguientes seis principios:"),
   L(null,[
     "3.1 Prioridad de la Misión: Todas las cláusulas, secciones y definiciones deberán interpretarse de manera que prioricen y promuevan la misión de sanidad espiritual y física de la Iglesia Adventista del Séptimo Día. Si una cláusula admite múltiples interpretaciones, prevalecerá la lectura que mejor preserve el testimonio cristiano, los estándares teológicos y la misión espiritual de la Red.",
     "3.2 Coherencia con las Políticas de la Asociación General y la IAD: En caso de cualquier ambigüedad, omisión o contradicción percibida entre esta Constitución y la Política de Trabajo de la Asociación General (AG) o la Política de Trabajo de la División Interamericana (IAD), las políticas de la AG y la IAD siempre serán superiores y prevalecerán.",
     "3.3 Regla del Sentido Llano: A menos que un término esté explícitamente definido en la Sección 2 de este Apéndice o dentro de un artículo específico de esta Constitución, las palabras y frases se interpretarán conforme a su significado ordinario, natural, gramatical y llano en el idioma inglés.",
     "3.4 Interpretación Contextual (Regla de la Integralidad): Los artículos, secciones, anexos y apéndices de esta Constitución deberán interpretarse como un documento único, coherente e integrado. Ninguna cláusula se leerá de manera aislada para desvirtuar o contradecir la intención general, la estructura de gobernanza o la armonía operativa de AHSIA.",
     "3.5 Sin Autoridad Implícita: Ningún oficial ejecutivo, miembro de junta, comité o institución individual podrá reclamar, inferir o ejercer ningún poder administrativo, derecho de gobernanza o autoridad de supervisión que no le haya sido conferido explícita y claramente en esta Constitución o mediante resoluciones formales votadas por la Junta.",
     "3.6 Protección de la Propiedad Institucional: Bajo ninguna circunstancia se interpretará, aplicará o modificará cláusula, definición o principio alguno de esta Constitución de manera que altere, transfiera, diluya o comprometa la propiedad exclusiva de los activos, los títulos de propiedad, los derechos sobre la tierra, o la autoridad de gobierno corporativo local de una entidad patrocinadora de la Iglesia Adventista del Séptimo Día sobre su Institución Miembro."
   ]),
   H("Sección 4 — Resolución de Ambigüedades"),
   P(null,"Si surgiera alguna disputa, desacuerdo o ambigüedad respecto del significado, alcance o aplicación de cualquier artículo, sección o anexo de esta Constitución:"),
   L(null,[
     "La Junta Directiva de AHSIA posee la autoridad inicial para interpretar el texto y emitir una resolución aclaratoria.",
     "La interpretación de la Junta se presentará formalmente a la Administración de la División Interamericana para su revisión final, asesoría y alineación legal.",
     "Una vez revisada y ratificada por la Administración de la IAD, la resolución aclaratoria de la Junta Directiva será definitiva, vinculante, y se incorporará al registro oficial de interpretaciones constitucionales que mantiene el Secretario de la Oficina de AHSIA."
   ]),
   H("Sección 5 — Versión de Idioma Autoritativa"),
   L(null,[
     "Autoridad del Idioma Inglés: Si bien esta Constitución, sus Estatutos y sus Anexos podrán traducirse al francés, español u otros idiomas regionales de la División Interamericana para facilitar la administración local, la versión en inglés seguirá siendo el único texto oficial, legalmente vinculante y autoritativo.",
     "Resolución de Conflictos: En caso de cualquier discrepancia de traducción, conflicto semántico o desacuerdo interpretativo entre las diferentes versiones lingüísticas, el texto en inglés se utilizará exclusivamente para resolver el conflicto y establecer el significado legal correcto."
   ])
 ]
};

{id:"I", title:"Composition du Conseil d’Administration et Directives Opérationnelles pour les Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Cadre Général"),
   L(null,[
     "Rôle et Objet : Le Conseil d’Administration (ou Conseil des Fiduciaires) est l’organe de gouvernance stratégique des institutions de santé de la Division Interaméricaine (IAD).",
     "Établissement : Le Conseil d’Administration est formellement établi par les délégués de l’Entité de Rattachement lors de sa session régulière, tous les cinq (5) ans.",
     "Cycle : Il est vivement recommandé que ce mandat coïncide avec les cycles administratifs réguliers de cinq (5) ans de l’Église Adventiste du Septième Jour mondiale.",
     "Conformité : Le Conseil d’Administration opère dans le strict respect des politiques de la Division Interaméricaine, des normes du Bureau de l’AHSIA, et des principes fondamentaux de gouvernance du système de santé adventiste.",
     "Responsabilités Principales : Le Conseil d’Administration est principalement responsable de la mission, de la qualité, de la conformité, de la planification stratégique et de la budgétisation de l’Institution Membre."
   ]),
   H("Section 2 — Composition du Conseil d’Administration"),
   P(null,"Afin d’assurer une gestion professionnelle, un leadership spirituel et une reddition de comptes locale, la composition du Conseil comprendra des membres statutaires obligatoires et des membres optionnels."),
   L("2.1 Membres Statutaires (Obligatoires) — le Conseil d’Administration de chaque Institution Membre doit être composé des personnes suivantes :",[
     "Les administrateurs de l’Entité de Rattachement (Président, Secrétaire, Trésorier).",
     "Si l’Union est l’entité de rattachement, un ou plusieurs présidents de territoire/champ local.",
     "Le Directeur des Ministères de la Santé de l’Union ou du champ local correspondant.",
     "Le Directeur Général (CEO) ou l’Administrateur de l’institution.",
     "Des laïcs professionnels, locaux ou internationaux, possédant une expertise avancée dans des domaines pertinents (notamment, sans s’y limiter : la gestion, les finances, le droit, la santé et la médecine).",
     "Un laïc adventiste du septième jour représentant la communauté des usagers de l’institution de santé."
   ]),
   L("2.2 Membres Optionnels — à la discrétion de l’Union de Rattachement, le Conseil peut également inclure :",[
     "Un représentant du Bureau de l’AHSIA (vivement recommandé pour les hôpitaux et les grandes institutions de santé).",
     "Des représentants de partenaires nationaux ou internationaux."
   ]),
   H("Section 3 — Direction du Conseil"),
   L(null,[
     "Président du Conseil d’Administration : Le Président de l’Entité de Rattachement, ou son représentant désigné, exerce la fonction de Président.",
     "Secrétaire du Conseil d’Administration : Le CEO de l’Institution Membre exerce la fonction de Secrétaire."
   ]),
   H("Section 4 — Mandat et Responsabilités"),
   P(null,"Le Conseil d’Administration exerce les fonctions suivantes afin d’assurer la réussite institutionnelle et l’alignement missionnaire :"),
   L(null,[
     "Définir et sauvegarder la vision stratégique et missionnaire de l’institution.",
     "Approuver les principales politiques institutionnelles et procédures opérationnelles.",
     "Superviser la performance financière et opérationnelle de l’institution.",
     "Assurer la pleine conformité avec les lois locales, nationales et régionales, ainsi qu’avec les normes du Bureau de l’AHSIA, de la Division Interaméricaine et des Ministères de la Santé de la Conférence Générale.",
     "Garantir la qualité clinique, la sécurité des patients et une gestion complète des risques.",
     "Renforcer l’intégration missionnaire et l’identité adventiste du septième jour dans l’ensemble des services.",
     "Constituer des comités de recherche pour les nominations administratives clés (tels que les membres de l’équipe de direction), selon les besoins, et procéder aux nominations.",
     "Valider les budgets de fonctionnement annuels, les audits indépendants et les plans d’investissement en capital.",
     "Procéder à l’évaluation annuelle de la performance du CEO et de l’équipe de direction exécutive."
   ]),
   H("Section 5 — Comités Permanents du Conseil"),
   P(null,"Afin de rationaliser la gouvernance et d’assurer une supervision ciblée, le Conseil d’Administration établit des comités permanents dotés de mandats clairs :"),
   TB(["Comité","Président","Rôle Principal"],[
     ["Comité Exécutif","Président du Conseil","Traite les décisions urgentes, assure une supervision opérationnelle rapprochée et le suivi des résolutions du conseil."],
     ["Comité des Finances et d’Audit","Trésorier de l’Entité de Rattachement","Supervise les budgets institutionnels, les audits indépendants, les investissements et la gestion des risques financiers."],
     ["Comité de la Qualité et de la Sécurité des Patients","Un membre expert du Conseil","Assure le suivi de la qualité clinique, de la progression de l’accréditation AHSIA, de la sécurité des patients et des indicateurs de performance en santé."],
     ["Comité d’Orientation Missionnaire","Membre du Conseil nommé à cet effet","Sauvegarde l’identité adventiste, la spiritualité du personnel et des patients, et promeut des programmes de santé axés sur la mission."]
   ]),
   H("Section 6 — Dispositions Administratives"),
   L(null,[
     "Durée du Mandat : Les membres du Conseil sont nommés pour un mandat de cinq (5) ans, aligné sur le cycle administratif de l’Union de Rattachement, et peuvent être reconduits.",
     "Réunions : Le Conseil d’Administration se réunit au moins deux (2) fois par an. Les comités permanents se réunissent trimestriellement ou selon les besoins.",
     "Quorum : Le quorum est constitué de cinq (5) à sept (7) membres votants.",
     "Éthique et Confidentialité : Tous les membres du conseil et des comités doivent signer chaque année une Déclaration de Confidentialité et une Déclaration de Conflit d’Intérêts.",
     "Révision : Les présentes directives et règles de composition peuvent être révisées par l’Entité de Rattachement à tout moment, selon les besoins."
   ])
 ]},
{id:"II", title:"Comité Exécutif du Conseil d’Administration des Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Autorité"),
   P(null,"Le Comité Exécutif du Conseil d’Administration de chaque Institution Membre est établi afin d’assister le Conseil dans ses fonctions de gouvernance entre les sessions régulières. Il agit en tant qu’organe consultatif et exécutif, traitant les questions administratives déléguées afin d’assurer le fonctionnement continu et efficace de l’institution de santé."),
   L(null,[
     "Subordination : Le Comité Exécutif est un organe subordonné au Conseil d’Administration local. Il ne détient aucune autorité pour modifier les statuts institutionnels, approuver les budgets de fonctionnement annuels, nommer le Directeur Général (CEO), ou annuler des décisions prises par le Conseil d’Administration au complet.",
     "Autorité Déléguée : Le Conseil d’Administration au complet peut déléguer formellement au Comité Exécutif des pouvoirs décisionnels spécifiques et non réservés, afin de faciliter une réponse administrative rapide."
   ]),
   H("Section 2 — Composition et Direction"),
   P(null,"Afin de maintenir l’alignement administratif avec l’entité ecclésiastique de rattachement et la direction exécutive de l’institution, le Comité Exécutif est structuré comme suit :"),
   L(null,[
     "Président : Le Président du Conseil d’Administration (généralement le Président de l’Union de Rattachement ou du champ ecclésiastique local) exerce la fonction de Président du Comité Exécutif.",
     "Secrétaire : Le Directeur Général (CEO) / Administrateur de l’institution de santé exerce la fonction de Secrétaire.",
     "Membres Votants : le Trésorier de l’entité ecclésiastique de rattachement (ou son représentant désigné) ; au moins un (1) membre professionnel ou laïc du Conseil d’Administration ; des membres clés de l’équipe de direction de l’institution (par exemple, le Directeur Financier, le Directeur Médical ou le Directeur des Soins Infirmiers) peuvent être nommés membres votants ou invités, selon les règlements du conseil local de l’entité de rattachement."
   ]),
   H("Section 3 — Mandat et Responsabilités Principales"),
   P(null,"Le Comité Exécutif exerce les fonctions suivantes :"),
   L(null,[
     "Décisions Urgentes : Examiner et statuer sur les questions institutionnelles urgentes survenant entre les réunions régulières du Conseil d’Administration et qui ne peuvent attendre une session plénière du conseil.",
     "Supervision Opérationnelle : Assurer une supervision étroite et continue des opérations administratives quotidiennes de l’institution, en veillant à leur alignement avec le plan stratégique approuvé par le Conseil d’Administration.",
     "Suivi des Résolutions : Assurer le suivi et la mise en œuvre systématique de toutes les politiques, résolutions et directives stratégiques votées par le Conseil d’Administration au complet.",
     "Conseil Stratégique : Servir d’organe de réflexion pour le CEO sur les enjeux opérationnels critiques, la gestion des urgences et les relations communautaires.",
     "Recommandations de Politiques : Préparer et recommander des directives opérationnelles et des politiques administratives, pour examen et approbation formelle par le Conseil d’Administration au complet."
   ]),
   H("Section 4 — Réunions, Quorum et Rapports"),
   L(null,[
     "Fréquence : Le Comité Exécutif se réunit au moins trimestriellement, ou plus fréquemment sur convocation du Président ou à la demande du Secrétaire (CEO), en réponse à des besoins opérationnels urgents.",
     "Quorum : Le quorum de toute réunion du Comité Exécutif est constitué d’une majorité simple de ses membres votants, incluant obligatoirement le Président (ou son suppléant désigné) et le Secrétaire.",
     "Rapports : Le Secrétaire doit consigner des procès-verbaux détaillés de toutes les réunions du Comité Exécutif. Un rapport complet de toutes les actions, délibérations et décisions prises par le Comité Exécutif doit être soumis au Conseil d’Administration au complet, pour examen et ratification formelle lors de sa prochaine session prévue."
   ])
 ]},
{id:"III", title:"Comité des Finances et d’Audit du Conseil d’Administration des Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Autorité"),
   P(null,"Le Comité des Finances et d’Audit est un comité permanent du Conseil d’Administration de chaque Institution Membre. Il est établi afin d’assurer l’intendance financière, la transparence, le contrôle interne et une conformité financière rigoureuse dans l’ensemble des opérations institutionnelles, en harmonie avec les politiques financières de l’Église Adventiste du Septième Jour."),
   H("Section 2 — Composition et Direction"),
   P(null,"Afin de garantir une supervision financière professionnelle et une intégration harmonieuse au réseau financier de l’Église :"),
   L(null,[
     "Président : Le Trésorier de l’Entité de Rattachement (l’Union ou le champ ecclésiastique local) exerce la fonction de Président.",
     "Secrétaire : Le Directeur Financier (CFO) / Trésorier de l’Institution Membre exerce la fonction de Secrétaire.",
     "Membres : au moins deux (2) membres du Conseil d’Administration possédant une expertise financière, comptable ou commerciale ; le Directeur Général (CEO) de l’institution (membre d’office, avec ou sans droit de vote selon les règlements du conseil local) ; des laïcs professionnels possédant une expertise en finance d’entreprise ou en audit, nommés par le Conseil d’Administration."
   ]),
   H("Section 3 — Responsabilités Principales"),
   P(null,"Le Comité des Finances et d’Audit exerce les fonctions suivantes :"),
   L(null,[
     "Analyse et Validation Budgétaires : Procéder à une analyse approfondie et à la validation des budgets de fonctionnement et d’investissement en capital annuels, avant leur soumission formelle au Conseil d’Administration au complet pour approbation.",
     "Contrôle Interne et Gestion des Risques : Surveiller et superviser les systèmes de contrôle interne, les politiques financières et les procédures comptables afin d’atténuer les risques, de prévenir la fraude et de protéger les actifs institutionnels.",
     "Coordination des Audits : Assurer une coordination directe avec les auditeurs externes, y compris le Service d’Audit de la Conférence Générale (GCAS) ou des cabinets d’audit indépendants autorisés. Le comité examine les rapports d’audit, évalue les lettres de recommandations à la direction, et assure le suivi de la mise en œuvre des plans d’action correctifs.",
     "Rapports Financiers à l’Échelle du Système (MSQ) : Veiller à ce que l’institution prépare et soumette ses états financiers mensuels au Bureau de l’AHSIA au plus tard le 15 du mois suivant. Ce rapportage est obligatoire aux fins d’analyse comparative financière, d’étalonnage et d’évaluation MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité)."
   ]),
   H("Section 4 — Réunions et Rapports"),
   L(null,[
     "Fréquence : Le Comité des Finances et d’Audit se réunit au moins trimestriellement, avant les sessions régulières du Conseil d’Administration.",
     "Rapports : Le comité soumet des rapports financiers complets, des évaluations d’audit et des recommandations budgétaires au Conseil d’Administration à chacune de ses réunions régulières."
   ])
 ]},
{id:"IV", title:"Comité de la Qualité et de la Sécurité des Patients du Conseil d’Administration des Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Autorité"),
   P(null,"Le Comité de la Qualité et de la Sécurité des Patients est un comité permanent du Conseil d’Administration de chaque Institution Membre. Il est établi afin de sauvegarder l’excellence clinique, d’assurer des soins centrés sur le patient, de minimiser les risques cliniques et de guider l’institution à travers les normes progressives d’amélioration de la qualité."),
   H("Section 2 — Composition et Direction"),
   P(null,"Afin de maintenir des normes cliniques professionnelles et une supervision adéquate :"),
   L(null,[
     "Président : Un membre expert du Conseil d’Administration (de préférence un médecin, un infirmier diplômé ou un professionnel de la santé publique) exerce la fonction de Président.",
     "Secrétaire : Le Directeur Médical (CMO), le Directeur des Soins Infirmiers (CNO) ou le Directeur de la Qualité de l’Institution Membre exerce la fonction de Secrétaire.",
     "Membres : le CEO de l’institution ; des représentants de la direction médicale et infirmière ; des professionnels de la santé externes ou des experts en systèmes de qualité, nommés par le Conseil d’Administration."
   ]),
   H("Section 3 — Responsabilités Principales"),
   P(null,"Le Comité de la Qualité et de la Sécurité des Patients exerce les fonctions suivantes :"),
   L(null,[
     "Surveillance Clinique : Assurer le suivi continu des principaux indicateurs de qualité et de sécurité clinique, notamment, sans s’y limiter : les taux de réadmission, les infections nosocomiales (HAI), les résultats chirurgicaux, les erreurs médicamenteuses et les taux de mortalité des patients.",
     "Gestion des Risques et des Plaintes : Superviser les programmes proactifs de gestion des risques cliniques, enquêter sur les événements sentinelles, réaliser des analyses des causes profondes, et examiner les plaintes des patients et les rapports de satisfaction afin de recommander des mesures correctives.",
     "Progression de l’Accréditation : Superviser les auto-évaluations, la préparation et la progression stratégique de l’institution à travers les quatre Niveaux d’Accréditation progressifs de l’AHSIA (Niveau Étoile, Niveau Argent, Niveau Or et Niveau Platine).",
     "Habilitation et Privilèges Cliniques : Examiner les qualifications et formuler des recommandations formelles au Conseil d’Administration concernant l’habilitation et l’octroi de privilèges cliniques au personnel médical, infirmier et paramédical, afin de garantir le respect des normes professionnelles et éthiques."
   ]),
   H("Section 4 — Réunions et Rapports"),
   L(null,[
     "Fréquence : Le Comité de la Qualité et de la Sécurité des Patients se réunit au moins trimestriellement.",
     "Rapports : Le comité soumet au Conseil d’Administration, à chaque session régulière, des rapports détaillés sur les indicateurs de qualité clinique, les événements sentinelles, les évaluations des risques et l’état de préparation à l’accréditation."
   ])
 ]},
{id:"V", title:"Comité d’Orientation Missionnaire du Conseil d’Administration des Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Autorité"),
   P(null,"Le Comité d’Orientation Missionnaire est un comité permanent du Conseil d’Administration de chaque Institution Membre. Il est établi afin de protéger, cultiver et évaluer l’identité, les valeurs, le ministère de guérison et la vie spirituelle propres à l’Église Adventiste du Septième Jour au sein de l’institution de santé."),
   H("Section 2 — Composition et Direction"),
   P(null,"Afin d’assurer un leadership spirituel solide et une continuité missionnaire :"),
   L(null,[
     "Président : Un membre du Conseil d’Administration nommé par le Conseil (tel qu’un administrateur de l’Union de Rattachement ou du champ, ou le Directeur des Ministères de la Santé de l’Union) exerce la fonction de Président.",
     "Secrétaire : Le Directeur de l’Intégration Missionnaire, l’Aumônier, ou le Coordinateur des Soins Spirituels de l’Institution Membre exerce la fonction de Secrétaire.",
     "Membres : le CEO de l’institution ; le Directeur des Soins Infirmiers (CNO) ou un représentant du personnel clinique ; des pasteurs adventistes du septième jour locaux ou de district représentant la communauté ; le Directeur des Ministères de la Santé du champ local de rattachement."
   ]),
   H("Section 3 — Responsabilités Principales"),
   P(null,"Le Comité d’Orientation Missionnaire exerce les fonctions suivantes :"),
   L(null,[
     "Identité Adventiste et Éthique : Sauvegarder le caractère adventiste du septième jour de l’institution, en veillant au strict respect de l’éthique médicale adventiste, des positions bioéthiques, des principes de santé globale (holistique), des normes d’alimentation saine et végétarienne, et des directives d’observation du sabbat.",
     "Aumônerie et Soins Spirituels : Superviser le fonctionnement du service d’aumônerie, la coordination des programmes de soins spirituels destinés aux patients, aux familles et au personnel, ainsi que la fourniture d’un accompagnement spirituel.",
     "Leadership Spirituel et Culture : Promouvoir une vie de dévotion régulière, des retraites spirituelles et des programmes de formation éthique professionnelle pour les employés, favorisant une culture de soins empreints de compassion, à l’image du ministère de guérison de Jésus-Christ.",
     "Santé Communautaire et Mouvement de Santé Totale : Collaborer avec les églises adventistes locales, les fédérations et les acteurs communautaires afin de mettre en œuvre des initiatives de santé publique, des programmes de style de vie et des actions évangéliques de santé alignées sur le Mouvement de Santé Totale.",
     "Étalonnage Spirituel MSQ : Assurer le suivi et l’évaluation des indicateurs de soins spirituels et des mesures d’impact missionnaire dans le cadre du MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité), et communiquer les résultats au Conseil d’Administration et au Bureau de l’AHSIA."
   ]),
   H("Section 4 — Réunions et Rapports"),
   L(null,[
     "Fréquence : Le Comité d’Orientation Missionnaire se réunit au moins trimestriellement.",
     "Rapports : Le comité soumet au Conseil d’Administration, à chaque session régulière, un rapport complet sur les activités spirituelles, la conformité éthique et l’impact missionnaire."
   ])
 ]},
{id:"VI", title:"Charte des Droits et Responsabilités des Patients, Employés et Usagers des Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Fondement Théologique"),
   P(null,"À l’image du ministère de guérison de Jésus-Christ, qui prenait soin de la personne dans sa totalité — corps, esprit et âme — les Institutions Membres de l’AHSIA s’engagent à dispenser des soins cliniques qui favorisent la santé globale (holistique), la dignité de la personne et un service empreint de compassion. La présente Charte définit les droits et responsabilités mutuels des patients, des employés, des visiteurs et des institutions au sein du Réseau de Santé Adventiste. Elle vise à :"),
   L(null,["Favoriser un environnement sûr, propice à la guérison et à la collaboration.","Renforcer la confiance et la responsabilité partagée entre les prestataires de soins, les patients et les familles.","Aligner les opérations institutionnelles sur les valeurs adventistes du septième jour, le Mouvement de Santé Totale et les normes du cadre MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité)."]),
   H("Section 2 — Droits des Patients"),
   P(null,"Tout patient recevant des soins dans une Institution Membre de l’AHSIA a le droit :"),
   L(null,[
     "Des Soins Dignes et Respectueux : Recevoir des soins empreints de compassion et de respect, exempts de toute forme de discrimination fondée sur la race, l’origine ethnique, la religion, le sexe, l’âge, la nationalité ou le handicap.",
     "Un Accompagnement Spirituel : Avoir accès à des soins globaux (holistiques) et spirituels, y compris les services d’aumônerie, la prière et un accompagnement respectueux des convictions religieuses personnelles du patient. Le clergé adventiste du septième jour de rattachement, ainsi que les ministres de tous les cultes, sont accueillis pour effectuer des visites.",
     "La Participation aux Décisions : Être pleinement informé de son diagnostic, de son pronostic, des options de traitement, des risques et des bénéfices, et participer activement à la planification de ses soins et de son traitement.",
     "Le Consentement Éclairé et le Refus : Donner son consentement éclairé avant toute procédure clinique ou participation à une recherche, et avoir le droit de refuser un traitement dans la mesure permise par la loi, après avoir été informé des conséquences cliniques d’un tel refus.",
     "La Vie Privée et la Confidentialité : S’attendre à une confidentialité stricte concernant l’ensemble des données cliniques, financières et personnelles, conformément à la Charte de Gouvernance des Données de l’AHSIA. L’intimité physique doit être respectée lors des examens, des traitements et des consultations.",
     "Des Soins de Qualité et Sécuritaires : Recevoir des soins dans un environnement propre, sûr, sécurisé et professionnel, conforme ou supérieur aux normes cliniques nationales et aux indicateurs de qualité de l’AHSIA.",
     "L’Accès à l’Information : Demander et recevoir des informations claires et compréhensibles concernant son dossier médical, ses relevés de facturation et les politiques institutionnelles, y compris celles relatives à l’aide financière ou aux plans de paiement.",
     "Un Mécanisme de Plaintes et de Réclamations : Exprimer des plaintes, des préoccupations ou des commentaires concernant ses soins sans crainte de représailles, et obtenir un examen rapide, transparent et équitable de sa plainte par l’intermédiaire du système formel de traitement des plaintes de l’institution."
   ]),
   H("Section 3 — Responsabilités des Patients"),
   P(null,"Afin d’assurer la sécurité, l’efficacité et le respect mutuel du partenariat en matière de soins de santé, les patients ont la responsabilité :"),
   L(null,[
     "De Fournir des Informations Exactes : Fournir des informations complètes et véridiques concernant leurs antécédents médicaux, maladies passées, hospitalisations, médicaments, allergies et autres questions relatives à leur santé.",
     "De Respecter le Plan de Traitement : Suivre le plan de traitement convenu, les recommandations cliniques et les instructions de l’équipe soignante, et communiquer clairement leur incapacité ou leur refus de s’y conformer, le cas échéant.",
     "De Respecter le Personnel et Autrui : Traiter tous les professionnels de la santé, le personnel administratif, les bénévoles et les autres patients avec courtoisie, respect et dignité.",
     "De se Conformer aux Règlements : Se conformer aux règles et règlements opérationnels de l’institution, notamment en préservant un environnement calme propice à la guérison, en respectant les heures de visite, et en se conformant à l’interdiction du tabac, de l’alcool, des drogues illicites et du port d’armes.",
     "De Respecter l’Atmosphère du Sabbat : Respecter le caractère sacré du Sabbat (du coucher du soleil le vendredi au coucher du soleil le samedi) en coopérant avec les efforts de l’institution pour maintenir une atmosphère de Sabbat paisible et reposante, laquelle limite les activités administratives courantes et les interventions cliniques non urgentes.",
     "De Respecter leurs Obligations Financières : Honorer promptement leurs accords financiers et obligations administratives, ou collaborer avec le service de facturation afin d’établir des modalités de paiement acceptables.",
     "De Poser des Questions : Demander des éclaircissements à l’équipe médicale ou infirmière chaque fois qu’ils ne comprennent pas leur diagnostic, leur plan de traitement ou les instructions reçues."
   ]),
   H("Section 4 — Droits des Employés"),
   P(null,"Les employés, en tant qu’agents vivants du ministère de guérison adventiste du septième jour, ont le droit :"),
   L(null,[
     "Un Environnement de Travail Sûr et Sécurisé : Travailler dans un environnement propre, professionnel et sécurisé, exempt de tout abus physique, verbal ou psychologique, de harcèlement, ou de dangers en milieu de travail.",
     "Un Traitement Juste et Équitable : Être traités avec dignité, équité et respect professionnel par la direction, les membres du conseil, leurs pairs et les usagers de l’institution.",
     "Le Développement Professionnel : Avoir accès à une formation continue, à des programmes d’éducation permanente et de perfectionnement des compétences, afin de maintenir leur compétence professionnelle et leur croissance clinique.",
     "Un Accompagnement Spirituel : Recevoir des soins spirituels, un accompagnement pastoral et un soutien psychologique professionnel afin de prévenir l’épuisement professionnel et de favoriser une culture de travail solidaire et axée sur la mission.",
     "Une Procédure Régulière : Bénéficier de procédures administratives claires, transparentes et équitables concernant les conditions d’emploi, les évaluations de performance, les plaintes et les mesures disciplinaires, en harmonie avec les politiques de ressources humaines de l’Union et de l’institution."
   ]),
   H("Section 5 — Responsabilités des Employés"),
   P(null,"Les employés des Institutions Membres de l’AHSIA ont la responsabilité :"),
   L(null,[
     "De Soutenir et d’Intégrer la Mission : Soutenir activement, incarner et intégrer la philosophie adventiste de la santé globale (holistique) et les valeurs chrétiennes dans toutes leurs tâches professionnelles.",
     "D’Assurer l’Excellence Professionnelle : Fournir des soins ou un soutien administratif compétents, fondés sur des données probantes, sûrs et de haute qualité, dans les limites de leurs qualifications et de leur permis d’exercice.",
     "D’Assurer la Confidentialité et la Sécurité des Données : Préserver strictement la confidentialité et le caractère privé de toutes les données relatives aux patients, aux finances et à l’organisation, et empêcher toute divulgation non autorisée de dossiers sensibles.",
     "De Maintenir l’Intégrité Éthique : Se conformer au Code d’Éthique de l’AHSIA, notamment en évitant les conflits d’intérêts, en pratiquant une communication transparente, et en traitant les patients et les collègues avec un respect chrétien inconditionnel.",
     "Le Devoir de Signaler les Préoccupations : Signaler promptement, par les canaux institutionnels appropriés, toute violation éthique, tout risque clinique, toute erreur clinique, tout danger pour la sécurité des patients ou toute inconduite présumée, dans un esprit d’amélioration constructive et de responsabilité."
   ]),
   H("Section 6 — Droits et Responsabilités des Usagers, Visiteurs et Familles"),
   L("6.1 Droits des Visiteurs et Usagers :",[
     "Être traités avec respect, bienveillance et courtoisie par l’ensemble du personnel institutionnel.",
     "Visiter leurs proches hospitalisés conformément aux directives institutionnelles, à la sécurité clinique et aux préférences du patient.",
     "Recevoir des informations claires concernant les règles de visite, les protocoles de lutte contre les infections et les directives de sécurité.",
     "Avoir accès, s’ils le souhaitent, à des espaces spirituels, à des salles de prière et à un accompagnement par l’aumônerie."
   ]),
   L("6.2 Responsabilités des Visiteurs et Usagers :",[
     "Respecter la vie privée, la dignité et le besoin de calme propice à la guérison de tous les patients et du personnel.",
     "Se conformer strictement aux politiques institutionnelles, y compris l’hygiène des mains, la lutte contre les infections, les heures de visite désignées et les consignes de sécurité.",
     "Contribuer au maintien d’un environnement de guérison calme, paisible, et exempt de tabac, d’alcool et de drogues.",
     "S’abstenir de tout comportement perturbateur, agressif ou dangereux, sous peine d’expulsion immédiate des lieux."
   ]),
   H("Section 7 — Obligations de l’Institution Membre"),
   P(null,"Afin d’ancrer la présente Charte dans la culture institutionnelle, le Conseil d’Administration et la Direction de chaque Institution Membre doivent :"),
   L(null,[
     "Affichage de la Charte : Afficher visiblement une copie de la présente Charte des Droits et Responsabilités (en anglais et dans les langues locales) dans les salles d’attente des patients, les bureaux d’admission, les halls d’accueil et sur le site Internet de l’institution.",
     "Formation du Personnel : Organiser régulièrement des programmes d’orientation et de formation à l’intention de tous les employés, du personnel médical et des bénévoles, portant sur les principes et l’application des droits des patients et des employés.",
     "Système de Résolution des Plaintes : Maintenir un système fonctionnel, accessible et confidentiel pour recevoir, examiner et résoudre les plaintes des patients et des employés, en veillant à ce que celles-ci soient documentées, suivies et signalées au Comité de la Qualité et de la Sécurité des Patients du Conseil.",
     "Étalonnage MSQ : Intégrer les taux de satisfaction des patients, les indicateurs de roulement du personnel, les audits des soins spirituels et les délais de résolution des plaintes en tant qu’indicateurs clés dans le cadre du MSQ.",
     "Conformité Éthique : Veiller à ce que les procédures cliniques, les initiatives de recherche et les pratiques administratives soient strictement conformes aux normes éthiques adventistes du septième jour et à la Déclaration des Principes de Fonctionnement (FH 20)."
   ]),
   H("Section 8 — Intendance du Système par le Bureau de l’AHSIA"),
   P(null,"Le Bureau de l’AHSIA agit en tant qu’intendant du système pour la présente Charte en :"),
   L(null,[
     "Élaborant, maintenant et mettant à jour les modèles normalisés et les ressources pédagogiques relatifs à la présente Charte.",
     "Assurant le suivi de la conformité à ces droits et responsabilités lors des visites régulières d’accréditation de l’AHSIA.",
     "Analysant les données de plaintes et de satisfaction à l’échelle du système afin de cerner les domaines nécessitant une amélioration de la qualité, un accompagnement-conseil et une formation ciblée."
   ])
 ]},
{id:"VII", title:"Code d’Éthique des Institutions Membres de l’AHSIA",
 blocks:[
   L(null,[
     "Section 1 — Préambule et Fondements Théologiques : Relie profondément la mission clinique au ministère de guérison de Jésus-Christ et à la restauration globale (holistique) — physique, mentale, sociale et spirituelle — que défend le Mouvement de Santé Totale.",
     "Section 2 — Champ d’Application et Caractère Contraignant : Détaille explicitement les obligations contraignantes applicables à chaque niveau de l’institution, y compris les membres du conseil local, les administrateurs exécutifs (CEO, CFO, CMO, CNO), les médecins, le personnel infirmier, le personnel de soutien, les bénévoles et les prestataires tiers.",
     "Section 3 — Valeurs et Principes Éthiques Fondamentaux : Définit de manière exhaustive les sept principes fondamentaux (Intégrité Chrétienne, Excellence Clinique, Dignité Humaine, Confidentialité, Intendance Fidèle, Intégration Missionnaire et Équité).",
     "Section 4 — Leadership Éthique et Gouvernance : Impose des directives strictes visant à éliminer le népotisme, à garantir une sélection des fournisseurs exempte de conflits d’intérêts (renvoi à l’Article XI), et à définir les limites professionnelles avec les Unions de Rattachement.",
     "Section 5 — Intendance Financière et Lutte contre la Corruption : Interdit explicitement les pots-de-vin, les rétrocommissions et les cadeaux inappropriés de fournisseurs, tout en imposant le strict respect des politiques financières de la Conférence Générale (CG) et de la Division Interaméricaine (IAD), ainsi que des protocoles d’approvisionnement transparents.",
     "Section 6 — Éthique Clinique et Normes Bioéthiques : Fixe des limites éthiques claires pour les soins aux patients, en insistant sur le consentement éclairé, la vie privée des patients et la stricte conformité aux positions bioéthiques adventistes du septième jour (y compris l’interdiction de l’euthanasie active, du suicide assisté, et les restrictions relatives à l’avortement telles que définies par la CG).",
     "Section 7 — Principes de Fonctionnement Confessionnels : Détaille les protocoles opérationnels visant à préserver le caractère sacré du Sabbat (en limitant les actes cliniques aux seuls soins d’urgence), à promouvoir des directives alimentaires végétariennes et saines dans les services culinaires destinés aux patients et au personnel, et à faire respecter une interdiction absolue de l’alcool, du tabac et des drogues récréatives sur l’ensemble des installations.",
     "Section 8 — Signalement des Violations et Protection des Lanceurs d’Alerte : Établit une structure de signalement claire et à plusieurs niveaux (Responsable de l’Éthique → CEO → Président du Conseil → Bureau de l’AHSIA), assortie d’une politique de tolérance zéro stricte à l’égard de toute représaille contre un lanceur d’alerte de bonne foi.",
     "Section 9 — Application, Sanctions et Engagement Annuel : Décrit les conséquences administratives et en matière d’habilitation en cas de violation, et impose à l’ensemble du personnel de suivre une formation annuelle et de signer la Déclaration d’Engagement Éthique Annuel (dont le texte intégral figure en annexe)."
   ])
 ]},
{id:"VIII", title:"Charte de Gouvernance des Données et de Confidentialité des Institutions Membres de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Fondement Théologique"),
   P(null,"Les données constituent un actif organisationnel et d’intendance essentiel. En cohérence avec l’engagement adventiste du septième jour envers l’intégrité, le respect de la dignité de la personne et la gestion éthique des ressources, la présente Charte établit les principes normalisés, les exigences opérationnelles et les obligations de confidentialité pour une gestion sécurisée, éthique et alignée sur la mission de l’ensemble des informations cliniques, administratives, financières, opérationnelles et missionnaires au sein du Réseau de l’AHSIA."),
   H("Section 2 — Champ d’Application"),
   P(null,"La présente Charte s’applique à toutes les Institutions Membres de l’AHSIA, y compris :"),
   L(null,["Les membres du Conseil d’Administration local.","Les dirigeants exécutifs, administrateurs et directeurs (CEO, CFO, CMO, CNO).","Le personnel clinique, professionnel, logistique et administratif.","Les entrepreneurs, consultants et fournisseurs tiers.","Les bénévoles et les étudiants.","Toute personne ou entité agissant au nom d’une Institution Membre et disposant d’un accès autorisé à ses systèmes de données ou à ses dossiers sensibles."]),
   H("Section 3 — Principes Fondamentaux de la Gouvernance des Données"),
   P(null,"L’ensemble des données du Réseau de l’AHSIA doit être géré conformément aux cinq principes fondamentaux suivants :"),
   L(null,[
     "Confidentialité : Protection des informations sensibles ou personnelles contre tout accès, toute exposition ou toute divulgation non autorisés.",
     "Intégrité : Garantir que les données demeurent exactes, complètes, fiables et protégées contre toute modification ou altération non autorisée.",
     "Disponibilité : Garantir que le personnel autorisé dispose d’un accès rapide et sécurisé aux informations nécessaires à la prestation des soins cliniques ou à l’exécution des fonctions administratives.",
     "Usage Éthique : Restreindre la collecte, le traitement et le partage des données aux seules fins alignées sur le ministère de guérison adventiste du septième jour, le bien-être des patients et l’efficacité organisationnelle.",
     "Conformité : Respect intégral des lois locales et nationales applicables en matière de protection des données, des réglementations sanitaires, et des politiques de la Division Interaméricaine et de la Conférence Générale."
   ]),
   H("Section 4 — Renseignements et Vie Privée des Patients (Données Cliniques)"),
   P(null,"Afin de protéger le lien de confiance sacré entre les patients et les prestataires de soins adventistes du septième jour, chaque Institution Membre doit :"),
   L(null,[
     "Sécuriser les Dossiers Électroniques : Mettre en œuvre et maintenir des systèmes sécurisés de Dossiers de Santé Électroniques (EHR) et de bases de données cliniques, dotés d’un contrôle d’accès fondé sur les rôles, garantissant que seul le personnel clinique et administratif autorisé a accès aux dossiers des patients.",
     "Prévenir la Divulgation : Mettre en place des mesures de protection physiques et numériques strictes afin de prévenir toute divulgation non autorisée des renseignements cliniques, psychiatriques ou personnels des patients.",
     "Consentement et Autorisation : Utiliser les données cliniques des patients exclusivement à des fins de soins médicaux directs, d’examens de qualité clinique autorisés et d’étalonnage à l’échelle du système. Toute utilisation secondaire des données des patients (telle que la recherche clinique ou le rapportage en santé publique) doit faire l’objet du consentement explicite et écrit du patient ou de son représentant légal, dans le strict respect de la réglementation nationale."
   ]),
   H("Section 5 — Données Institutionnelles, Rapportage et Étalonnage"),
   L(null,[
     "Obligations de Rapportage : Les Institutions Membres doivent soumettre au Bureau de l’AHSIA leurs états financiers mensuels, leurs évaluations MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité) et leurs données de performance clinique.",
     "Sécurité des Données lors de la Transmission : Les Institutions Membres doivent veiller à ce que toutes les données transmises au Bureau de l’AHSIA ou partagées au sein du réseau soient acheminées par des canaux sécurisés, chiffrés et autorisés.",
     "Réciprocité du Bureau de l’AHSIA : Le Bureau de l’AHSIA est tenu de préserver la confidentialité de toutes les données institutionnelles reçues, en les utilisant exclusivement à des fins d’étalonnage à l’échelle du système, d’analyse des tendances, d’examens de la qualité et d’évaluations d’accréditation. Les données propres à une institution ne peuvent être publiées à l’extérieur sans le consentement écrit de l’Union de Rattachement."
   ]),
   H("Section 6 — Santé Numérique, Cybersécurité et Systèmes d’Information"),
   P(null,"Les Institutions Membres doivent protéger activement leurs systèmes opérationnels et leur infrastructure en :"),
   L(null,[
     "Mettant en Œuvre des Mesures de Protection : Établissant des mesures de cybersécurité robustes, notamment des pare-feux, des sauvegardes régulières des systèmes, des logiciels antivirus à jour, des protocoles réseau sécurisés et une authentification multifactorielle (MFA) pour les systèmes critiques.",
     "Effectuant des Audits de Systèmes : Réalisant des audits de sécurité périodiques et des évaluations de vulnérabilité de l’ensemble des serveurs locaux, postes de travail et bases de données cliniques.",
     "Respectant les Normes d’Interopérabilité : Se conformant aux directives normalisées de santé numérique et d’interopérabilité technique promues par le Bureau de l’AHSIA, afin de faciliter une communication sécurisée et harmonieuse à travers le réseau.",
     "Assurant une Formation en Cybersécurité : Offrant une formation obligatoire de sensibilisation à la cybersécurité à l’ensemble des employés, afin d’atténuer les risques liés à l’hameçonnage, aux logiciels malveillants et à l’ingénierie sociale."
   ]),
   H("Section 7 — Obligations de Confidentialité"),
   L(null,[
     "Restriction d’Accès : L’accès autorisé à des données sensibles ne confère ni propriété ni droit de distribuer ces informations. Toute personne ayant accès à des dossiers confidentiels (y compris les dossiers cliniques, les dossiers du personnel, les audits et les budgets stratégiques) doit préserver le caractère strictement confidentiel de ces informations.",
     "Accords de Non-Divulgation (NDA) : Tous les membres du conseil, administrateurs exécutifs, membres du personnel clinique et prestataires externes doivent signer, dès leur nomination ou leur embauche, un Accord de Non-Divulgation (NDA) ou une Déclaration de Confidentialité formels et écrits.",
     "Restitution des Documents : À la fin du rôle, de l’emploi ou du contrat d’une personne, celle-ci doit immédiatement restituer ou détruire de manière sécurisée toutes les copies physiques et numériques de documents institutionnels confidentiels en sa possession. L’accès à l’ensemble des portails électroniques, des dossiers EHR et des systèmes de bases de données doit être révoqué immédiatement."
   ]),
   H("Section 8 — Violation de la Confidentialité et Incidents de Sécurité"),
   L(null,[
     "Signalement Immédiat : Toute violation suspectée, potentielle ou confirmée de la confidentialité des données, tout incident de cybersécurité ou toute divulgation non autorisée de données doit être signalé immédiatement (dans les 24 heures suivant sa découverte) au CEO de l’institution, au Responsable local de la Protection des Données (ou au Directeur des TI), et au Bureau de l’AHSIA.",
     "Atténuation et Enquête : L’Institution Membre doit immédiatement activer son protocole de réponse aux incidents afin de contenir la violation, d’en établir la cause profonde et d’atténuer tout préjudice potentiel pour les patients, les employés ou l’organisation.",
     "Conséquences et Responsabilité : Toute personne qui viole délibérément la présente Charte, porte atteinte à la confidentialité ou fait un usage abusif des données institutionnelles s’expose à des mesures disciplinaires immédiates, pouvant aller jusqu’au licenciement, à la révocation des conseils de gouvernance, à l’exclusion des équipes d’accréditation de l’AHSIA, ainsi qu’à d’éventuelles poursuites civiles ou pénales en vertu des lois locales."
   ]),
   H("Section 9 — Limites de la Propriété des Données"),
   P(null,"Afin de préserver les actifs locaux et l’intégrité du système :"),
   L(null,[
     "Autonomie Institutionnelle : Les Institutions Membres conservent la propriété exclusive de leurs données brutes cliniques, financières et opérationnelles au niveau institutionnel.",
     "Propriété au Niveau du Système : Le Bureau de l’AHSIA conserve la propriété de l’ensemble des analyses au niveau du système, des données agrégées, des rapports MSQ, des scores d’accréditation, des évaluations comparatives et des archives historiques.",
     "Restriction Applicable aux Partenaires Externes : Les Partenaires Techniques, les Conseillers Principaux et les consultants externes ne détiennent aucun droit de propriété sur les données générées, analysées ou partagées au sein du Réseau de l’AHSIA. Il leur est strictement interdit de conserver, d’exporter ou d’utiliser les données du réseau à des fins commerciales ou professionnelles indépendantes, sans le consentement exprès et écrit du Bureau de l’AHSIA et de l’Union de Rattachement."
   ]),
   H("Section 10 — Conservation et Archivage des Données"),
   L(null,[
     "Archivage Normalisé : Les Institutions Membres doivent tenir des archives sécurisées, organisées et conformes aux exigences légales pour l’ensemble des dossiers médicaux cliniques, des états financiers, des procès-verbaux du conseil et des documents réglementaires.",
     "Délais de Conservation : Les politiques de conservation des données doivent être conformes aux dispositions légales nationales, ainsi qu’aux directives normalisées de conservation établies par la Division Interaméricaine et la Conférence Générale des Adventistes du Septième Jour."
   ])
 ]},
{id:"IX", title:"Le Système d’Accréditation de l’AHSIA et le Cadre MSQ pour les Institutions Membres",
 blocks:[
   H("Section 1 — Objet et Objectif Central"),
   L(null,[
     "1.1 Objet : Afin d’atteindre l’excellence clinique, la durabilité stratégique et un alignement missionnaire profond à travers la Division Interaméricaine, toutes les Institutions Membres sont intégrées à un processus d’évaluation unifié, à l’échelle du système, connu sous le nom de Système d’Accréditation de l’AHSIA.",
     "1.2 L’Objectif Central : Cette transition systémique vise à faire évoluer les établissements de santé locaux, d’un fonctionnement en cliniques indépendantes et faiblement coordonnées, vers un réseau professionnel, performant et axé sur la mission, unifié sous le tableau de bord MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité)."
   ]),
   H("Section 2 — Les Dimensions du Tableau de Bord MSQ"),
   P(null,"L’Accréditation de l’AHSIA repose sur trois dimensions fondamentales et interdépendantes. Chaque Institution Membre doit mesurer, documenter et soumettre en continu des indicateurs de performance dans ces trois dimensions :"),
   L(null,[
     "Alignement Missionnaire (M) : Mesure l’intégration active, par l’institution, du ministère de guérison adventiste du septième jour, du Mouvement de Santé Totale et des normes de soins spirituels décrites à l’Annexe V. Les indicateurs clés comprennent le développement spirituel du personnel, l’intégration des soins spirituels aux patients, le respect de la médecine du style de vie (alimentation végétarienne et saine), et les opérations liées à l’observation du sabbat.",
     "Performance des Systèmes (S) : Évalue l’efficacité opérationnelle, le professionnalisme administratif et la durabilité financière de l’institution. Les indicateurs clés comprennent le respect des délais de rapportage financier prévus à l’Annexe III (rapports mensuels soumis avant le 15), l’état de préparation en matière de cybersécurité (conformément à l’Annexe VIII), les évaluations de la direction administrative et l’exactitude de la facturation.",
     "Assurance Qualité (Q) : Assure le suivi de la qualité clinique, de la sécurité des patients et de la conformité institutionnelle aux normes internationales de soins de santé. Les indicateurs clés comprennent les taux de satisfaction des patients, les taux de réadmission clinique, les repères en matière de lutte contre les infections, le signalement des événements sentinelles, ainsi que les normes de permis d’exercice et d’habilitation professionnelle décrites à l’Annexe IV."
   ]),
   H("Section 3 — Les Quatre Niveaux Progressifs d’Accréditation"),
   P(null,"Le processus d’accréditation est structuré en quatre niveaux progressifs et hiérarchisés. Les Institutions Membres doivent gravir systématiquement ces niveaux afin de démontrer leur croissance, leur maturité et leur excellence :"),
   TB(["Niveau d’Accréditation","Orientation et Critères Opérationnels"],[
     ["Niveau 1 : Norme Étoile","Porte sur la conformité opérationnelle de base, l’autorisation sanitaire, les protocoles de sécurité fondamentaux et l’alignement missionnaire initial."],
     ["Niveau 2 : Norme Argent","Marque la mise en place de systèmes de gestion formalisés, de contrôles internes financiers stables et de comités actifs au sein du conseil local."],
     ["Niveau 3 : Norme Or","Représente l’excellence clinique, une intégration avancée de la santé numérique, une gestion des risques robuste et des programmes actifs de santé communautaire."],
     ["Niveau 4 : Norme Platine","Le niveau le plus élevé de leadership au sein du réseau, représentant une qualité clinique de calibre mondial, une pleine indépendance financière et une intégration complète du modèle."]
   ]),
   H("Section 4 — Le Cycle et le Processus d’Accréditation"),
   P(null,"Toutes les Institutions Membres doivent participer au cycle formel d’accréditation géré par le Bureau de l’AHSIA, lequel comprend les phases suivantes :"),
   L(null,[
     "4.1 Auto-Évaluation Annuelle : Chaque Institution Membre doit procéder à un audit interne annuel à l’aide de l’outil normalisé d’auto-évaluation MSQ. Les résultats, approuvés par le Conseil d’Administration local, doivent être soumis au Bureau de l’AHSIA.",
     "4.2 Visite d’Évaluation Quadriennale : Le Bureau de l’AHSIA mandate et déploie une Équipe d’Évaluation d’Accréditation externe afin de réaliser une évaluation intensive sur site de l’Institution Membre, une fois tous les quatre (4) ans.",
     "4.3 Décision d’Accréditation : Sur la base du rapport de la visite d’évaluation sur site, le Conseil d’Administration de l’AHSIA délivre, renouvelle ou ajuste le niveau d’accréditation formel de l’institution.",
     "4.4 Suivi Continu des Données : L’accréditation sur site est subordonnée au maintien, par l’institution, de son rapportage mensuel MSQ (clinique, financier et spirituel) au Bureau de l’AHSIA."
   ]),
   H("Section 5 — Conséquences de la Non-Conformité et Mécanismes de Soutien"),
   L(null,[
     "5.1 Soutien aux Institutions en Difficulté : Si une institution n’atteint pas son statut d’accréditation cible ou éprouve des difficultés à satisfaire aux repères de sécurité fondamentaux, le Bureau de l’AHSIA déploie un accompagnement-conseil technique ciblé.",
     "5.2 Priorité d’Accès au Fonds de Solidarité : Les institutions vulnérables œuvrant activement à l’amélioration de leur statut d’accréditation bénéficient d’un accès prioritaire au Fonds de Solidarité et de Renforcement du Système, pour leurs infrastructures, leurs équipements de qualité ou leurs mises à niveau numériques.",
     "5.3 Sanctions Progressives : Le défaut persistant de participer aux auto-évaluations, d’accueillir les visites d’évaluation, ou de remédier à des lacunes critiques en matière de sécurité ou de mission, entraîne des sanctions administratives progressives de la part du Conseil d’Administration de l’AHSIA, notamment un avertissement formel assorti d’un plan d’action correctif obligatoire, la suspension des ressources techniques ou financières du Fonds de Solidarité, et la suspension temporaire du statut de Membre de l’AHSIA et des droits de vote."
   ]),
   H("Section 6 — Alignement International"),
   P(null,"Le Système d’Accréditation de l’AHSIA opère en harmonie avec les normes mondiales du Conseil International de la Santé Adventiste (IAHC), conformément à la Politique de Travail de la Conférence Générale (FH 35), garantissant que l’excellence des soins de santé interaméricains locaux soit reconnue et respectée à l’échelle mondiale.")
 ]}
];

var APPENDIX_FR = {
 title:"Annexe — Définitions et Interprétation de la Constitution et des Statuts de l’AHSIA",
 blocks:[
   H("Section 1 — Objet et Portée"),
   P(null,"La présente Annexe fournit les définitions officielles et normalisées, ainsi que les principes d’interprétation fondamentaux, régissant l’ensemble de la Constitution de l’AHSIA, ses Statuts et les Annexes Institutionnelles qui l’accompagnent. Afin de prévenir les frictions administratives, les litiges juridiques et les déviations théologiques, toutes les entités du Réseau de Santé Adventiste — y compris le Bureau de l’AHSIA, les Unions de Rattachement, les Conseils d’Administration locaux et les équipes de direction exécutive — doivent interpréter et appliquer les dispositions de la présente Constitution dans le strict respect des termes et règles établis dans le présent document."),
   H("Section 2 — Définitions"),
   P(null,"Aux fins de la présente Constitution et de ses Statuts, les termes suivants sont définis comme suit :"),
   DL([
     {term:"AHSIA", def:"Services de Santé Adventiste Interaméricains (Adventist Healthcare Services Inter-America), qui se prononce « ah-chiya », établie le 20 mai 2010. Ce terme désigne l’organisation à double structure opérant au sein de la Division Interaméricaine (IAD), composée du Bureau de l’AHSIA (organe de coordination) et du Réseau de Santé Adventiste (réseau opérationnel)."},
     {term:"Bureau de l’AHSIA", def:"Le bureau administratif, stratégique et de coordination central de l’AHSIA, dont le siège est situé au siège de la Division Interaméricaine, à Miami, en Floride, aux États-Unis. Il agit sous l’autorité directe de l’IAD et est responsable de la modélisation du système, des examens d’accréditation, de la supervision du MAPS, de l’accompagnement-conseil et de l’alignement à l’échelle du réseau."},
     {term:"Réseau de Santé Adventiste (Réseau de l’AHSIA)", def:"Le réseau coordonné de l’ensemble des institutions de santé adventistes du septième jour opérant sur le territoire géographique de la Division Interaméricaine. Cela comprend les hôpitaux, cliniques ambulatoires, sanatoriums, centres de santé et de style de vie, cliniques mobiles, centres de diagnostic, maisons de retraite et autres initiatives axées sur la santé, détenues ou exploitées par des organisations confessionnelles."},
     {term:"Institution Membre", def:"Tout établissement de santé ou service lié à la santé, exploité par une entité de l’Église Adventiste du Septième Jour (Union, Fédération, Mission ou Division) sur le territoire de la Division Interaméricaine, formellement reconnu comme membre du Réseau de l’AHSIA et participant au Système d’Accréditation de l’AHSIA."},
     {term:"Constituante (Constituante de l’AHSIA)", def:"L’organe représentatif du Réseau de l’AHSIA et de la Division Interaméricaine, qui se réunit en session tous les cinq (5) ans afin d’approuver les principales normes du système, d’examiner les rapports de performance, d’élire les dirigeants et de se prononcer sur les amendements constitutionnels."},
     {term:"Conseil d’Administration (Conseil d’Administration de l’AHSIA)", def:"L’organe principal de décision et de supervision de l’AHSIA. Composé de treize (13) membres, il est responsable de la gouvernance du système, de l’approbation des budgets de fonctionnement, du suivi des résultats d’accréditation et de la conformité aux politiques de la Conférence Générale."},
     {term:"Partenaire Technique", def:"Une organisation externe — adventiste ou non adventiste — qui collabore avec le Bureau de l’AHSIA ou avec des Institutions Membres individuelles afin de fournir une expertise clinique spécialisée, une formation éducative, un développement de la recherche, une assistance logistique ou un financement stratégique. Les Partenaires Techniques sont explicitement exclus des fonctions de gouvernance, ne détiennent aucun droit de vote et ne possèdent aucune autorité administrative directe au sein de l’AHSIA ou de ses membres. Parmi les exemples figurent Loma Linda University Health (LLUH), AdventHealth Global Missions, l’Université Andrews et ADRA."},
     {term:"Conseiller Principal", def:"Un expert hautement reconnu en santé, en clinique, en finances ou en gouvernance, formellement invité par le Bureau de l’AHSIA à fournir des conseils techniques et stratégiques. Les Conseillers Principaux agissent strictement à titre consultatif, ne détiennent aucun pouvoir de gouvernance ou exécutif, et ne possèdent aucun droit de vote au sein du Conseil d’Administration ou de ses comités."},
     {term:"MAPS (Modèle des Services de Santé Primaires Adventistes)", def:"Le cadre officiel adventiste du septième jour de prestation de soins de santé primaires. Il fournit un modèle opérationnel normalisé et axé sur la mission, conçu pour offrir des soins primaires accessibles, de haute qualité et rentables, intégrant la médecine du style de vie, l’éducation à la santé et les soins spirituels."},
     {term:"Niveaux d’Accréditation de l’AHSIA", def:"Le système d’évaluation progressif à quatre niveaux, géré par le Bureau de l’AHSIA, destiné à reconnaître, étalonner et encourager l’excellence organisationnelle, la qualité des soins et l’intégrité missionnaire à travers le Réseau : Niveau Étoile (conformité fondamentale aux attentes missionnaires adventistes, exigences de base en matière de sécurité clinique et systèmes administratifs essentiels) ; Niveau Argent (progression mesurable vers une performance intégrée des systèmes, des programmes actifs de santé communautaire et des pratiques de gouvernance renforcées) ; Niveau Or (alignement de haut niveau sur la Philosophie Adventiste de la Santé Globale (Holistique), excellence clinique et financière constante, et impact spirituel soutenu) ; Niveau Platine (performance exemplaire, à l’avant-garde du système, intégration harmonieuse de la qualité clinique et de la mission, maturité opérationnelle avancée, et résultats de bien-être communautaire manifestement supérieurs)."},
     {term:"Cadre MSQ (Alignement Missionnaire, Performance des Systèmes et Assurance Qualité)", def:"Le cadre complet d’évaluation et de rapportage à l’échelle du réseau, utilisé par le Bureau de l’AHSIA pour évaluer et accréditer les Institutions Membres. Il assure le suivi d’indicateurs qualitatifs et quantitatifs selon trois piliers : l’alignement missionnaire spirituel, la performance des systèmes opérationnels et financiers, et la qualité clinique/sécurité des patients."},
     {term:"Mouvement de Santé Totale (Philosophie de la Santé Globale/Holistique)", def:"Le cadre théologique et philosophique de l’Église Adventiste du Septième Jour, qui envisage la santé comme la restauration complète des dimensions physique, mentale, sociale et spirituelle de la vie humaine, à l’image du ministère de guérison de Jésus-Christ."},
     {term:"Comité Permanent", def:"Un organe consultatif ou préparatoire permanent, établi par le Conseil d’Administration de l’AHSIA (ou par un conseil institutionnel) afin d’assurer une supervision continue et spécialisée d’un domaine fonctionnel essentiel (par exemple, l’Exécutif, les Finances, la Qualité ou l’Orientation Missionnaire), et de rendre compte de ses conclusions lors des sessions régulières du conseil."},
     {term:"Commission", def:"Un organe temporaire, ad hoc et limité dans le temps, nommé par le Conseil d’Administration pour exécuter un projet ou une enquête spécifique et clairement défini, et qui est automatiquement dissous après la soumission de son rapport final."},
     {term:"Constitution", def:"L’instrument fondateur de gouvernance des Services de Santé Adventiste Interaméricains, qui comprend l’ensemble des Articles fondamentaux (Articles I à XIII), leurs Annexes obligatoires correspondantes (Annexes I à IX), et la présente Annexe."}
   ]),
   H("Section 3 — Principes d’Interprétation"),
   P(null,"Afin de garantir la stabilité juridique et l’intégrité théologique, l’interprétation de la présente Constitution et de ses statuts est régie par les six principes suivants :"),
   L(null,[
     "3.1 Priorité de la Mission : Toutes les clauses, sections et définitions doivent être interprétées de manière à privilégier et à faire progresser la mission spirituelle et physique de guérison de l’Église Adventiste du Septième Jour. Si une clause se prête à plusieurs interprétations, l’interprétation qui préserve le mieux le témoignage chrétien, les normes théologiques et la mission spirituelle du Réseau doit prévaloir.",
     "3.2 Cohérence avec les Politiques de la Conférence Générale et de l’IAD : En cas d’ambiguïté, d’omission ou de contradiction perçue entre la présente Constitution et la Politique de Travail de la Conférence Générale (CG) ou la Politique de Travail de la Division Interaméricaine (IAD), les politiques de la CG et de l’IAD prévalent toujours et demeurent supérieures.",
     "3.3 Règle du Sens Ordinaire : Sauf lorsqu’un terme est explicitement défini à la Section 2 de la présente Annexe ou dans un article particulier de la présente Constitution, les mots et expressions doivent être interprétés selon leur sens ordinaire, naturel, grammatical et courant en langue anglaise.",
     "3.4 Interprétation Contextuelle (Règle de l’Ensemble) : Les articles, sections, annexes et appendices de la présente Constitution doivent être interprétés comme un document unique, cohérent et intégré. Aucune clause ne doit être lue isolément de manière à contredire ou à faire échec à l’intention générale, à la structure de gouvernance ou à l’harmonie opérationnelle de l’AHSIA.",
     "3.5 Absence d’Autorité Implicite : Aucun dirigeant exécutif, membre de conseil, comité ou institution individuelle ne peut revendiquer, déduire ou exercer un pouvoir administratif, un droit de gouvernance ou une autorité de supervision qui ne lui est pas expressément et clairement accordé par la présente Constitution ou par des résolutions formelles votées par le Conseil.",
     "3.6 Protection de la Propriété Institutionnelle : En aucun cas une clause, une définition ou un principe de la présente Constitution ne peut être interprété, appliqué ou modifié de manière à altérer, transférer, diluer ou compromettre la propriété exclusive des actifs, les titres de propriété, les droits fonciers ou l’autorité de gouvernance corporative locale d’une entité de rattachement de l’Église Adventiste du Septième Jour sur son Institution Membre lui appartenant."
   ]),
   H("Section 4 — Résolution des Ambiguïtés"),
   P(null,"En cas de litige, de désaccord ou d’ambiguïté concernant le sens, la portée ou l’application d’un article, d’une section ou d’une annexe de la présente Constitution :"),
   L(null,[
     "Le Conseil d’Administration de l’AHSIA détient l’autorité initiale d’interpréter le texte et d’émettre une résolution clarificatrice.",
     "L’interprétation du Conseil doit être formellement soumise à l’Administration de la Division Interaméricaine pour examen final, avis consultatif et mise en conformité juridique.",
     "Une fois examinée et ratifiée par l’Administration de l’IAD, la résolution clarificatrice du Conseil d’Administration est définitive, contraignante, et consignée au registre officiel des interprétations constitutionnelles tenu par le Secrétaire du Bureau de l’AHSIA."
   ]),
   H("Section 5 — Version Linguistique Faisant Autorité"),
   L(null,[
     "Autorité de la Langue Anglaise : Bien que la présente Constitution, ses Statuts et ses Annexes puissent être traduits en français, en espagnol ou dans d’autres langues régionales de la Division Interaméricaine afin de faciliter l’administration locale, la version anglaise demeure le seul texte officiel, juridiquement contraignant et faisant autorité.",
     "Résolution des Conflits : En cas de divergence de traduction, de conflit sémantique ou de désaccord d’interprétation entre différentes versions linguistiques, le texte anglais sera utilisé exclusivement pour résoudre le conflit et établir le sens juridique correct."
   ])
 ]

function randomToken(){
  try{
    var bytes = new Uint8Array(24);
    crypto.getRandomValues(bytes);
    return Array.prototype.map.call(bytes,function(b){return b.toString(16).padStart(2,"0");}).join("");
  }catch(e){
    return uid()+"_"+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
  }
}

function stashPending(articleNum, payload){

  }catch(e){ return null; }
