<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AHSIA Constitution Review</title>
<meta name="description" content="AHSIA 2026 Constitution review, article-by-article voting, and feedback platform.">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#142E2A;
  --ink-700:#28453F;
  --ink-600:#3E5C56;
  --ink-400:#6B857E;
  --paper-0:#F2F1EA;
  --surface-0:#FDFCF6;
  --surface-1:#FFFFFF;
  --line:#DAD6C5;
  --line-soft:#E7E4D6;
  --accent:#B7862E;
  --accent-ink:#7A5A1D;
  --accent-soft:#F1E3C7;
  --old:#A8503A;
  --old-soft:#F3E2DC;
  --old-ink:#7C3A29;
  --new:#2F7D5C;
  --new-soft:#DDECE3;
  --new-ink:#1F5B41;
  --table-amber:#B7862E;
  --shadow:0 1px 2px rgba(20,46,42,.06), 0 8px 24px -12px rgba(20,46,42,.18);
  --radius:10px;
  --focus:#2F7D5C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink-900:#EDEAE0;
    --ink-700:#D6D2C4;
    --ink-600:#AEB8B2;
    --ink-400:#7E948C;
    --paper-0:#0E211E;
    --surface-0:#152C27;
    --surface-1:#182F2A;
    --line:#2A453D;
    --line-soft:#203832;
    --accent:#D6A44C;
    --accent-ink:#F0CE8E;
    --accent-soft:#3A2E14;
    --old:#E08A6E;
    --old-soft:#3A241D;
    --old-ink:#F0AF98;
    --new:#5FBE93;
    --new-soft:#173327;
    --new-ink:#8EDCB6;
    --table-amber:#D6A44C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    --focus:#5FBE93;
  }
}
:root[data-theme="dark"]{
  --ink-900:#EDEAE0;
  --ink-700:#D6D2C4;
  --ink-600:#AEB8B2;
  --ink-400:#7E948C;
  --paper-0:#0E211E;
  --surface-0:#152C27;
  --surface-1:#182F2A;
  --line:#2A453D;
  --line-soft:#203832;
  --accent:#D6A44C;
  --accent-ink:#F0CE8E;
  --accent-soft:#3A2E14;
  --old:#E08A6E;
  --old-soft:#3A241D;
  --old-ink:#F0AF98;
  --new:#5FBE93;
  --new-soft:#173327;
  --new-ink:#8EDCB6;
  --table-amber:#D6A44C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  --focus:#5FBE93;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper-0);
  color:var(--ink-900);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--new-ink);}
h1,h2,h3,h4{font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; text-wrap:balance; color:var(--ink-900); margin:0 0 .5em;}
p{margin:0 0 .85em; max-width:66ch;}
ul{margin:0 0 .85em; padding-left:1.25em; max-width:64ch;}
li{margin-bottom:.4em;}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

/* ---------- shell ---------- */
#app{min-height:100vh;}
.shell{display:grid; grid-template-columns:272px 1fr; min-height:100vh;}
@media (max-width:920px){ .shell{grid-template-columns:1fr;} }

.sidebar{
  border-right:1px solid var(--line);
  background:var(--surface-0);
  padding:28px 20px 40px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
@media (max-width:920px){
  .sidebar{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); display:none;}
  .sidebar.open{display:block;}
}
.brand{display:flex; align-items:center; gap:.6em; margin-bottom:22px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(155deg,var(--new) 0%, var(--ink-700) 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-family:"Fraunces",serif; font-weight:700; font-size:15px; flex:none;
  box-shadow:var(--shadow);
}
.brand-text{line-height:1.15;}
.brand-text .t1{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-400);}
.brand-text .t2{font-family:"Fraunces",serif; font-weight:600; font-size:16.5px;}

.navgroup-label{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-400); margin:20px 0 8px; padding-left:10px;}
.navgroup-label:first-of-type{margin-top:4px;}
nav.articlenav{display:flex; flex-direction:column; gap:2px;}
.navitem{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:8px; text-decoration:none;
  color:var(--ink-700); font-size:14.5px;
  border:1px solid transparent;
}
.navitem:hover{background:var(--surface-1); border-color:var(--line-soft);}
.navitem.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
.navitem .num{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-400); width:22px; flex:none;}
.navitem.active .num{color:var(--accent-ink);}
.navitem .label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.navitem .count{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-400); background:var(--surface-1); border:1px solid var(--line-soft); border-radius:20px; padding:1px 7px; flex:none;}
.navitem.active .count{background:rgba(0,0,0,.06);}

.lang-switcher{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:18px; padding:10px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface-1);}
.lang-label{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-400);}
.lang-btns{display:flex; gap:4px;}
.langbtn{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; border:1px solid var(--line); background:var(--surface-0); color:var(--ink-600); border-radius:6px; padding:4px 8px; cursor:pointer;}
.langbtn:hover{border-color:var(--ink-400);}
.langbtn.active{background:var(--ink-900); color:var(--paper-0); border-color:var(--ink-900);}
#topbar-lang{flex:none;}
#topbar-lang .langbtn{padding:3px 7px; font-size:10px;}

.topbar{display:none; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--surface-0); position:sticky; top:0; z-index:20;}
@media (max-width:920px){ .topbar{display:flex;} }
.hamburger{width:38px;height:38px;border-radius:8px;border:1px solid var(--line); background:var(--surface-1); display:flex;align-items:center;justify-content:center; cursor:pointer;}
.hamburger span, .hamburger::before, .hamburger::after{display:none;}
.hamburger svg{width:18px;height:18px;stroke:var(--ink-700);}

main.view{padding:44px 48px 90px; max-width:980px;}
@media (max-width:920px){ main.view{padding:28px 20px 70px;} }

/* ---------- banners / toasts ---------- */
.banner{
  border:1px solid var(--line); background:var(--surface-1); border-radius:var(--radius);
  padding:12px 16px; margin-bottom:22px; font-size:14px; color:var(--ink-700);
  display:flex; align-items:flex-start; gap:10px;
}
.banner.warn{border-color:var(--old); background:var(--old-soft); color:var(--old-ink);}
.banner.info{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);}
.banner b{color:inherit;}
.toast-stack{position:fixed; right:20px; bottom:20px; z-index:60; display:flex; flex-direction:column; gap:8px; max-width:340px;}
.toast{background:var(--ink-900); color:var(--paper-0); border-radius:9px; padding:11px 14px; font-size:13.5px; box-shadow:var(--shadow); animation:toastin .18s ease-out;}
@keyframes toastin{from{transform:translateY(6px); opacity:0;} to{transform:translateY(0); opacity:1;}}

/* ---------- intro ---------- */
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:10px;}
.hero h1{font-size:clamp(28px,4vw,40px); max-width:16ch; margin-bottom:.3em;}
.hero .lede{font-size:18px; color:var(--ink-700); max-width:62ch;}
.card{background:var(--surface-1); border:1px solid var(--line); border-radius:14px; padding:26px 28px; box-shadow:var(--shadow);}
.stepcard{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:26px 0 8px;}
@media (max-width:760px){ .stepcard{grid-template-columns:1fr 1fr;} }
.step{background:var(--surface-1); border:1px solid var(--line); border-radius:12px; padding:16px;}
.step .n{font-family:"Fraunces",serif; font-size:22px; color:var(--accent);}
.step p{font-size:13.5px; color:var(--ink-600); margin:.3em 0 0;}
.cta-row{display:flex; gap:12px; flex-wrap:wrap; margin:22px 0 8px;}
.btn{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer; border-radius:9px;
  padding:11px 18px; font-size:14.5px; font-weight:600; border:1px solid transparent; text-decoration:none;
}
.btn-primary{background:var(--ink-900); color:var(--paper-0);}
.btn-primary:hover{background:var(--ink-700);}
.btn-outline{background:transparent; border-color:var(--line); color:var(--ink-700);}
.btn-outline:hover{border-color:var(--ink-400);}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.summary-list{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
.summary-row{border:1px solid var(--line); border-radius:12px; background:var(--surface-1); overflow:hidden;}
.summary-row > summary{
  list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:14px;
}
.summary-row > summary::-webkit-details-marker{display:none;}
.summary-row .rn{font-family:"IBM Plex Mono",monospace; color:var(--accent-ink); font-size:12.5px; width:64px; flex:none;}
.summary-row .rt{font-weight:600; flex:1; font-size:15px;}
.summary-row .rmap{font-size:12px; color:var(--ink-400); flex:none; display:none;}
@media(min-width:700px){ .summary-row .rmap{display:block;} }
.summary-row .chev{color:var(--ink-400); transition:transform .15s;}
.summary-row[open] .chev{transform:rotate(90deg);}
.summary-body{padding:0 18px 18px 18px; font-size:14px; color:var(--ink-700); border-top:1px solid var(--line-soft); padding-top:14px;}
.summary-body .rmap-mobile{font-size:12px; color:var(--ink-400); margin-bottom:8px;}

/* ---------- article page ---------- */
.article-head{display:flex; align-items:flex-start; gap:20px; margin-bottom:8px;}
.article-num{font-family:"Fraunces",serif; font-weight:600; font-size:52px; color:var(--accent); line-height:1;}
.article-head h1{font-size:clamp(22px,3vw,30px); margin-bottom:.15em;}
.chip{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; padding:3px 10px; border-radius:20px; border:1px solid var(--line); color:var(--ink-600); background:var(--surface-1);}
.chip.new{border-color:var(--new); color:var(--new-ink); background:var(--new-soft);}

.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:26px 0 24px;}
@media (max-width:840px){ .compare-grid{grid-template-columns:1fr;} }
.col{border-radius:14px; border:1px solid var(--line); background:var(--surface-1); overflow:hidden; box-shadow:var(--shadow);}
.col-tab{padding:12px 20px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; border-bottom:1px solid var(--line);}
.col.old .col-tab{background:var(--old-soft); color:var(--old-ink); border-color:var(--old);}
.col.new .col-tab{background:var(--new-soft); color:var(--new-ink); border-color:var(--new);}
.col-body{padding:20px 22px;}
.col.old .col-body{color:var(--ink-700);}
.col.old .col-body p, .col.old .col-body li{text-decoration:line-through; text-decoration-color:var(--old); text-decoration-thickness:1.5px;}
.col.old .col-body h4, .col.old .col-body .block-label, .col.old .col-body .empty-note{text-decoration:none;}
.block-label{font-weight:600; margin:.6em 0 .3em; font-size:14.5px;}
.empty-note{font-style:italic; color:var(--ink-400); text-decoration:none !important;}
.col-body h4{font-size:15px; margin-top:1em;}
.source-note{font-size:11.5px; color:var(--ink-400); margin:0 0 .8em; font-style:italic;}
.table-wrap{overflow-x:auto; margin:0 0 1em; border:1px solid var(--line-soft); border-radius:10px;}
.table-wrap table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:480px;}
.table-wrap th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-400); text-align:left; padding:9px 12px; background:var(--surface-0); border-bottom:1px solid var(--line-soft);}
.table-wrap td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top; color:var(--ink-700);}
.table-wrap tr:last-child td{border-bottom:none;}
.def-list{margin:0 0 .85em;}
.def-list dt{font-weight:700; font-size:14px; margin-top:.9em; color:var(--ink-900);}
.def-list dt:first-child{margin-top:0;}
.def-list dd{margin:.2em 0 0; color:var(--ink-700); max-width:64ch;}

/* ---------- annexes ---------- */
.annex-list{display:flex; flex-direction:column; gap:14px; margin-top:24px;}
.annex-card{border:1px solid var(--line); border-radius:14px; background:var(--surface-1); overflow:hidden; box-shadow:var(--shadow);}
.annex-card > summary{list-style:none; cursor:pointer; padding:18px 22px; display:flex; align-items:baseline; gap:14px;}
.annex-card > summary::-webkit-details-marker{display:none;}
.annex-card .ac-id{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--accent-ink); flex:none;}
.annex-card .ac-title{font-family:"Fraunces",serif; font-weight:600; font-size:17px; flex:1;}
.annex-card .chev{color:var(--ink-400); transition:transform .15s; flex:none;}
.annex-card[open] .chev{transform:rotate(90deg);}
.annex-body{padding:0 22px 24px; border-top:1px solid var(--line-soft); padding-top:18px;}

/* ---------- vote + comment ---------- */
.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:28px;}
@media (max-width:840px){ .action-grid{grid-template-columns:1fr;} }
.blocklabel{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.blocklabel .letter{font-family:"IBM Plex Mono",monospace; font-size:11px; width:20px;height:20px;border-radius:5px;background:var(--ink-900);color:var(--paper-0); display:flex;align-items:center;justify-content:center;flex:none;}
.blocklabel .txt{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-400);}

.vote-pills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.pill{flex:1; min-width:130px; border:1.5px solid var(--line); border-radius:10px; padding:12px 10px; text-align:center; cursor:pointer; background:var(--surface-1); transition:border-color .12s, background .12s;}
.pill .pt{font-weight:700; font-size:14px;}
.pill .ps{font-size:11.5px; color:var(--ink-400); display:block; margin-top:2px;}
.pill:hover{border-color:var(--ink-400);}
.pill.sel-accept{border-color:var(--new); background:var(--new-soft); color:var(--new-ink);}
.pill.sel-table{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);}
.pill.sel-reject{border-color:var(--old); background:var(--old-soft); color:var(--old-ink);}
.pill.sel-accept .ps, .pill.sel-table .ps, .pill.sel-reject .ps{color:inherit; opacity:.75;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-600); margin-bottom:5px;}
.field input, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:inherit;
  font-size:14.5px; background:var(--surface-0); color:var(--ink-900);
}
.field input:focus, .field textarea:focus{border-color:var(--focus);}
.field textarea{min-height:96px; resize:vertical;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:480px){ .field-row{grid-template-columns:1fr;} }
.form-foot{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap;}
.form-msg{font-size:12.5px; color:var(--ink-400);}
.form-msg.err{color:var(--old-ink);}
.form-msg.ok{color:var(--new-ink);}

.tally{margin-top:22px;}
.tally-bar{display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--line-soft); margin-bottom:8px;}
.tally-bar span{height:100%;}
.tally-legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-600);}
.tally-legend .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}

.comment-feed{margin-top:16px; display:flex; flex-direction:column; gap:12px; max-height:420px; overflow-y:auto; padding-right:4px;}
.comment-item{border:1px solid var(--line-soft); border-radius:10px; padding:12px 14px; background:var(--surface-0);}
.comment-item .ci-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
.comment-item .ci-name{font-weight:700; font-size:13.5px;}
.comment-item .ci-org{font-size:12px; color:var(--ink-400);}
.comment-item .ci-vote{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:2px 8px; border-radius:20px;}
.comment-item .ci-vote.accept{background:var(--new-soft); color:var(--new-ink);}
.comment-item .ci-vote.table{background:var(--accent-soft); color:var(--accent-ink);}
.comment-item .ci-vote.reject{background:var(--old-soft); color:var(--old-ink);}
.comment-item .ci-text{font-size:13.5px; color:var(--ink-700); margin:0;}
.comment-item .ci-time{font-size:10.5px; color:var(--ink-400); margin-top:4px;}
.empty-feed{font-size:13px; color:var(--ink-400); font-style:italic;}

.article-foot-nav{display:flex; justify-content:space-between; gap:12px; margin-top:36px; padding-top:24px; border-top:1px solid var(--line);}
.article-foot-nav a{flex:1; border:1px solid var(--line); border-radius:10px; padding:12px 16px; text-decoration:none; color:var(--ink-700); font-size:13.5px;}
.article-foot-nav a:hover{border-color:var(--ink-400);}
.article-foot-nav a.next{text-align:right;}
.article-foot-nav .fn-label{display:block; font-size:10.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px; font-family:"IBM Plex Mono",monospace;}

/* ---------- results ---------- */
.results-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin:24px 0 36px;}
.rcard{border:1px solid var(--line); border-radius:12px; background:var(--surface-1); padding:16px 18px; text-decoration:none; color:inherit; display:block; box-shadow:var(--shadow);}
.rcard:hover{border-color:var(--ink-400);}
.rcard .rc-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.rcard .rc-num{font-family:"IBM Plex Mono",monospace; color:var(--accent-ink); font-size:12px;}
.rcard .rc-count{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-400);}
.rcard .rc-title{font-weight:600; font-size:14.5px; margin-bottom:10px;}
.section-title{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:36px 0 4px;}
.allfeed{display:flex; flex-direction:column; gap:10px; margin-top:16px;}

footer.pagefoot{margin-top:60px; padding-top:24px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-400);}
</style>
</head>
<body>
<div id="app"></div>
<script id="state-data" type="application/json">{"responses":{}}</script>
<script id="app-script">
(function(){
"use strict";

/* ============ constitution data ============ */
function esc(s){
  s = (s===undefined||s===null) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

var VOTE_OPTIONS = [
  {v:"accept", label:"Accept", sub:"Adopt as written"},
  {v:"table", label:"Table", sub:"Defer for further discussion"},
  {v:"reject", label:"Reject", sub:"Do not adopt"}
];

var SUMMARY_EN = [
 {n:1, title:"Name, History and Location", map:"2026 Art. I ↔ 2022 Art. I", text:"Establishes the name, historical origin (May 20, 2010) and Miami headquarters. The 2026 revision introduces a vital structural distinction: AHSIA as a dual entity of the “Adventist Healthcare Network” (local member institutions) and the central “AHSIA-Office” (mission alignment, accreditation, quality review) — preventing legal and administrative confusion between local facilities and the central regulatory body."},
 {n:2, title:"Members", map:"2026 Art. II ↔ 2022 Art. II", text:"Defines membership to include all SDA healthcare facilities owned or operated by a church entity in the IAD. The 2026 update formalizes these facilities as the collective “Adventist Healthcare Network,” clearly defining legal and ecclesiastical boundaries so only officially recognized, church-owned entities can claim membership and benefits."},
 {n:3, title:"Purpose", map:"2026 Art. III ↔ 2022 Art. III", text:"Shifts from the general institutional “ambitions” of 2022 to concrete AHSIA-Office responsibilities: mission alignment, system modeling, the progressive accreditation system, quality monitoring, and financial/operational capacity building. Mandates integrating the Adventist Philosophy of Wholistic Health (Total Health Movement) into all clinical and administrative practice."},
 {n:4, title:"Operations", map:"2026 Art. IV ↔ 2022 Art. IV (Objectives) & Art. V (Operation)", text:"Establishes AHSIA’s three-tier governance system — the AHSIA Constituency, the odd-numbered AHSIA Governing Board, and AHSIA Executive Leadership — with a rotating board composition of Union representatives, local CEOs, and lay professionals. Provides structural checks and balances while explicitly barring AHSIA-Office from interfering in daily institutional operations, preserving local board autonomy."},
 {n:5, title:"Functions of the Officers", map:"2026 Art. V ↔ 2022 Art. V (President/Treasurer sections)", text:"Details the duties of the President, regional/functional Vice Presidents, Secretary and Treasurer of AHSIA-Office, and defines Senior Advisers. Critically, it bars the Treasurer from intervening in local financial board decisions and confines Senior Advisers strictly to technical, non-voting advisory roles — preventing central overreach into local church-entity governance."},
 {n:6, title:"Quorum", map:"2026 Art. VI ↔ 2022 Art. VI", text:"Replaces one vague quorum rule with two clear thresholds: a Constituency quorum of a simple majority of accredited delegates, and a Governing Board quorum of seven (7) members including the Chair or designee — ensuring procedural legality and preventing minority-voted resolutions from binding the system."},
 {n:7, title:"Finances", map:"2026 Art. VII ↔ 2022 Art. VII", text:"Expands the financial structure of AHSIA-Office and Member Institutions and introduces the Solidarity and System Strengthening Fund, a rotating capital fund for vulnerable or under-accredited clinics. Enforces accountability aligned with GC/IAD policy, mandates monthly financial reporting by the 15th, and explicitly bars network funds from supporting Technical Partners."},
 {n:8, title:"Technical Partners", map:"2026 Art. VIII ↔ 2022 Art. IX (Operational Partners)", text:"Regulates collaboration with external Adventist and non-Adventist organizations (e.g. Loma Linda University, AdventHealth, ADRA) through formal MOUs, which must respect local institutional ownership, protect AHSIA’s governance autonomy, and prevent any transfer of administrative or decision-making authority to third parties."},
 {n:9, title:"Liability and Indemnity", map:"2026 Art. IX ↔ 2022 Art. X", text:"Separates the legal liabilities of AHSIA-Office, individual Member Institutions and Technical Partners — each solely responsible for its own actions. New in 2026: mandatory participation in the IAD’s Professional Liability Group Insurance through Adventist Risk Management (ARM), or an equivalent independent policy, protecting the wider denomination from joint financial exposure."},
 {n:10, title:"Dissolution", map:"2026 Art. X ↔ 2022 Art. XI", text:"AHSIA may only be dissolved by a Constituency vote ratified by the IAD Executive Committee, with a progressive distribution of remaining assets to underserved SDA health ministries. Section 10.4 guarantees that dissolving AHSIA-Office will never dissolve or alter the legal status, church ownership, or local governance of individual Member Institutions."},
 {n:11, title:"Conflict of Interest", map:"New — no corresponding 2022 article", text:"A completely new article introducing a comprehensive conflict-of-interest policy for board members, officers, delegates and advisers: defines conflicts, requires annual written disclosure, mandates recusal from related discussions and votes, and enforces disciplinary sanctions — protecting transparency and the ethical reputation of the church’s healthcare system."},
 {n:12, title:"Annexes", map:"New — no corresponding 2022 article", text:"Serves as the legal bridge authorizing binding, specialized operational annexes (board guidelines, data governance, code of ethics, and more). A significant flexibility gain: annexes may be amended by a simple Governing Board majority rather than requiring full, costly Constituency ratification."},
 {n:13, title:"Bylaws Amendment Standards for Member Institutions", map:"New — no corresponding 2022 article", text:"Standardizes how local Member Institutions amend their own bylaws: a 90-day submission timeline, a two-thirds board vote, and mandatory ratification by the Sponsoring Union’s Executive Committee. Its “Fundamental Restrictions” clause permanently outlaws any local amendment that would alter church asset ownership, transfer management to third parties, grant board rights to Technical Partners, or dilute Adventist wholistic-health identity."}
];

{num:11, roman:"XI", title:"Conflict of Interest",
 original:[ N(NEW_ARTICLE_NOTE) ],
 updated:[
   P("Section 11.1 — Purpose","To ensure that all decisions and actions taken within AHSIA serve the best interest of the Network, free from undue influence, personal gain, or competing loyalties."),
   P("Section 11.2 — Applicability","This policy applies to:"),
   L(null,["AHSIA Governing Board members.","AHSIA Constituency delegates.","Officers of AHSIA-Office.","Directors and Vice Presidents of AHSIA-Office.","Senior Advisers acting in an advisory capacity.","Any individual participating in AHSIA committees, accreditation teams, or decision-making processes."]),
   P("Section 11.3 — Definition of Conflict of Interest","A conflict of interest exists when an individual’s personal, financial, professional, or relational interests could reasonably be perceived to influence, compromise, or bias their judgment or actions on behalf of AHSIA. Conflicts may include:"),
   L(null,["Financial interests in a vendor, contractor, or partner organization.","Employment or consulting relationships with Member Institutions or Technical Partners.","Family or close personal relationships with individuals affected by AHSIA decisions.","Dual roles that create divided loyalties.","Gifts, favors, or benefits that could influence decision-making.","Participation in decisions where the individual stands to gain personally or professionally."]),
   P("Section 11.4 — Duty to Disclose","All individuals covered by this article must:"),
   L(null,["Disclose any actual, potential, or perceived conflict of interest in writing to the AHSIA President or Board Chair.","Update disclosures annually and whenever circumstances change.","Refrain from participating in discussions or votes related to the disclosed conflict."]),
   P("Section 11.5 — Recusal Requirements","Any individual with a conflict of interest shall:"),
   L(null,["Abstain from voting.","Leave the meeting during deliberations.","Not attempt to influence the decision.","Not receive confidential information related to the matter."]),
   P(null,"The Governing Board shall document all recusals in the official minutes."),
   P("Section 11.6 — Prohibited Conduct","The following actions are strictly prohibited:"),
   L(null,["Using one’s position for personal or financial gain.","Accepting gifts, payments, or benefits intended to influence decisions.","Participating in procurement decisions involving a related party.","Serving simultaneously in roles that compromise independence or objectivity.","Using confidential information for personal advantage."]),
   P("Section 11.7 — Review and Determination","The Governing Board shall review all disclosures and determine whether a conflict exists. The Board may:"),
   L(null,["Require recusal.","Request additional information.","Impose corrective actions.","Remove an individual from a role if necessary."]),
   P("Section 11.8 — Violations","Failure to disclose a conflict of interest, or violation of this policy, may result in:"),
   L(null,["Removal from the Governing Board.","Removal from AHSIA-Office.","Termination of advisory roles.","Disqualification from accreditation teams.","Other disciplinary actions as determined by the Governing Board."]),
   P("Section 11.9 — Transparency","AHSIA-Office shall maintain a confidential registry of all conflict-of-interest disclosures and ensure the Governing Board receives annual reports on compliance.")
 ]},
{num:12, roman:"XII", title:"Annexes",
 original:[ N(NEW_ARTICLE_NOTE) ],
 updated:[
   P("Section 12.1 — Purpose and Authority of the Annexes","To ensure standardized governance, operational harmony, and mission integrity across the Adventist Healthcare Network, specific policies, charters, and operational guidelines governing Member Institutions are set forth in the Annexes attached to this Constitution."),
   P("Section 12.2 — Binding Nature","The provisions contained in the Annexes shall be legally binding upon all Member Institutions of AHSIA. Every Member Institution shall align its local bylaws, operational policies, and board structures with the standards defined in the Annexes."),
   P("Section 12.3 — Amendment and Revision of Annexes","Unlike the main Articles of this Constitution, which require ratification by the Constituency and the IAD Executive Committee, the Annexes may be revised, amended, or updated by a simple majority vote of the AHSIA Governing Board during any regular session, in consultation with the Inter-American Division — keeping operational guidelines flexible while preserving the stability of the core Constitution."),
   N("The full text of Annexes I–IX (Governing Board composition, Executive Committee, Finance & Audit Committee, Quality & Patient Safety Committee, Mission Focus Committee, the Patient/Employee/User Rights Charter, the Code of Ethics, the Data Governance Charter, and the AHSIA Accreditation System) is available in the complete constitution document linked from the Introduction page.")
 ]},
{num:13, roman:"XIII", title:"Bylaws Amendment Standards for Member Institutions",
 original:[ N(NEW_ARTICLE_NOTE) ],
 updated:[
   P("Section 13.1 — Purpose & Authority","Sponsoring church entities (Unions or local Fields) retain ultimate authority. No local amendment is valid without Union ratification and advisory review by AHSIA-Office."),
   P("Section 13.2 — Proposers","Proposals are limited to Union Officers, the Board Chair, the local CEO, or a one-third written petition of the local board."),
   P("Section 13.3 — Mandatory Timeline","Enforces a disciplined 90-day submission period, 60-day notice, a two-thirds board vote, and final written ratification by the Union Executive Committee."),
   P("Section 13.4 — Fundamental Restrictions","Outlaws any amendment that would:"),
   L(null,["Modify church ownership of physical assets.","Transfer governance to third parties.","Grant voting rights to Technical Partners or Senior Advisers.","Conflict with IAD/GC Working Policy.","Dilute Seventh-day Adventist identity, including Sabbath-keeping, vegetarian nutrition, and the Total Health Movement."]),
   P("Sections 13.5 & 13.6 — Administration & Effect","Standardizes non-substantive editorial corrections and establishes the effective date upon Union ratification.")
 ]}
];

{num:1, roman:"I", title:"Nombre, Historia y Sede",
 original:[
   P("Sección 1","El nombre de esta organización es: “SERVICIOS DE SALUD ADVENTISTA INTERAMERICANA (AHSIA)”. La sigla se pronuncia “ah-shiyá”."),
   P("Sección 2","AHSIA se formó bajo el liderazgo de la División Interamericana el 20 de mayo de 2010, con la participación de la Universidad de Montemorelos y todas las Uniones con instituciones de salud en su territorio — la Unión del Caribe, la Unión Mexicana Central, la Unión Dominicana, la Unión Haitiana, la Unión de Honduras, la Unión Jamaicana, la Unión Portorriqueña, la Unión Centroamericana del Sur, la Unión Mexicana del Sureste y la Unión de Venezuela Occidental. Cada Unión estuvo representada por sus administradores (Presidentes, Secretarios, Tesoreros)."),
   P("Sección 3","La oficina central de AHSIA tiene su sede en las oficinas centrales de la División Interamericana, en Miami, Florida.")
 ],
 updated:[
   P("Sección 1.1 — Nombre","El nombre de esta organización es Servicios de Salud Adventista Interamericana (AHSIA), que se pronuncia “ah-shiyá”. AHSIA comprende dos estructuras complementarias dentro de la División Interamericana (IAD):"),
   L(null,["La Red de Salud Adventista — la red coordinada de instituciones de salud adventistas que operan en el territorio de la División Interamericana.","La Oficina de AHSIA — responsable de la Alineación Misional; el modelado y desarrollo del sistema de Servicios de Salud Adventista en Interamérica; la acreditación de instituciones de salud adventistas; el monitoreo, evaluación y aseguramiento de la calidad; y la gobernanza, liderazgo, gestión y apoyo financiero."]),
   P("Sección 1.2 — Historia","AHSIA fue establecida bajo el liderazgo de la División Interamericana, con la participación de las Uniones que operan instituciones de salud y la Universidad de Montemorelos, el 20 de mayo de 2010."),
   P("Sección 1.3 — Sede","La sede de la Oficina de AHSIA está ubicada en las oficinas centrales de la División Interamericana, en Miami, Florida, Estados Unidos.")
 ]},
{num:2, roman:"II", title:"Miembros",
 original:[
   P(null,"Todas las instituciones de salud en el territorio de la División Interamericana que son operadas por una entidad de la iglesia son, por derecho, miembros de AHSIA. Esto incluye, sin limitarse a, hospitales, sanatorios, centros de salud, dispensarios, clínicas ambulatorias, clínicas dentales, centros de diagnóstico, clínicas móviles, servicios de salud comunitarios estructurados, centros de estilo de vida, hogares de ancianos y centros de influencia, cuando dicha entidad se dedique a servicios de salud.")
 ],
 updated:[
   P("Sección 2.1 — Instituciones Miembro (Red de Salud Adventista)","Las Instituciones Miembro son todas las instituciones de salud adventistas del séptimo día que operan en el territorio de la División Interamericana y que son propiedad de, u operadas por, una entidad de la Iglesia Adventista. Esto incluye, sin limitarse a: hospitales, clínicas ambulatorias, centros de salud, centros de estilo de vida, clínicas móviles, centros de diagnóstico, clínicas dentales, hogares de ancianos y servicios de salud comunitarios estructurados. Estas instituciones conforman en conjunto la Red de Salud Adventista, el cuerpo operativo de los servicios de salud adventistas en la División Interamericana.")
 ]},
{num:3, roman:"III", title:"Propósito",
 original:[
   P("Sección 1","El propósito principal de AHSIA es fortalecer los servicios de salud adventistas en el territorio de la IAD, fomentando una cultura de calidad, accesibilidad, sostenibilidad y seguridad, a la vez que promueve la colaboración y el intercambio fructífero entre las instituciones."),
   P("Sección 2","Las intervenciones de AHSIA buscan aumentar el impacto de nuestro sistema de salud en el bien común de la comunidad."),
   L("Sección 3 — Las principales aspiraciones de AHSIA son:",[
     "Lograr que todas las instituciones de salud adventistas del territorio de la IAD pasen de depender del apoyo externo a ser instituciones autosostenibles.",
     "Reconectar la prestación de los servicios de salud adventistas con la misión de la iglesia, que es evidenciar la compasión de Jesucristo por la humanidad que sufre.",
     "Conectar mejor los servicios e iniciativas de salud adventistas con la comunidad adventista.",
     "Construir alianzas entre los servicios de salud adventistas y la comunidad, así como con actores locales e internacionales."
   ])
 ],
 updated:[
   P("Sección 3.1 — Alineación Misional","El propósito principal de la Oficina de AHSIA es asegurar que todas las Instituciones Miembro de la Red de Salud Adventista permanezcan plenamente alineadas con los fundamentos teológicos, los valores y el ministerio de sanidad de la Iglesia Adventista del Séptimo Día. La Oficina de AHSIA es responsable de incorporar la Filosofía Adventista de Salud Integral (Wholística) — que integra el bienestar físico, mental, social y espiritual — en todos los aspectos de la operación clínica, administrativa y educativa."),
   P("Sección 3.2 — Modelado y Desarrollo del Sistema de Servicios de Salud Adventista en Interamérica","La Oficina de AHSIA establece y difunde los modelos estándar y la arquitectura estratégica del sistema de la red de salud adventista de la División Interamericana, para guiar a las Instituciones Miembro hacia un sistema de salud coherente, unificado y autosostenible."),
   P("Sección 3.3 — Acreditación de las Instituciones de Salud Adventistas","La Oficina de AHSIA supervisa y administra el Sistema de Acreditación progresivo de AHSIA para evaluar y reconocer el desempeño y el compromiso misional de las instituciones."),
   P("Sección 3.4 — Monitoreo, Evaluación y Aseguramiento de la Calidad","La Oficina de AHSIA es responsable de evaluar, monitorear y valorar continuamente la calidad de la atención y la seguridad del paciente en toda la Red de Salud Adventista, utilizando el marco de Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad (MSQ) para reunir datos operativos y revisar indicadores de desempeño."),
   P("Sección 3.5 — Gobernanza, Liderazgo, Operación y Apoyo Financiero","La Oficina de AHSIA brinda servicios de asesoría estratégica y desarrollo de capacidades para fortalecer la gobernanza, el liderazgo y la gestión de las Instituciones Miembro — respetando estrictamente su propiedad local, sus juntas locales y su autonomía legal — incluyendo coaching, mentoría, capacitación de juntas, desarrollo profesional, y la facilitación de apoyo operativo, financiero y movilización de recursos.")
 ]},
{num:4, roman:"IV", title:"Operaciones",
 original:[
   H("Del Artículo IV de 2022 — Objetivos (Secciones 1–15)"),
   P(null,"Los objetivos generales de AHSIA incluirán, sin limitarse a:"),
   L(null,[
     "Sección 1. Participar directamente en la gobernanza de las principales instituciones de salud como Miembro de Junta por defecto.",
     "Sección 2. Desarrollar, mantener, actualizar y hacer cumplir un modelo apropiado de políticas de salud (un Manual de Operación de las Instituciones de Salud Adventistas), en armonía con la filosofía, las creencias y la misión de la Iglesia Adventista, y conforme a las mejores prácticas actuales en la prestación de servicios de salud.",
     "Sección 3. Desarrollar un Manual de Junta, procedimientos, capacitación y un programa de orientación para promover los principios generales de gobernanza en salud.",
     "Sección 4. Desarrollar y mantener actualizado un modelo de Estatutos Médicos que cada junta institucional pueda adoptar y adaptar según sea necesario para regir a su personal médico y sus actividades.",
     "Sección 5. Brindar asesoría, cuando se solicite, sobre asuntos relativos a la apertura, cierre y expansión mayor de instituciones de salud.",
     "Sección 6. Fomentar y coordinar el intercambio administrativo, profesional y técnico entre las instituciones, y crear mecanismos adecuados para su cooperación.",
     "Sección 7. Fomentar, ayudar a establecer y coordinar, cuando sea posible y recomendable, sistemas de salud adventistas nacionales o de toda la Unión que sean efectivos.",
     "Sección 8. Establecer y coordinar la educación continua y la capacitación de líderes, gerentes, empleados, voluntarios y miembros de junta de las instituciones.",
     "Sección 9. Apoyar y coordinar todas las iniciativas de interés común, como la compra colectiva, la estandarización de equipos, el servicio y el mantenimiento.",
     "Sección 10. Fomentar y facilitar servicios de consultoría a las instituciones miembro para el desarrollo de planes maestros, estrategias de mercadeo, análisis de tendencias financieras y otras tareas especializadas.",
     "Sección 11. Desarrollar y operar un sistema de “Programa de Calidad de la Atención y Seguridad del Paciente”.",
     "Sección 12. Desarrollar y ejecutar un programa de acreditación pertinente para las instituciones de salud adventistas del territorio de la IAD.",
     "Sección 13. Investigar, negociar y coordinar el mejor programa posible de acreditación para todos los hospitales, y posibilitar un programa adecuado de evaluación/acreditación para los demás tipos de instituciones de salud.",
     "Sección 14. Diseñar, o buscar y promover, sistemas apropiados de reportes administrativos, médicos y financieros, que faciliten un mejor monitoreo gerencial, profesional y financiero, así como un crecimiento y desarrollo adecuados en todo el sistema.",
     "Sección 15. Brindar asesoría sobre asuntos especiales, tales como la cobertura de responsabilidad civil general y profesional, y los planes de jubilación de los empleados del sector de salud adventista, en consulta con los distintos cuerpos de gobierno."
   ]),
   H("Del Artículo V de 2022 — Operación (Junta, Consultores, Alianzas)"),
   P(null,"AHSIA era gobernada por la “Junta de AHSIA”, integrada de la siguiente manera:"),
   L(null,["El Presidente de la IAD o su designado","El Presidente de AHSIA","El Tesorero de AHSIA","Todos los demás administradores de la IAD","Todos los presidentes de las Uniones con instituciones de salud","El presidente de la Universidad de Montemorelos","El Director de Ministerios de Salud de la Asociación General o su designado","Los presidentes de junta de los demás hospitales o sistemas de salud nacionales/de toda la Unión (cuando corresponda)","Todos los administradores de hospitales o de sistemas de salud nacionales/de toda la Unión"]),
   P(null,"Las actividades generales eran conducidas por el Presidente, designado por la Junta de AHSIA."),
   L("Un grupo de Consultores Profesionales, que incluía, sin limitarse a, especialistas en:",["Asuntos financieros","Filantropía","Adquisiciones, logística y apoyo general","Asuntos de enfermería","Salud digital y tecnología de la información","Asuntos de laboratorio clínico","Asuntos de calidad","Gestión de instalaciones","Asuntos biomédicos","Mantenimiento","Imagenología","Gestión de riesgos","Gobernanza, evaluación y capacitación de juntas","Capacitación continua y desarrollo profesional"]),
   L("Alianzas internacionales que el Presidente procuraba desarrollar y fortalecer:",["Ministerios de Salud de la Asociación General","Adventist Health International (AHI)","El Global Healthcare Institute de la LLUH","La Global Health Footprint Initiative de AdventHealth","Adventist Health Services (AHS)","La Universidad de Montemorelos","ADRA Internacional","Universidades pertinentes de la IAD","Otras instituciones adventistas con interés en salud, como IADPA o la compañía de alimentos","Cualquier entidad adventista o no adventista pertinente"])
 ],
 updated:[
   P("Sección 4.1 — Estructura de Gobernanza","AHSIA opera mediante una estructura de gobernanza de tres niveles."),
   H("1. La Constituyente de AHSIA"),
   P(null,"El cuerpo representativo de la Red de AHSIA y la División Interamericana. Aprueba las políticas mayores, los estándares del sistema y la dirección estratégica. La Constituyente se reúne cada cinco (5) años, alineada con el ciclo quinquenal de la División Interamericana."),
   H("2. La Junta Directiva de AHSIA"),
   P(null,"El cuerpo de gobierno principal, responsable de la supervisión, el desarrollo del sistema, la alineación misional, la acreditación y la rendición de cuentas. La Junta Directiva se reúne dos (2) veces al año."),
   H("3. El Liderazgo Ejecutivo de AHSIA (Oficina de AHSIA)"),
   P(null,"El equipo de AHSIA responsable de implementar las políticas, coordinar el sistema, facilitar la interconexión y apoyar a las Instituciones Miembro."),
   P("Sección 4.2 — Composición de la Constituyente de AHSIA","La Constituyente de AHSIA es la Asamblea General de la IAD."),
   P("Sección 4.3 — Composición de la Junta Directiva de AHSIA","La Junta Directiva es establecida por la Junta de la IAD y estará compuesta por un número impar de miembros para garantizar decisiones claras. La Junta Directiva incluye:"),
   L(null,["El Presidente de la IAD o su designado (Presidente de la Junta)","El Presidente de AHSIA (Secretario)","El Tesorero de AHSIA","El Director de Ministerios de Salud de la IAD","Tres (3) representantes de Unión (rotativos)","Tres (3) directores ejecutivos de Instituciones Miembro (rotativos)","Dos (2) profesionales laicos (salud, finanzas, derecho)"]),
   P("Sección 4.4 — Liderazgo Ejecutivo (Oficina de AHSIA)","El Liderazgo Ejecutivo incluye:"),
   L(null,["El Presidente de AHSIA","Vicepresidentes (regionales o funcionales)","El Secretario","El Tesorero","Asesores Principales para áreas críticas o estratégicas, según se necesite"]),
   P("Sección 4.5 — Gobernanza, Liderazgo Ejecutivo y Gestión de las Instituciones Miembro","La Oficina de AHSIA podrá apoyar a la gobernanza o al equipo de liderazgo ejecutivo de las instituciones, según el caso, pero bajo ninguna circunstancia interferirá en la gestión diaria de las instituciones. Las Instituciones Miembro permanecen autónomas y son gobernadas por su respectiva junta, la cual establece sus propios equipos de liderazgo y gestión.")
 ]},
{num:5, roman:"V", title:"Funciones de los Oficiales",
 original:[
   H("Funciones del Presidente"),
   P(null,"El Presidente de AHSIA:"),
   L(null,[
     "Sección 1. Es miembro ex-oficio de todas las juntas hospitalarias, para mantenerse informado de todos los aspectos de su operación, y podría eventualmente presidir dichas juntas según se requiera.",
     "Sección 2. Coordina la red de instituciones de salud de AHSIA.",
     "Sección 3. Brinda liderazgo en la coordinación de la red de instituciones de salud de AHSIA.",
     "Sección 4. Desarrolla un plan operativo anual de la organización, para someterlo a la Junta de AHSIA en su reunión anual.",
     "Sección 5. Trabaja con el Tesorero de AHSIA en la preparación de un presupuesto operativo y de desarrollo anual, para someterlo a la aprobación de la junta en su reunión anual.",
     "Sección 6. Desarrolla y mantiene las alianzas profesionales y financieras necesarias para cumplir los objetivos de AHSIA y servir los intereses de sus instituciones miembro.",
     "Sección 7. Presenta informes regulares de dichas relaciones y sus beneficios a la junta, en su reunión anual o según se requiera.",
     "Sección 8. Se asegura de que el propósito y los objetivos de AHSIA sean siempre una prioridad en las operaciones de la institución.",
     "Sección 9. Brinda orientación y actualización periódica a los miembros de junta sobre las tendencias recientes en gobernanza y gestión de la salud."
   ]),
   H("Funciones del Tesorero — Parte I"),
   L(null,[
     "Sección 10. Administra los recursos financieros de la institución de acuerdo con el presupuesto operativo aprobado y las políticas y acciones de la Junta de AHSIA.",
     "Sección 11. Prepara el presupuesto operativo y de desarrollo anual de la institución.",
     "Sección 12. Brinda asesoría, información y análisis financiero."
   ]),
   H("Parte II — Instituciones (Hospitales y Clínicas)"),
   L(null,[
     "Sección 13. Se asegura de que cada institución prepare y presente sus Estados Financieros mensuales a más tardar el día 15 del mes siguiente.",
     "Sección 14. Se asegura de que la auditoría anual de cada institución, junto con la respuesta de la gerencia a los auditores, quede archivada.",
     "Sección 15. Prepara análisis financieros y ofrece recomendaciones.",
     "Sección 16. Aplica las políticas financieras de la Asociación General y la División Interamericana, en armonía con el Manual de Contabilidad."
   ])
 ],
 updated:[
   P("Sección 5.1 — Presidente de AHSIA","El Presidente de AHSIA se desempeña como Director Ejecutivo (CEO) de la Oficina de AHSIA y es responsable del liderazgo estratégico, la coordinación y el desarrollo de la Red de AHSIA. El Presidente deberá:"),
   L(null,["Brindar liderazgo a nivel de todo el sistema, en alineación con la misión, los valores y las prioridades estratégicas de la IAD.","Dirigir la implementación de los Modelos Adventistas de Servicios de Salud (como el MAPS y el MASH) en toda la Red de AHSIA.","Supervisar el Sistema de Acreditación de AHSIA, incluidos sus cuatro niveles progresivos (Estrella, Plata, Oro, Platino).","Asegurar el reporte MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad) y la alineación de todo el sistema, revisando indicadores clínicos, de gobernanza, financieros y de impacto comunitario.","Desarrollar el plan operativo y de desarrollo anual de la Oficina de AHSIA para su revisión y aprobación por la Junta Directiva.","Preparar el presupuesto anual de la Oficina de AHSIA en estrecha colaboración con el Tesorero.","Fortalecer la colaboración entre las Instituciones Miembro y facilitar servicios compartidos y el fortalecimiento del sistema.","Desarrollar alianzas estratégicas con Socios Institucionales y Socios Técnicos, sin conferirles autoridad de gobernanza o de decisión sobre la Red u Oficina de AHSIA.","Representar a AHSIA ante la División Interamericana y ante socios externos.","Asegurar el estricto cumplimiento de todas las operaciones con esta Constitución, sus estatutos y las políticas aprobadas por la Junta Directiva."]),
   P("Sección 5.2 — Vicepresidentes","Los Vicepresidentes apoyan al Presidente en funciones de liderazgo regional o funcional. Deberán:"),
   L(null,["Brindar supervisión y coordinación a las regiones geográficas o dominios funcionales que se les asignen dentro de la Red de AHSIA.","Apoyar a las Instituciones Miembro en la implementación de los estándares de acreditación, el reporte MSQ y la alineación misional.","Asistir en el desarrollo de liderazgo, la mentoría profesional y las iniciativas de capacitación.","Facilitar la comunicación, el intercambio entre pares y la colaboración entre las Instituciones Miembro."]),
   P("Sección 5.3 — Secretario","El Secretario de la Oficina de AHSIA deberá:"),
   L(null,["Mantener los registros oficiales, las actas y la documentación legal de la Oficina de AHSIA, de las reuniones de la Junta Directiva y de las sesiones de la Constituyente.","Apoyar la comunicación entre la Junta Directiva, la Constituyente y las Instituciones Miembro.","Asegurar el archivo adecuado de todos los registros de acreditación, informes de evaluación MSQ y documentos de política, conforme a las pautas de retención de la IAD."]),
   P("Sección 5.4 — Tesorero","El Tesorero de la Oficina de AHSIA deberá:"),
   L(null,["Administrar los recursos financieros de la Oficina de AHSIA de acuerdo con el presupuesto aprobado y las acciones de la Junta Directiva.","Preparar el presupuesto operativo y de desarrollo anual de la Oficina de AHSIA en colaboración con el Presidente.","Brindar reportes financieros regulares a la Junta Directiva y a su Comité de Finanzas.","Asegurar que las operaciones financieras de la Oficina de AHSIA cumplan con las políticas financieras de la Asociación General (AG) y la IAD."]),
   N("Limitación: el Tesorero no supervisa directamente las finanzas institucionales y no interviene en la gobernanza financiera local ni en las decisiones de las juntas locales."),
   P("Sección 5.5 — Asesores Principales","Los Asesores Principales son expertos técnicos de alto nivel contratados o designados por la Oficina de AHSIA para brindar orientación especializada en los ámbitos clínico, operativo y espiritual. Deberán:"),
   L(null,["Brindar orientación experta en áreas que incluyen, entre otras: Calidad Clínica y Seguridad del Paciente, Asuntos de Enfermería, Sostenibilidad Financiera, Salud Digital y Tecnología de la Información, Adquisiciones y Cadena de Suministro, Misión y Cuidado Espiritual, Salud Pública y Capacitación en Gobernanza.","Liderar y apoyar iniciativas técnicas, programas de capacitación y desarrollo de capacidades a nivel de todo el sistema, en sus respectivos ámbitos.","Apoyar la implementación del marco MSQ y brindar asistencia técnica a las Instituciones Miembro conforme avanzan por los Niveles de Acreditación de AHSIA (Estrella, Plata, Oro, Platino).","Colaborar con el liderazgo de la Oficina de AHSIA, los Vicepresidentes regionales y las instituciones locales para compartir mejores prácticas e innovaciones técnicas."]),
   N("Limitación: los Asesores Principales sirven estrictamente en capacidades técnicas, de asesoría o educativas. No poseen autoridad de gobernanza, no participan en la toma de decisiones ni en las votaciones de la Junta Directiva, y no tienen autoridad de supervisión directa sobre la Oficina de AHSIA ni sobre ninguna Institución Miembro.")
 ]},
{num:6, roman:"VI", title:"Quórum",
 original:[
   P(null,"El quórum para las reuniones formales de junta será de cinco miembros, incluyendo al presidente o su designado.")
 ],
 updated:[
   N("(Revisado, corregido y mejorado)"),
   P("Sección 6.1 — Quórum de la Constituyente","El quórum para una reunión debidamente convocada de la Constituyente de AHSIA consistirá en una mayoría simple de todos los delegados acreditados de la Constituyente. La Constituyente se reúne cada cinco (5) años, salvo que la Administración de la División Interamericana convoque una sesión especial."),
   P("Sección 6.2 — Quórum de la Junta Directiva","El quórum para una reunión debidamente convocada de la Junta Directiva de AHSIA consistirá en siete (7) miembros, incluyendo al Presidente de la Junta o su designado. La Junta Directiva se reúne dos (2) veces al año, con reuniones adicionales convocadas según sea necesario.")
 ]},
{num:7, roman:"VII", title:"Finanzas",
 original:[
   P(null,"AHSIA operará con un presupuesto anual, con fondos provistos de la siguiente manera:"),
   L(null,["Una asignación anual de la Administración de la División Interamericana.","Las instituciones miembro y/o sus respectivas organizaciones propietarias contribuirán con un monto anual que se establecerá según una posición votada por la Junta de AHSIA.","Donaciones y programas de filantropía."])
 ],
 updated:[
   P("Sección 7.1 — Estructura Financiera de la Oficina de AHSIA","La Oficina de AHSIA operará bajo un presupuesto anual que sostiene sus funciones administrativas, estratégicas y misionales. La estructura financiera incluye:"),
   L(null,["Presupuesto administrativo, que cubre los salarios y gastos relacionados del Presidente de AHSIA y de los asistentes profesionales designados.","Presupuesto de desarrollo de programas, dedicado a las prioridades de todo el sistema, incluyendo: apoyo a hospitales e instituciones de salud; proyectos y capacitación prioritarios en colaboración con la Unidad Misionera Médica (MMU); consultores, apoyo técnico y tecnología; monitoreo y evaluación de la calidad; y servicios de asesoría y reuniones de equipo."]),
   P(null,"El presupuesto anual de la Oficina de AHSIA será revisado y aprobado por la Junta Directiva de AHSIA."),
   P("Sección 7.2 — Fuentes de Financiamiento de la Oficina de AHSIA","Además de la asignación de la IAD, el financiamiento de la Oficina de AHSIA provendrá de las siguientes fuentes:"),
   L(null,["Asignación del presupuesto anual de la IAD.","Contribuciones anuales de las Instituciones Miembro, determinadas por la Junta Directiva y escaladas según el tamaño, la capacidad o el nivel de acreditación institucional.","Donaciones, subvenciones y apoyo filantrópico, que impulsen la misión, la capacitación y el desarrollo del sistema.","Cuotas de acreditación, capacitación y servicios, recaudadas por visitas de acreditación, programas de liderazgo, actividades relacionadas con el MAPS e iniciativas de capacitación de todo el sistema."]),
   P("Sección 7.2 (bis) — Fuentes de Financiamiento de las Instituciones Miembro","El financiamiento de las Instituciones Miembro podrá provenir de las siguientes fuentes:"),
   L(null,["Ventas generadoras de ingresos de productos, programas y servicios relacionados con la salud.","Cuotas de suscripción a programas de salud y bienestar.","Filantropía, donaciones y regalos.","Asignaciones, apoyo e inversiones de capital de las entidades patrocinadoras de la Iglesia Adventista.","Inversiones sociales de terceros.","Préstamos bancarios, y fondos rotativos o de pensión de la Iglesia."]),
   P("Sección 7.3 — Fondo de Solidaridad y Fortalecimiento del Sistema","La Oficina de AHSIA mantendrá un Fondo de Solidaridad y Fortalecimiento del Sistema para apoyar:"),
   L(null,["Instituciones con necesidades financieras mayores.","Instituciones en regiones vulnerables o desatendidas.","Instituciones que avanzan por los niveles de acreditación.","Iniciativas de misión y salud comunitaria alineadas con el modelo MAPS."]),
   P(null,"Este fondo incluirá un mecanismo de capital rotativo, con la participación de las Uniones, las Instituciones Miembro, la División Interamericana, organizaciones filantrópicas y posibles inversionistas de impacto. Las asignaciones de este fondo serán aprobadas por la Junta Directiva de AHSIA."),
   P("Sección 7.4 — Rendición de Cuentas Financiera de la Oficina de AHSIA","La Oficina de AHSIA deberá:"),
   L(null,["Mantener registros financieros transparentes y auditables.","Brindar reportes financieros anuales a la Junta Directiva de AHSIA.","Asegurar el cumplimiento de las políticas financieras de la IAD y la Asociación General.","Someterse a revisiones o auditorías financieras periódicas según lo requiera la IAD."]),
   P("Sección 7.5 — Reporte Financiero Institucional","Las Instituciones Miembro deberán:"),
   L(null,["Participar en el reporte financiero MSQ y en la evaluación comparativa de todo el sistema.","Mantener el cumplimiento de las políticas financieras y normas contables adventistas.","Cooperar con el análisis financiero y las evaluaciones comparativas de todo el sistema."]),
   N("Limitación: la Oficina de AHSIA no intervendrá en la gobernanza financiera interna de las Instituciones Miembro."),
   P("Sección 7.6 — Uso de los Fondos","Los fondos administrados por la Oficina de AHSIA se usarán exclusivamente para:"),
   L(null,["El desarrollo y fortalecimiento del sistema.","El avance de la misión y las iniciativas de salud comunitaria.","La acreditación y la mejora de la calidad.","El desarrollo de liderazgo y la capacitación.","Las iniciativas del Movimiento de Salud Total.","Las operaciones administrativas de la Oficina de AHSIA."]),
   N("Ningún fondo se usará para apoyar la participación en la gobernanza de Socios Técnicos o Asesores Principales.")
 ]},
{num:8, roman:"VIII", title:"Socios Técnicos",
 original:[
   H("Como Artículo IX de 2022 — Socios Operativos"),
   P(null,"AHSIA busca y mantiene relaciones cercanas con actores pertinentes relacionados con la salud que operan bajo la Asociación General. En particular, la relación con AHI (Adventist Health International) se definirá mediante un memorando de entendimiento (MOU) entre ambas organizaciones, para asistir en la gestión de las organizaciones de salud de la IAD.")
 ],
 updated:[
   P("Sección 8.1 — Naturaleza de las Alianzas Operativas","AHSIA podrá colaborar con organizaciones externas — adventistas o no adventistas — que provean experiencia técnica, capacitación, investigación, apoyo misional o recursos para el desarrollo del sistema. Estas organizaciones son reconocidas como Socios Técnicos."),
   P("Sección 8.2 — Propósito de las Alianzas","Las alianzas operativas existen para apoyar:"),
   L(null,["La implementación de los Modelos Adventistas de Salud.","El avance de la calidad y la seguridad del paciente.","El desarrollo de liderazgo y la capacitación.","La salud digital y los sistemas de datos.","La acreditación y la alineación con MAPS/MASH.","Las iniciativas de salud comunitaria y misión.","El apoyo técnico especializado según se requiera.","El apoyo financiero.","Donaciones de materiales y equipos."]),
   P("Sección 8.3 — Memorandos de Entendimiento (MOU)","La Oficina de AHSIA podrá suscribir memorandos de entendimiento con Socios Técnicos para definir el alcance de la colaboración. Los MOU deberán:"),
   L(null,["Apoyar el desarrollo del sistema.","Respetar la propiedad institucional.","Preservar la autonomía de gobernanza de AHSIA.","Evitar cualquier transferencia de autoridad o control administrativo."])
 ]},
{num:9, roman:"IX", title:"Responsabilidad e Indemnización",
 original:[
   H("Como Artículo X de 2022"),
   P(null,"Esta organización y sus socios no son responsables de ninguna responsabilidad de ninguna naturaleza que surja de las operaciones de cualquiera de las entidades de salud que la componen, según deberá indicarse en sus respectivos estatutos.")
 ],
 updated:[
   P("Sección 9.1 — Responsabilidad Institucional","Cada Institución Miembro es la única responsable de sus propias operaciones, pasivos, deudas, obligaciones y exposiciones legales. La Oficina de AHSIA, la División Interamericana y las demás Instituciones Miembro no serán responsables de reclamos derivados de las acciones, omisiones u operaciones de una institución individual."),
   P("Sección 9.2 — Responsabilidad de la Oficina de AHSIA","La Oficina de AHSIA será responsable únicamente de las obligaciones que se deriven directamente de sus propias acciones, decisiones y operaciones autorizadas por la Junta Directiva. Las Instituciones Miembro no serán responsables de las acciones u obligaciones de la Oficina de AHSIA."),
   P("Sección 9.3 — Socios Técnicos y Asesores Principales","Los Socios Técnicos y los Asesores Principales sirven estrictamente en capacidades de asesoría o técnicas. No poseen autoridad de gobernanza, no asumen responsabilidad operativa y no incurren en responsabilidad por las acciones de la Oficina de AHSIA o de las Instituciones Miembro; de igual manera, la Oficina de AHSIA y las Instituciones Miembro no asumen responsabilidad por las acciones u omisiones de los Socios Técnicos o los Asesores Principales."),
   P("Sección 9.4 — Requisito de Estatutos Institucionales","Cada Institución Miembro incluirá en sus propios estatutos una declaración que aclare que es la única responsable de sus propios pasivos, que no asume responsabilidad por la Oficina de AHSIA ni por otras Instituciones Miembro, y que su participación en AHSIA no crea responsabilidad compartida ni conjunta."),
   P("Sección 9.5 — Requisito de Seguro de Responsabilidad Profesional","Todas las Instituciones Miembro de la Red de AHSIA deben participar en el Programa de Seguro Grupal de Responsabilidad Profesional establecido por la División Interamericana a través de Adventist Risk Management (ARM). Las instituciones que no participen en dicho programa grupal deberán presentar evidencia documentada de un plan de seguro de responsabilidad profesional, contratado local o internacionalmente, que sea comparable o superior en cobertura, límites y protecciones al programa grupal de ARM. La Oficina de AHSIA se reserva el derecho de revisar dicha evidencia y determinar si la cobertura alternativa cumple con los estándares del sistema.")
 ]},
{num:10, roman:"X", title:"Disolución",
 original:[
   H("Como Artículo XI de 2022"),
   P(null,"En caso de disolución de AHSIA, y una vez satisfechas todas sus obligaciones, el Comité Ejecutivo de la IAD distribuirá discrecionalmente los activos restantes entre las instituciones participantes.")
 ],
 updated:[
   P("Sección 10.1 — Autoridad para Disolver","AHSIA solo podrá disolverse mediante un voto de la Constituyente de AHSIA, convocada en sesión regular o especial, y ratificado por el Comité Ejecutivo de la División Interamericana."),
   P("Sección 10.2 — Disolución de la Oficina de AHSIA","En caso de disolución de la Oficina de AHSIA, todas las obligaciones, deudas y responsabilidades legales pendientes deberán satisfacerse plenamente antes de distribuir cualquier activo remanente."),
   P("Sección 10.3 — Distribución de los Activos","Una vez satisfechas todas las obligaciones, los activos remanentes de la Oficina de AHSIA serán distribuidos por el Comité Ejecutivo de la IAD de la siguiente manera:"),
   L(null,["Primero, para apoyar la continuidad de la misión, la capacitación y el desarrollo del sistema de salud adventista dentro de la División Interamericana.","Segundo, para fortalecer a las Instituciones Miembro de la Red de AHSIA, dando prioridad a las instituciones en regiones vulnerables o desatendidas.","Tercero, a entidades adventistas de salud o educativas dentro de la División Interamericana cuya misión esté alineada con el Movimiento de Salud Total."]),
   N("Ningún activo se transferirá a ningún Socio Técnico, Asesor Principal u organización externa."),
   P("Sección 10.4 — Continuidad de las Instituciones Miembro","La disolución de la Oficina de AHSIA no disuelve ni altera el estatus legal, la propiedad o la gobernanza de ninguna Institución Miembro dentro de la Red de AHSIA. Cada institución continuará operando bajo su respectiva entidad de la Iglesia Adventista."),
   P("Sección 10.5 — Disolución de las Instituciones Miembro","La disolución de cualquier Institución Miembro dentro de la Red de AHSIA solo podrá ser decidida por la entidad de la Iglesia Adventista que la posee. Ni la Oficina de AHSIA ni la Junta Directiva de AHSIA tienen autoridad para disolver una Institución Miembro."),
   P("Sección 10.6 — Registros y Archivos","Al momento de la disolución, todos los registros oficiales, documentos de acreditación, informes MSQ y archivos históricos de la Oficina de AHSIA se transferirán a la División Interamericana para su preservación."),
   P("Sección 10.7 — Cumplimiento Legal","El proceso de disolución cumplirá con todas las leyes, regulaciones y políticas aplicables de la División Interamericana y de la Asociación General de los Adventistas del Séptimo Día.")
 ]},
{num:11, roman:"XI", title:"Conflicto de Intereses",
 original:[ N(NEW_ARTICLE_NOTE_ES) ],
 updated:[
   P("Sección 11.1 — Propósito","El propósito de este artículo es asegurar que todas las decisiones y acciones tomadas dentro de AHSIA se realicen en el mejor interés de la Red de AHSIA, libres de influencia indebida, beneficio personal o lealtades en competencia."),
   P("Sección 11.2 — Aplicabilidad","Esta política se aplica a:"),
   L(null,["Los miembros de la Junta Directiva de AHSIA.","Los delegados de la Constituyente de AHSIA.","Los oficiales de la Oficina de AHSIA.","Los directores y vicepresidentes de la Oficina de AHSIA.","Los Asesores Principales, cuando actúen en capacidad de asesoría.","Cualquier persona que participe en comités, equipos de acreditación o procesos de toma de decisiones de AHSIA."]),
   P("Sección 11.3 — Definición de Conflicto de Intereses","Existe un conflicto de intereses cuando los intereses personales, financieros, profesionales o relacionales de una persona pudieran razonablemente percibirse como una influencia, un compromiso o un sesgo sobre su juicio o sus acciones en nombre de AHSIA. Los conflictos pueden incluir:"),
   L(null,["Intereses financieros en un proveedor, contratista u organización socia.","Relaciones de empleo o consultoría con Instituciones Miembro o Socios Técnicos.","Relaciones familiares o personales cercanas con personas afectadas por decisiones de AHSIA.","Roles duales que generan lealtades divididas.","Regalos, favores o beneficios que pudieran influir en la toma de decisiones.","Participación en decisiones en las que la persona pudiera beneficiarse personal o profesionalmente."]),
   P("Sección 11.4 — Deber de Divulgación","Todas las personas comprendidas en este artículo deberán:"),
   L(null,["Divulgar por escrito al Presidente de AHSIA o al Presidente de la Junta cualquier conflicto de intereses real, potencial o percibido.","Actualizar las divulgaciones anualmente y siempre que cambien las circunstancias.","Abstenerse de participar en discusiones o votaciones relacionadas con el conflicto divulgado."]),
   P("Sección 11.5 — Requisitos de Recusación","Toda persona con un conflicto de intereses deberá:"),
   L(null,["Abstenerse de votar.","Retirarse de la reunión durante las deliberaciones.","No intentar influir en la decisión.","No recibir información confidencial relacionada con el asunto."]),
   P(null,"La Junta Directiva documentará todas las recusaciones en las actas oficiales."),
   P("Sección 11.6 — Conducta Prohibida","Se prohíben estrictamente las siguientes acciones:"),
   L(null,["Usar la posición propia para beneficio personal o financiero.","Aceptar regalos, pagos o beneficios destinados a influir en decisiones.","Participar en decisiones de adquisición que involucren a una parte relacionada.","Servir simultáneamente en roles que comprometan la independencia o la objetividad.","Usar información confidencial para ventaja personal."]),
   P("Sección 11.7 — Revisión y Determinación","La Junta Directiva revisará todas las divulgaciones y determinará si existe un conflicto. La Junta podrá:"),
   L(null,["Exigir la recusación.","Solicitar información adicional.","Imponer medidas correctivas.","Remover a una persona de su rol, si fuera necesario."]),
   P("Sección 11.8 — Violaciones","La falta de divulgación de un conflicto de intereses, o la violación de esta política, podrá resultar en:"),
   L(null,["Remoción de la Junta Directiva.","Remoción de la Oficina de AHSIA.","Terminación de roles de asesoría.","Descalificación de los equipos de acreditación.","Otras medidas disciplinarias que determine la Junta Directiva."]),
   P("Sección 11.9 — Transparencia","La Oficina de AHSIA mantendrá un registro confidencial de todas las divulgaciones de conflicto de intereses y asegurará que la Junta Directiva reciba informes anuales de cumplimiento.")
 ]},
{num:12, roman:"XII", title:"Anexos",
 original:[ N(NEW_ARTICLE_NOTE_ES) ],
 updated:[
   P("Sección 12.1 — Propósito y Autoridad de los Anexos","Para asegurar la gobernanza estandarizada, la armonía operativa y la integridad misional en toda la Red de Salud Adventista, las políticas, cartas y pautas operativas específicas que rigen a las Instituciones Miembro se establecen en los Anexos adjuntos a esta Constitución."),
   P("Sección 12.2 — Carácter Vinculante","Las disposiciones contenidas en estos Anexos serán legalmente vinculantes para todas las Instituciones Miembro de AHSIA. Cada Institución Miembro alineará sus estatutos locales, políticas operativas y estructuras de junta con los estándares definidos en estos Anexos."),
   P("Sección 12.3 — Enmienda y Revisión de los Anexos","A diferencia de los artículos principales de esta Constitución, que requieren ratificación de la Constituyente y del Comité Ejecutivo de la IAD, los Anexos podrán ser revisados, enmendados o actualizados por mayoría simple de la Junta Directiva de AHSIA durante cualquiera de sus sesiones regulares, en consulta con la División Interamericana. Esto permite que las pautas operativas permanezcan flexibles y responsivas ante un entorno de salud cambiante, mientras se preserva la estabilidad de la Constitución central."),
   N("El texto completo de los Anexos I–IX (composición de la Junta Directiva, Comité Ejecutivo, Comité de Finanzas y Auditoría, Comité de Calidad y Seguridad del Paciente, Comité de Enfoque Misional, la Carta de Derechos del Paciente/Empleado/Usuario, el Código de Ética, la Carta de Gobernanza de Datos, y el Sistema de Acreditación de AHSIA) está disponible en el documento completo de la constitución enlazado desde la página de Introducción.")
 ]},
{num:13, roman:"XIII", title:"Normas de Enmienda de Estatutos para las Instituciones Miembro",
 original:[ N(NEW_ARTICLE_NOTE_ES) ],
 updated:[
   P("Sección 13.1 — Propósito y Autoridad","Las entidades patrocinadoras de la iglesia (Uniones o Campos locales) conservan la autoridad última. Ninguna enmienda local es válida sin la ratificación de la Unión y la revisión de asesoría de la Oficina de AHSIA."),
   P("Sección 13.2 — Proponentes","Las propuestas se limitan a los oficiales de la Unión, el Presidente de la Junta, el director ejecutivo local, o una petición escrita de un tercio de la junta local."),
   P("Sección 13.3 — Cronograma Obligatorio","Establece un cronograma disciplinado de 90 días para la presentación, 60 días de aviso previo, un voto de dos tercios de la junta y la ratificación final por escrito del Comité Ejecutivo de la Unión."),
   P("Sección 13.4 — Restricciones Fundamentales","Prohíbe cualquier enmienda que:"),
   L(null,["Modifique la propiedad eclesiástica de los bienes físicos.","Transfiera la gobernanza a terceros.","Otorgue derechos de voto a Socios Técnicos o Asesores Principales.","Entre en conflicto con la Política de Trabajo de la IAD/AG.","Diluya la identidad adventista del séptimo día, incluyendo la guarda del sábado, la nutrición vegetariana y el Movimiento de Salud Total."]),
   P("Secciones 13.5 y 13.6 — Administración y Vigencia","Estandariza las correcciones editoriales no sustantivas y establece la fecha de vigencia a partir de la ratificación de la Unión.")
 ]}
];

var ARTICLES_FR = [
{num:1, roman:"I", title:"Nom, Historique et Siège",
 original:[
   P("Section 1","Le nom de cette organisation est : « ADVENTIST HEALTHCARE SERVICES INTER-AMERICA (AHSIA) ». Le sigle se prononce « ah-chiya »."),
   P("Section 2","L’AHSIA a été formée sous la direction de la Division Interaméricaine le 20 mai 2010, avec la participation de l’Université de Montemorelos et de toutes les Unions possédant des institutions de santé sur leur territoire — l’Union des Caraïbes, l’Union du Mexique Central, l’Union Dominicaine, l’Union Haïtienne, l’Union du Honduras, l’Union Jamaïcaine, l’Union de Porto Rico, l’Union d’Amérique Centrale Sud, l’Union du Sud-Est du Mexique et l’Union du Venezuela Occidental. Chaque Union était représentée par ses administrateurs (Présidents, Secrétaires, Trésoriers)."),
   P("Section 3","Le siège de l’AHSIA se trouve au siège de la Division Interaméricaine, à Miami, en Floride.")
 ],
 updated:[
   P("Section 1.1 — Nom","Le nom de cette organisation est Services de Santé Adventiste Interaméricains (AHSIA), qui se prononce « ah-chiya ». L’AHSIA regroupe deux structures complémentaires au sein de la Division Interaméricaine (IAD) :"),
   L(null,["Le Réseau de Santé Adventiste — le réseau coordonné des institutions de santé adventistes opérant sur le territoire de la Division Interaméricaine.","Le Bureau de l’AHSIA — responsable de l’Alignement Missionnaire ; de la modélisation et du développement du système des Services de Santé Adventiste en Interamérique ; de l’accréditation des institutions de santé adventistes ; du suivi, de l’évaluation et de l’assurance qualité ; ainsi que de la gouvernance, du leadership, de la gestion et de l’appui financier."]),
   P("Section 1.2 — Historique","L’AHSIA a été établie sous la direction de la Division Interaméricaine, avec la participation des Unions gérant des institutions de santé et de l’Université de Montemorelos, le 20 mai 2010."),
   P("Section 1.3 — Siège","Le siège du Bureau de l’AHSIA est situé au siège de la Division Interaméricaine, à Miami, en Floride, aux États-Unis.")
 ]},
{num:2, roman:"II", title:"Membres",
 original:[
   P(null,"Toutes les institutions de santé du territoire de la Division Interaméricaine exploitées par une entité de l’Église sont, de plein droit, membres de l’AHSIA. Cela comprend, sans s’y limiter, les hôpitaux, sanatoriums, centres de santé, dispensaires, cliniques ambulatoires, cliniques dentaires, centres de diagnostic, cliniques mobiles, services de santé communautaires structurés, centres de style de vie, maisons de retraite et centres d’influence, lorsque cette entité exerce des activités de santé.")
 ],
 updated:[
   P("Section 2.1 — Institutions Membres (Réseau de Santé Adventiste)","Les Institutions Membres sont toutes les institutions de santé adventistes du septième jour opérant sur le territoire de la Division Interaméricaine et détenues ou exploitées par une entité de l’Église adventiste. Cela comprend, sans s’y limiter : hôpitaux, cliniques ambulatoires, centres de santé, centres de style de vie, cliniques mobiles, centres de diagnostic, cliniques dentaires, maisons de retraite, et services de santé communautaires structurés. Ces institutions forment collectivement le Réseau de Santé Adventiste, l’organe opérationnel des services de santé adventistes dans la Division Interaméricaine.")
 ]},
{num:3, roman:"III", title:"Objet",
 original:[
   P("Section 1","L’objet principal de l’AHSIA est de renforcer les services de santé adventistes sur le territoire de l’IAD, en favorisant une culture de qualité, d’accessibilité, de durabilité et de sécurité, tout en promouvant la collaboration et des échanges fructueux entre les institutions."),
   P("Section 2","Les interventions de l’AHSIA visent à accroître l’impact de notre système de santé sur le bien commun de la communauté."),
   L("Section 3 — Les principales ambitions de l’AHSIA sont :",[
     "Faire en sorte que toutes les institutions de santé adventistes du territoire de l’IAD passent d’un soutien externe à l’autosuffisance.",
     "Reconnecter la prestation des services de santé adventistes à la mission de l’Église, qui est de témoigner de la compassion de Jésus-Christ envers l’humanité souffrante.",
     "Mieux relier les services et initiatives de santé adventistes à la communauté adventiste.",
     "Construire des partenariats entre les services de santé adventistes et la communauté, ainsi qu’avec des acteurs locaux et internationaux."
   ])
 ],
 updated:[
   P("Section 3.1 — Alignement Missionnaire","L’objet principal du Bureau de l’AHSIA est de veiller à ce que toutes les Institutions Membres du Réseau de Santé Adventiste demeurent pleinement alignées sur les fondements théologiques, les valeurs et le ministère de guérison de l’Église Adventiste du Septième Jour. Le Bureau de l’AHSIA est chargé d’intégrer la Philosophie Adventiste de la Santé Globale (Holistique) — intégrant le bien-être physique, mental, social et spirituel — dans tous les aspects des opérations cliniques, administratives et éducatives."),
   P("Section 3.2 — Modélisation et Développement du Système en Interamérique","Le Bureau de l’AHSIA établit et diffuse les modèles standard et l’architecture stratégique du système du réseau de santé adventiste de la Division Interaméricaine, afin de guider les Institutions Membres vers un système de santé cohérent, unifié et autosuffisant."),
   P("Section 3.3 — Accréditation des Institutions de Santé Adventistes","Le Bureau de l’AHSIA supervise et administre le Système d’Accréditation progressif de l’AHSIA afin d’évaluer et de reconnaître la performance et l’engagement missionnaire des institutions."),
