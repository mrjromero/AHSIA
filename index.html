function jsonpRequest(params, onDone){
  if(!backendConfigured()){ onDone({ok:false, code:"backend_not_configured"}); return; }
  var callbackName = "__ahsia_jsonp_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
  var script = document.createElement("script");
  var finished = false;
  var timer;
  function cleanup(){
    if(finished) return;
    finished = true;
    clearTimeout(timer);
    try{ delete window[callbackName]; }catch(e){ window[callbackName]=undefined; }
    if(script.parentNode) script.parentNode.removeChild(script);
  }
  window[callbackName] = function(data){ cleanup(); onDone(data || {ok:false, code:"empty_response"}); };
  params = Object.assign({}, params, {callback:callbackName, _:Date.now()});
  var query = Object.keys(params).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(params[k]==null?"":params[k]); }).join("&");
  script.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?")>=0?"&":"?") + query;
  script.async = true;
  script.onerror = function(){ cleanup(); onDone({ok:false, code:"backend_unreachable"}); };
  timer = setTimeout(function(){ cleanup(); onDone({ok:false, code:"backend_timeout"}); }, 10000);
  document.head.appendChild(script);
}

function mergeRecordIntoState(articleNum, record){
  var list = STATE.responses[articleNum] || (STATE.responses[articleNum] = []);
  var idx = -1;
  for(var i=0;i<list.length;i++){ if(list[i].id===record.id){ idx=i; break; } }
  if(idx>=0) list[idx]=record; else list.push(record);
}

function loadRemoteState(onDone){
  if(!backendConfigured() || !REMOTE_RESULTS_ENABLED){ if(onDone) onDone({ok:false, code:"disabled"}); return; }
  jsonpRequest({action:"list"}, function(res){
    if(res && res.ok && res.responses){
      STATE.responses = res.responses;
      remoteLoadFailed = false;
      if(onDone) onDone(res);
    } else {
      remoteLoadFailed = true;
      if(onDone) onDone(res || {ok:false, code:"load_failed"});
    }
  });
}

function verifySavedResponse(articleNum, id, token, attempts, onDone){
  attempts = attempts || 0;
  jsonpRequest({action:"verify", responseId:id, verifyToken:token}, function(res){
    if(res && res.ok && res.exists){
      if(res.record) mergeRecordIntoState(articleNum, res.record);
      onDone({ok:true, record:res.record||null});
      return;
    }
    if(attempts < 3){
      setTimeout(function(){ verifySavedResponse(articleNum,id,token,attempts+1,onDone); }, 650*(attempts+1));
    } else {
      onDone({ok:false, code:(res && res.code) || "not_verified"});
    }
  });
}

function submitResponse(articleNum, payload, onDone){
  if(!backendConfigured()){
    readOnly = true;
    onDone({ok:false, code:"backend_not_configured"});
    return;
  }

  var existing = myResponseInfo(articleNum);
  var recordId = existing && existing.id ? existing.id : uid();
  var verifyToken = existing && existing.token ? existing.token : randomToken();
  var article = articleByNum(articleNum);
  var params = new URLSearchParams();
  params.set("action","submit");
  params.set("responseId",recordId);
  params.set("verifyToken",verifyToken);
  params.set("articleNumber",String(articleNum));
  params.set("articleRoman",article ? article.roman : "");
  params.set("articleTitle",article ? article.title : "");
  params.set("name",payload.name||"");
  params.set("institution",payload.org||"");
  params.set("role",payload.role||"");
  params.set("vote",payload.vote||"");
  params.set("comment",payload.comment||"");
  params.set("language",LANG);
  params.set("pageUrl",location.href.split("#")[0]);
  params.set("website",payload.website||""); // honeypot

  stashPending(articleNum, payload);

  fetch(APPS_SCRIPT_URL, {
    method:"POST",
    mode:"no-cors",
    credentials:"omit",
    body:params
  }).then(function(){
    verifySavedResponse(articleNum, recordId, verifyToken, 0, function(verified){
      if(!verified.ok){ onDone(verified); return; }
      clearPending();
      setMyResponseInfo(articleNum, recordId, verifyToken);
      onDone({ok:true});
      // Refresh shared tallies/comments after the confirmed save without delaying the success UI.
      loadRemoteState(function(res){
        if(res && res.ok && !document.querySelector("#f-name:focus,#f-org:focus,#f-role:focus,#f-comment:focus")) render();
      });
    });
  }).catch(function(){
    onDone({ok:false, code:"network_error"});
  });
}

  html += "<div class=\"col new\"><div class=\"col-tab\">"+esc(STR.updated2026)+"</div><div class=\"col-body\">"+renderBlocks(a.updated)+"</div></div>";
  html += "</div>";

  html += "<div class=\"compare-grid\">"+voteFormHTML(num)+"</div>";
  html += tallyHTML(num);

  html += "<h3 style=\"margin-top:34px;\">"+esc(STR.responsesOnArticle)+"</h3>";
  html += "<div id=\"comment-feed-wrap\">"+commentFeedHTML(num)+"</div>";

  html += "<div class=\"article-foot-nav\">";
  html += prev ? ("<a href=\"#/article/"+prev.num+"\"><span class=\"fn-label\">"+esc(STR.navPrev)+"</span>"+articleNavLabel(prev)+"</a>") : ("<a href=\"#/intro\"><span class=\"fn-label\">"+esc(STR.navBack)+"</span>"+esc(STR.introductionWord)+"</a>");
  html += next ? ("<a class=\"next\" href=\"#/article/"+next.num+"\"><span class=\"fn-label\">"+esc(STR.navNext)+"</span>"+articleNavLabel(next)+"</a>") : ("<a class=\"next\" href=\"#/results\"><span class=\"fn-label\">"+esc(STR.navFinished)+"</span>"+esc(STR.ctaResults)+"</a>");
  html += "</div>";
  return html;
}
function articleNavLabel(a){
  return "Article "+esc(a.roman)+" — "+esc(a.title);
}

function viewResults(){
  var totalResponses = 0;
  var cards = ARTICLES.map(function(a){
    var t = tallyOf(a.num);
    totalResponses += t.total;
    var total = t.total;
    function pct(n){ return total? (n/total*100):0; }
    var bar = "<div class=\"tally-bar\">"+
      "<span style=\"width:"+pct(t.accept)+"%; background:var(--new);\"></span>"+
      "<span style=\"width:"+pct(t.table)+"%; background:var(--accent);\"></span>"+
      "<span style=\"width:"+pct(t.reject)+"%; background:var(--old);\"></span>"+
    "</div>";
    return "<a class=\"rcard\" href=\"#/article/"+a.num+"\">"+
      "<div class=\"rc-top\"><span class=\"rc-num mono\">Art. "+esc(a.roman)+"</span><span class=\"rc-count mono\">"+total+" "+esc(STR.respWord)+"</span></div>"+
      "<div class=\"rc-title\">"+esc(a.title)+"</div>"+bar+
      "<div class=\"tally-legend\" style=\"margin-top:8px;\"><span>"+esc(STR.tallyAccept.slice(0,1))+" "+t.accept+"</span><span>"+esc(STR.tallyTable.slice(0,1))+" "+t.table+"</span><span>"+esc(STR.tallyReject.slice(0,1))+" "+t.reject+"</span></div>"+
    "</a>";
  }).join("");

  var allComments = [];
  ARTICLES.forEach(function(a){
    (STATE.responses[a.num]||[]).forEach(function(r){ allComments.push({a:a, r:r}); });
  });
  allComments.sort(function(x,y){ return y.r.ts-x.r.ts; });
  var feed = allComments.length ? allComments.map(function(item){
    var r=item.r, a=item.a;
    return "<div class=\"comment-item\">"+
      "<div class=\"ci-head\"><span class=\"ci-name\">"+esc(r.name||STR.anonymous)+"</span><span class=\"ci-org\">"+esc(r.org||"")+"</span><span class=\"ci-vote "+esc(r.vote)+"\">"+esc(voteLabel(r.vote))+"</span></div>"+
      "<div style=\"font-size:12px;color:var(--ink-400);margin-bottom:4px;\">"+articleNavLabel(a)+"</div>"+
      (r.comment ? "<p class=\"ci-text\">"+nl2br(r.comment)+"</p>" : "<p class=\"ci-text empty-feed\">"+esc(STR.noWrittenComment)+"</p>")+
      "<div class=\"ci-time\">"+fmtDate(r.ts)+"</div>"+
    "</div>";
  }).join("") : "<p class=\"empty-feed\">"+esc(STR.noCommentsGlobal)+"</p>";

  return ""+
  "<div class=\"eyebrow\">"+esc(STR.resultsEyebrow)+"</div>"+
  "<h1>"+esc(STR.resultsH1)+"</h1>"+
  "<p class=\"lede\">"+esc(STR.resultsLede(totalResponses))+"</p>"+
  "<div class=\"cta-row\"><button class=\"btn btn-outline\" id=\"export-csv-btn\" type=\"button\">"+esc(STR.exportBtn)+"</button><a class=\"btn btn-outline\" href=\"#/annexes\">"+esc(STR.navAnnexes)+" →</a></div>"+
  "<div id=\"export-msg\" class=\"form-msg\"></div>"+
  "<div class=\"results-grid\">"+cards+"</div>"+
  "<div class=\"section-title\"><h2 style=\"margin:0;\">"+esc(STR.allComments)+"</h2></div>"+
  "<div class=\"allfeed\">"+feed+"</div>";
}

function viewAnnexes(){
  var cards = ANNEXES.map(function(a){
    return "<details class=\"annex-card\"><summary><span class=\"ac-id mono\">"+esc(a.id)+"</span><span class=\"ac-title\">"+esc(a.title)+"</span><svg class=\"chev\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 6l6 6-6 6\"/></svg></summary><div class=\"col-body\">"+renderBlocks(a.blocks)+"</div></details>";
  }).join("");

  var appendixCard = "<details class=\"annex-card\"><summary><span class=\"ac-id mono\">"+esc(STR.appendixLabel)+"</span><span class=\"ac-title\">"+esc(APPENDIX.title)+"</span><svg class=\"chev\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 6l6 6-6 6\"/></svg></summary><div class=\"col-body\">"+renderBlocks(APPENDIX.blocks)+"</div></details>";

  return ""+
  "<div class=\"eyebrow\">"+esc(STR.annexesEyebrow)+"</div>"+
  "<h1>"+esc(STR.annexesH1)+"</h1>"+
  "<p class=\"lede\">"+esc(STR.annexesLede)+"</p>"+
  "<div class=\"cta-row\"><a class=\"btn btn-outline\" href=\"#/article/12\">"+esc(STR.annexesToArticleXII)+"</a></div>"+
  (LANG!=="en" ? "<div class=\"banner info\" style=\"margin-top:22px;\"><span>ℹ️</span><div>"+esc(STR.translationNote)+"</div></div>" : "")+
  "<div class=\"annex-list\">"+cards+appendixCard+"</div>"+
  "<footer class=\"pagefoot\">"+esc(STR.footerLine)+"</footer>";
}

/* ============ shell / nav ============ */
function langSwitcherHTML(){
  var codes = ["en","es","fr"];
  var btns = codes.map(function(c){
    var active = (c===LANG) ? " active" : "";
    return "<button class=\"langbtn"+active+"\" data-lang=\""+c+"\" type=\"button\" title=\""+esc(LANG_NAMES[c])+"\">"+c.toUpperCase()+"</button>";
  }).join("");
  return "<div class=\"lang-switcher\"><span class=\"lang-label\">"+esc(STR.langLabel)+"</span><div class=\"lang-btns\">"+btns+"</div></div>";
}

function sidebarHTML(route){
  var items = ARTICLES.map(function(a){
    var t = tallyOf(a.num);
    var active = (route.view==="article" && route.num===a.num) ? " active" : "";
    return "<a class=\"navitem"+active+"\" href=\"#/article/"+a.num+"\"><span class=\"num mono\">"+esc(a.roman)+"</span><span class=\"label\">"+esc(a.title)+"</span>"+(t.total?("<span class=\"count\">"+t.total+"</span>"):"")+"</a>";
  }).join("");
  var introActive = route.view==="intro" ? " active" : "";
  var resultsActive = route.view==="results" ? " active" : "";
  var annexesActive = route.view==="annexes" ? " active" : "";
  return ""+
  "<div class=\"brand\"><div class=\"brand-mark\">A</div><div class=\"brand-text\"><div class=\"t1\">AHSIA</div><div class=\"t2\">"+esc(STR.brandLine2)+"</div></div></div>"+
  langSwitcherHTML()+
  "<nav class=\"articlenav\">"+
    "<a class=\"navitem"+introActive+"\" href=\"#/intro\"><span class=\"num mono\">•</span><span class=\"label\">"+esc(STR.navIntro)+"</span></a>"+
  "</nav>"+
  "<div class=\"navgroup-label\">"+esc(STR.navArticlesGroup)+"</div>"+
  "<nav class=\"articlenav\">"+items+"</nav>"+
  "<div class=\"navgroup-label\">"+esc(STR.navOverviewGroup)+"</div>"+
  "<nav class=\"articlenav\">"+
    "<a class=\"navitem"+resultsActive+"\" href=\"#/results\"><span class=\"num mono\">≡</span><span class=\"label\">"+esc(STR.navResults)+"</span></a>"+
    "<a class=\"navitem"+annexesActive+"\" href=\"#/annexes\"><span class=\"num mono\">§</span><span class=\"label\">"+esc(STR.navAnnexes)+"</span></a>"+
  "</nav>";
}

function render(){
  var route = currentRoute();
  var app = document.getElementById("app");
  var body;
  if(route.view==="intro") body = viewIntro();
  else if(route.view==="results") body = viewResults();
  else if(route.view==="annexes") body = viewAnnexes();
  else body = viewArticle(route.num);

  app.innerHTML =
    "<div class=\"topbar\"><button class=\"hamburger\" id=\"burger\" aria-label=\"Open article list\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M3 12h18M3 18h18\"/></svg></button><div class=\"brand\" style=\"margin:0;\"><div class=\"brand-mark\" style=\"width:26px;height:26px;font-size:12px;\">A</div><div class=\"brand-text\"><div class=\"t2\" style=\"font-size:14px;\">"+esc(STR.brandShort)+"</div></div></div><div class=\"lang-btns\" id=\"topbar-lang\">"+["en","es","fr"].map(function(c){return "<button class=\"langbtn"+(c===LANG?" active":"")+"\" data-lang=\""+c+"\" type=\"button\">"+c.toUpperCase()+"</button>";}).join("")+"</div></div>"+
    "<div class=\"shell\">"+
      "<aside class=\"sidebar\" id=\"sidebar\">"+sidebarHTML(route)+"</aside>"+
      "<main class=\"view\">"+
        (readOnly ? "<div class=\"banner warn\"><span>🔒</span><div><b>"+esc(STR.readOnlyTitle)+"</b> "+esc(STR.readOnlyBody)+"</div></div>" : "")+
        body+
      "</main>"+
    "</div>"+
    "<div class=\"toast-stack\" id=\"toast-stack\"></div>";

  wireEvents(route);
  window.scrollTo(0,0);
}

function toast(msg){
  var stack = document.getElementById("toast-stack");
  if(!stack) return;
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(function(){ el.remove(); }, 4200);
}

function wireEvents(route){
  var burger = document.getElementById("burger");
  if(burger){
    burger.addEventListener("click", function(){
      document.getElementById("sidebar").classList.toggle("open");
    });
  }
  var sidebar = document.getElementById("sidebar");
  if(sidebar){
    sidebar.addEventListener("click", function(e){
      if(e.target.closest("a") && window.innerWidth<=920){ sidebar.classList.remove("open"); }
    });
  }
  document.querySelectorAll(".langbtn").forEach(function(btn){
    btn.addEventListener("click", function(){ setLang(btn.getAttribute("data-lang")); });
  });

  if(route.view==="article"){
    var num = route.num;
    var selectedVote = null;
    var pillsWrap = document.getElementById("vote-pills");
    if(pillsWrap){
      var existing = pillsWrap.querySelectorAll(".pill");
      existing.forEach(function(p){
        if(p.classList.contains("sel-accept")||p.classList.contains("sel-table")||p.classList.contains("sel-reject")){
          selectedVote = p.getAttribute("data-vote");
        }
        function choose(){
          selectedVote = p.getAttribute("data-vote");
          existing.forEach(function(q){ q.classList.remove("sel-accept","sel-table","sel-reject"); q.setAttribute("aria-checked","false"); });
          p.classList.add("sel-"+selectedVote);
          p.setAttribute("aria-checked","true");
        }
        p.addEventListener("click", choose);
        p.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); choose(); } });
      });
    }

    var submitBtn = document.getElementById("submit-btn");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var name = document.getElementById("f-name").value.trim();
        var org = document.getElementById("f-org").value.trim();
        var role = document.getElementById("f-role").value.trim();
        var comment = document.getElementById("f-comment").value.trim();
        var msg = document.getElementById("form-msg");
        if(!name || !org){ msg.className="form-msg err"; msg.textContent=STR.fmErrNameOrg; return; }
        if(!selectedVote){ msg.className="form-msg err"; msg.textContent=STR.fmErrVote; return; }
        saveProfile({name:name, org:org, role:role});
        submitBtn.disabled = true;
        msg.className = "form-msg"; msg.textContent = STR.fmSaving;
        var website = document.getElementById("f-website") ? document.getElementById("f-website").value.trim() : "";
        submitResponse(num, {name:name, org:org, role:role, vote:selectedVote, comment:comment, website:website}, function(res){
          submitBtn.disabled = false;
          if(res.ok){
            toast(STR.toastSaved(articleByNum(num).roman));
            render();
          } else if(res.code==="conflict"){
            msg.className="form-msg err";
            msg.textContent=STR.fmConflict;
          } else if(res.code==="backend_not_configured"){
            readOnly = true;
            msg.className="form-msg err";
            msg.textContent=STR.fmReadOnly;
            render();
          } else if(res.code==="rate_limited"){
            msg.className="form-msg err";
            msg.textContent=STR.fmRateLimited;
          } else {
            msg.className="form-msg err";
            msg.textContent=STR.fmGenericErr(res.code);
          }
        });
      });
    }
  }

  if(route.view==="results"){
    var exportBtn = document.getElementById("export-csv-btn");
    if(exportBtn){
      exportBtn.addEventListener("click", function(){
        var msg = document.getElementById("export-msg");
        var rows = [["Article","Article Title","Name","Institution","Role","Vote","Comment","Submitted At (ISO)"]];
        ARTICLES.forEach(function(a){
          (STATE.responses[a.num]||[]).forEach(function(r){
            rows.push([a.roman, a.title, r.name||"", r.org||"", r.role||"", r.vote||"", (r.comment||"").replace(/\r?\n/g," "), new Date(r.ts).toISOString()]);
          });
        });
        function csvEsc(v){ v=String(v==null?"":v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
        var csv = rows.map(function(r){ return r.map(csvEsc).join(","); }).join("\r\n");
        try{
          var blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "ahsia-constitution-feedback.csv";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
          msg.className="form-msg ok"; msg.textContent=STR.exportSaved;
        }catch(err){
          msg.className="form-msg err"; msg.textContent=STR.exportFailed;
        }
      });
    }
  }
}

/* ============ init ============ */
function init(){
  var pending = readPending();
  if(pending && Date.now()-pending.ts < 1000*60*30){
    setTimeout(function(){
      toast(STR.pendingToast(articleByNum(pending.articleNum)? articleByNum(pending.articleNum).roman : pending.articleNum));
    }, 600);
  }
  window.addEventListener("hashchange", render);
  render();

  if(backendConfigured() && REMOTE_RESULTS_ENABLED){
    loadRemoteState(function(res){
      if(res && res.ok && !document.querySelector("#f-name:focus,#f-org:focus,#f-role:focus,#f-comment:focus")) render();
    });
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
</body>
</html>
