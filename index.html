     "Professional Development: Have access to ongoing training, continuing education, and skill-development programs to maintain professional competence and clinical growth.",
     "Spiritual Support: Receive spiritual care, pastoral support, and professional counseling to prevent burnout and foster a supportive, mission-focused workplace culture.",
     "Due Process: Be entitled to clear, transparent, and fair administrative procedures regarding employment terms, performance evaluations, grievances, and disciplinary actions, in harmony with Union and institutional human resource policies."
   ]),
   H("Section 5 — Employee Responsibilities"),
   P(null,"Employees of AHSIA Member Institutions are responsible for:"),
   L(null,[
     "Mission Support and Integration: Actively supporting, modeling, and integrating the Seventh-day Adventist philosophy of wholistic health and Christian values in all professional tasks.",
     "Professional Excellence: Delivering competent, evidence-based, safe, and high-quality care or administrative support within the scope of their credentials and licensure.",
     "Confidentiality and Data Security: Strictly maintaining the confidentiality and privacy of all patient, financial, and organizational data, and preventing unauthorized disclosure of any sensitive records.",
     "Ethical Integrity: Adhering to the AHSIA Code of Ethics, including avoiding conflicts of interest, practicing transparent communication, and treating patients and colleagues with unconditional Christian respect.",
     "Duty to Report Concerns: Promptly reporting any ethical violations, clinical risks, clinical errors, patient safety hazards, or suspected misconduct through the proper institutional channels, in a spirit of constructive improvement and accountability."
   ]),
   H("Section 6 — User, Visitor, and Family Rights and Responsibilities"),
   L("6.1 Rights of Visitors and Users:",[
     "To be treated with respect, kindness, and courtesy by all institutional staff.",
     "To visit hospitalized loved ones in accordance with institutional guidelines, clinical safety, and patient preference.",
     "To receive clear information regarding visitation rules, infection control protocols, and safety guidelines.",
     "To have access to spiritual spaces, prayer rooms, and chaplaincy support if desired."
   ]),
   L("6.2 Responsibilities of Visitors and Users:",[
     "To respect the privacy, dignity, and quiet healing needs of all patients and staff.",
     "To strictly comply with institutional policies, including hand hygiene, infection control, designated visiting hours, and safety instructions.",
     "To help maintain a quiet, peaceful, and smoke-free, alcohol-free, and drug-free healing environment.",
     "To refrain from any disruptive, aggressive, or unsafe behavior, which may result in immediate removal from the premises."
   ]),
   H("Section 7 — Obligations of the Member Institution"),
   P(null,"To embed this Charter into the institutional culture, the Governing Board and Administration of each Member Institution shall:"),
   L(null,[
     "Charter Display: Visibly display a copy of this Rights and Responsibilities Charter (in English and local languages) in patient waiting areas, admission offices, lobbies, and on the institutional website.",
     "Staff Training: Conduct regular orientation and training programs for all employees, medical staff, and volunteers on the principles and application of patient and employee rights.",
     "Grievance Resolution System: Maintain a functional, accessible, and confidential system for receiving, investigating, and resolving patient and employee grievances, ensuring that complaints are documented, tracked, and reported to the Board's Quality and Patient Safety Committee.",
     "MSQ Benchmarking: Integrate patient satisfaction rates, employee turnover metrics, spiritual care audits, and grievance resolution times as key indicators under the MSQ framework.",
     "Ethical Compliance: Ensure that clinical procedures, research initiatives, and administrative practices strictly align with Seventh-day Adventist ethical standards and the Statement of Operating Principles (FH 20)."
   ]),
   H("Section 8 — System Stewardship by AHSIA-Office"),
   P(null,"AHSIA-Office shall act as the system steward for this Charter by:"),
   L(null,[
     "Developing, maintaining, and updating the standardized templates and educational resources for this Charter.",
     "Monitoring compliance with these rights and responsibilities during regular AHSIA Accreditation visits.",
     "Analyzing system-wide grievance and satisfaction data to identify areas for quality improvement, advisory support, and targeted training."
   ])
 ]},
{id:"VII", title:"Code of Ethics for AHSIA Member Institutions",
 blocks:[
   L(null,[
     "Section 1 — Preamble and Theological Foundations: Deeply connects the clinical mission to the healing ministry of Jesus Christ and the wholistic restoration (physical, mental, social, and spiritual) championed by the Total Health Movement.",
     "Section 2 — Scope and Binding Nature: Explicitly details the binding obligations for every level of the institution, including local Board Members, Executive Administrators (CEOs, CFOs, CMOs, CNOs), physicians, nurses, support staff, volunteers, and third-party contractors.",
     "Section 3 — Core Ethical Values and Principles: Comprehensively defines the seven core principles (Christian Integrity, Clinical Excellence, Human Dignity, Confidentiality, Faithful Stewardship, Mission Integration, and Equity).",
     "Section 4 — Ethical Leadership and Governance: Imposes strict guidelines to eliminate nepotism, guarantee conflict-free vendor selection (referencing Article XI), and define professional boundaries with sponsoring Unions.",
     "Section 5 — Financial Stewardship and Anti-Corruption: Explicitly prohibits bribes, kickbacks, and inappropriate vendor gifts, while mandating strict adherence to General Conference (GC) and Inter-American Division (IAD) financial policies and transparent procurement protocols.",
     "Section 6 — Clinical Ethics and Bioethical Standards: Sets clear ethical boundaries for patient care, emphasizing informed consent, patient privacy, and strict compliance with Seventh-day Adventist bioethical positions (including prohibition of active euthanasia, assisted suicide, and abortion restrictions as defined by the GC).",
     "Section 7 — Denominational Operating Principles: Spells out the operational protocols for preserving the sacredness of the Sabbath (limiting clinical actions to emergency care only), promoting vegetarian/clean food guidelines in patient and staff culinary services, and enforcing an absolute prohibition of alcohol, tobacco, and recreational drugs on all premises.",
     "Section 8 — Reporting Violations and Whistleblower Protection: Establishes a clear, multi-tiered reporting structure (Ethics Officer → CEO → Board Chair → AHSIA-Office) with a strict zero-tolerance policy for retaliation against good-faith whistleblowers.",
     "Section 9 — Enforcement, Sanctions, and Annual Commitment: Outlines administrative and credentialing consequences for violations and mandates that all personnel undergo annual training and sign the Annual Ethical Commitment Statement (the text of which is fully drafted in the appendix)."
   ])
 ]},
{id:"VIII", title:"Data Governance and Confidentiality Charter for AHSIA Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Theological Foundation"),
   P(null,"Data is a vital organizational and stewardship asset. In alignment with the Seventh-day Adventist commitment to integrity, respect for personal dignity, and ethical management of resources, this Charter establishes the standard principles, operational requirements, and confidentiality obligations for the secure, ethical, and mission-aligned management of all clinical, administrative, financial, operational, and mission-related information across the AHSIA Network."),
   H("Section 2 — Applicability"),
   P(null,"This Charter shall apply to all AHSIA Member Institutions, including their:"),
   L(null,["Local Governing Board members.","Executive officers, administrators, and directors (CEOs, CFOs, CMOs, CNOs).","Clinical, professional, logistical, and administrative employees.","Contractors, consultants, and third-party vendors.","Volunteers and students.","Any individual or entity acting on behalf of a Member Institution with authorized access to its data systems or sensitive records."]),
   H("Section 3 — Core Principles of Data Governance"),
   P(null,"All data within the AHSIA Network must be managed in accordance with the following five core principles:"),
   L(null,[
     "Confidentiality: Protection of sensitive or personal information from unauthorized access, exposure, or disclosure.",
     "Integrity: Ensuring that data remains accurate, complete, reliable, and protected against unauthorized modification or tampering.",
     "Availability: Guaranteeing that authorized personnel have timely and secure access to the information required to deliver clinical care or execute administrative functions.",
     "Ethical Use: Restricting the collection, processing, and sharing of data strictly to purposes that align with the Seventh-day Adventist healing ministry, patient well-being, and organizational efficiency.",
     "Compliance: Total adherence to applicable local and national data privacy laws, healthcare regulations, and the policies of the Inter-American Division and the General Conference."
   ]),
   H("Section 4 — Patient Information and Privacy (Clinical Data)"),
   P(null,"To protect the sacred trust between patients and Seventh-day Adventist healthcare providers, every Member Institution shall:"),
   L(null,[
     "Secure Electronic Records: Implement and maintain secure Electronic Health Records (EHR) and clinical database systems with role-based access control, ensuring that only authorized clinical and administrative staff have access to patient records.",
     "Prevent Disclosure: Establish strict physical and digital safeguards to prevent the unauthorized disclosure of clinical, psychiatric, or personal patient details.",
     "Consent and Authorization: Use patient clinical data exclusively for direct medical care, authorized clinical quality reviews, and system-wide benchmarking. Any secondary use of patient data (such as clinical research or public health reporting) must have the explicit, written consent of the patient or their legal guardian, in strict compliance with national regulations."
   ]),
   H("Section 5 — Institutional Data, Reporting, and Benchmarking"),
   L(null,[
     "Reporting Obligations: Member Institutions shall submit monthly financial statements, MSQ (Mission Alignment, Systems Performance & Quality Assurance) evaluations, and clinical performance data to the AHSIA-Office.",
     "Data Security during Transmission: Member Institutions must ensure that all data transmitted to AHSIA-Office or shared within the network is sent through secure, encrypted, and authorized channels.",
     "AHSIA-Office Reciprocity: AHSIA-Office is obligated to maintain the confidentiality of all received institutional-level data, utilizing it solely for system-wide benchmarking, trend analysis, quality reviews, and accreditation assessments. Individual institutional data shall not be published externally without the written consent of the Sponsoring Union."
   ]),
   H("Section 6 — Digital Health, Cybersecurity, and Information Systems"),
   P(null,"Member Institutions must actively protect their operational systems and infrastructure by:"),
   L(null,[
     "Implementing Safeguards: Establishing robust cybersecurity measures, including firewall protections, regular system backups, up-to-date antivirus software, secure network protocols, and multi-factor authentication (MFA) for critical systems.",
     "System Auditing: Conducting periodic security audits and vulnerability assessments of all local servers, workstations, and clinical databases.",
     "Interoperability Standards: Adhering to the standard digital health and technical interoperability guidelines promoted by AHSIA-Office to facilitate secure and seamless communication across the network.",
     "Cybersecurity Training: Providing mandatory cybersecurity awareness training for all employees to mitigate risks associated with phishing, malware, and social engineering."
   ]),
   H("Section 7 — Confidentiality Obligations"),
   L(null,[
     "Access Restriction: Authorized access to sensitive data does not confer ownership or the right to distribute such information. All individuals with access to confidential files (including clinical records, personnel files, audits, and strategic budgets) must keep this information strictly confidential.",
     "Non-Disclosure Agreements (NDAs): All board members, executive administrators, clinical staff, and external contractors must sign a formal, written Non-Disclosure Agreement (NDA) or Confidentiality Statement upon appointment or employment.",
     "Return of Materials: Upon the termination of an individual's role, employment, or contract, they must immediately return or securely destroy all physical and digital copies of confidential institutional materials in their possession. Access to all electronic portals, EHRs, and database systems shall be revoked immediately."
   ]),
   H("Section 8 — Breach of Confidentiality and Security Incidents"),
   L(null,[
     "Immediate Reporting: Any suspected, potential, or confirmed breach of data confidentiality, cybersecurity incident, or unauthorized data disclosure must be reported immediately (within 24 hours of discovery) to the institution's CEO, local Data Protection Officer (or IT Director), and AHSIA-Office.",
     "Mitigation and Investigation: The Member Institution shall immediately activate its incident response protocol to contain the breach, investigate its root cause, and mitigate any potential harm to patients, employees, or the organization.",
     "Consequences and Liability: Any individual who willfully violates this Charter, breaches confidentiality, or misuses institutional data shall be subject to immediate disciplinary actions, up to and including termination of employment, removal from governance boards, disqualification from AHSIA accreditation teams, and potential civil or criminal legal prosecution under local laws."
   ]),
   H("Section 9 — Data Ownership Boundaries"),
   P(null,"To safeguard local assets and system integrity:"),
   L(null,[
     "Institutional Autonomy: Member Institutions retain exclusive ownership of their raw institutional-level clinical, financial, and operational data.",
     "System-Level Ownership: AHSIA-Office retains ownership of all system-level analyses, aggregated data, MSQ reports, accreditation scores, comparative evaluations, and historical archives.",
     "External Partners Restriction: Technical Partners, Senior Advisers, and external consultants hold no ownership rights over any data generated, analyzed, or shared within the AHSIA Network. They are strictly prohibited from storing, exporting, or utilizing network data for independent commercial or professional purposes without the express, written consent of AHSIA-Office and the Sponsoring Union."
   ]),
   H("Section 10 — Data Retention and Archiving"),
   L(null,[
     "Standardized Archiving: Member Institutions shall maintain secure, organized, and legally compliant archives of all clinical medical records, financial statements, board minutes, and regulatory filings.",
     "Retention Timelines: Data retention policies must comply with national legal statutes, as well as the standard retention guidelines established by the Inter-American Division and the General Conference of Seventh-day Adventists."
   ])
 ]},
{id:"IX", title:"The AHSIA Accreditation System and MSQ Framework for Member Institutions",
 blocks:[
   H("Section 1 — Purpose and Core Objective"),
   L(null,[
     "1.1 Purpose: In order to achieve clinical excellence, strategic sustainability, and deep missional alignment across the Inter-American Division, all Member Institutions are integrated into a unified, system-wide evaluation process known as the AHSIA Accreditation System.",
     "1.2 The Core Objective: This system transition is designed to shift local healthcare facilities from operating as independent, loosely coordinated clinics into a professional, high-performing, and mission-driven network unified under the MSQ (Mission Alignment, Systems Performance & Quality Assurance) scorecard."
   ]),
   H("Section 2 — The MSQ Scorecard Dimensions"),
   P(null,"The AHSIA Accreditation is built upon three foundational, interdependent dimensions. Every Member Institution must continuously measure, document, and submit performance indicators across these dimensions:"),
   L(null,[
     "Mission Alignment (M): Measures the institution's active integration of the Seventh-day Adventist healing ministry, the Total Health Movement, and the spiritual care standards outlined in Annex V. Key metrics include staff spiritual development, patient spiritual care integration, adherence to lifestyle medicine (vegetarian/clean nutrition), and Sabbath-keeping operations.",
     "Systems Performance (S): Evaluates the operational efficiency, administrative professionalism, and financial sustainability of the institution. Key metrics include compliance with the financial reporting deadlines outlined in Annex III (monthly reports submitted by the 15th), cybersecurity readiness (under Annex VIII), administrative leadership evaluations, and billing accuracy.",
     "Quality Assurance (Q): Monitors clinical quality, patient safety, and institutional compliance with international healthcare standards. Key metrics include patient satisfaction rates, clinical readmission rates, infection control benchmarks, sentinel event reporting, and professional licensing/credentialing standards outlined in Annex IV."
   ]),
   H("Section 3 — The Four Progressive Accreditation Standards"),
   P(null,"The accreditation process is structured into four progressive, tiered standards. Member Institutions must systematically climb these levels to demonstrate growth, maturity, and excellence:"),
   TB(["Accreditation Tier","Focus and Operational Criteria"],[
     ["Level 1: Star Standard","Focuses on basic operational compliance, sanitary licensing, core safety protocols, and introductory mission alignment."],
     ["Level 2: Silver Standard","Marks the establishment of formalized management systems, stable financial internal controls, and active local board committees."],
     ["Level 3: Gold Standard","Represents clinical excellence, advanced digital health integration, robust risk management, and active community health programs."],
     ["Level 4: Platinum Standard","The highest level of network leadership, representing world-class clinical quality, full financial independence, and complete model integration."]
   ]),
   H("Section 4 — The Accreditation Cycle and Process"),
   P(null,"All Member Institutions must participate in the formal accreditation cycle managed by AHSIA-Office, which consists of the following phases:"),
   L(null,[
     "4.1 Annual Self-Assessment: Every Member Institution shall conduct an annual internal audit using the standardized MSQ self-assessment tool. The results, approved by the local Governing Board, must be submitted to AHSIA-Office.",
     "4.2 Quadrennial Site Survey: AHSIA-Office shall commission and deploy an external Accreditation Survey Team to perform an intensive, on-site evaluation of the Member Institution once every four (4) years.",
     "4.3 Accreditation Decision: Based on the site survey report, the AHSIA Governing Board shall issue, renew, or adjust the institution's formal accreditation tier.",
     "4.4 Ongoing Data Monitoring: On-site accreditation is contingent upon the institution maintaining its monthly MSQ reporting (clinical, financial, and spiritual) to AHSIA-Office."
   ]),
   H("Section 5 — Consequence of Non-Compliance and Support Mechanisms"),
   L(null,[
     "5.1 Support for Struggling Institutions: If an institution falls below its target accreditation status or struggles to meet core safety benchmarks, AHSIA-Office shall deploy targeted technical advisory support and consulting.",
     "5.2 Solidarity Fund Prioritization: Vulnerable institutions actively working to improve their accreditation status shall receive priority access to the Solidarity and System Strengthening Fund for infrastructure, quality equipment, or digital upgrades.",
     "5.3 Progressive Sanctions: Persistent failure to participate in self-assessments, host surveys, or remedy critical safety/mission deficiencies shall result in progressive administrative sanctions by the AHSIA Governing Board, including formal warning and mandatory corrective action plan, withholding of technical or financial resources from the Solidarity Fund, and temporary suspension of AHSIA Membership status and voting rights."
   ]),
   H("Section 6 — International Alignment"),
   P(null,"The AHSIA Accreditation System operates in harmony with the global standards of the International Adventist Health Care Council (IAHC) under General Conference Working Policy (FH 35), ensuring that local Inter-American healthcare excellence is recognized and respected worldwide.")
 ]}
];

var APPENDIX_EN = {
 title:"Appendix — Definitions and Interpretation for the AHSIA Constitution and Bylaws",
 blocks:[
   H("Section 1 — Purpose and Scope"),
   P(null,"This Appendix provides the official, standardized definitions and core interpretive principles governing the entire AHSIA Constitution, its Bylaws, and its accompanying Institutional Annexes. To prevent administrative friction, legal disputes, and theological deviations, all entities within the Adventist Healthcare Network — including AHSIA-Office, Sponsoring Unions, local Governing Boards, and executive leadership teams — shall interpret and apply the provisions of this Constitution in strict accordance with the terms and rules established herein."),
   H("Section 2 — Definitions"),
   P(null,"For the purposes of this Constitution and its Bylaws, the following terms are defined as follows:"),
   DL([
     {term:"AHSIA", def:"Adventist Healthcare Services Inter-America (pronounced “ah-shiyah”), established on May 20, 2010. It refers to the dual-structure organization operating within the Inter-American Division (IAD) consisting of the AHSIA-Office (coordinating body) and the Adventist Healthcare Network (operational network)."},
     {term:"AHSIA-Office", def:"The central administrative, strategic, and coordinating office of AHSIA, headquartered at the Inter-American Division office in Miami, Florida, United States. It functions under the direct authority of the IAD and is responsible for system modeling, accreditation reviews, MAPS oversight, advisory support, and network-wide alignment."},
     {term:"Adventist Healthcare Network (AHSIA Network)", def:"The coordinated network of all Seventh-day Adventist healthcare institutions operating within the geographic territory of the Inter-American Division. This includes hospitals, outpatient clinics, sanitariums, health and lifestyle centers, mobile clinics, diagnostic centers, nursing homes, and other healthcare-focused initiatives owned or operated by denominational organizations."},
     {term:"Member Institution", def:"Any healthcare facility or health-related service operated by a Seventh-day Adventist Church entity (Union, Conference, Mission, or Division) within the territory of the Inter-American Division that is formally recognized as a member of the AHSIA Network and participates in the AHSIA Accreditation System."},
     {term:"Constituency (AHSIA Constituency)", def:"The representative body of the AHSIA Network and the Inter-American Division, which meets in session every five (5) years to approve major system standards, review performance reports, elect officers, and vote on constitutional amendments."},
     {term:"Governing Board (AHSIA Governing Board)", def:"The primary decision-making and oversight body of AHSIA. Composed of thirteen (13) members, it is responsible for system governance, approving operational budgets, monitoring accreditation results, and ensuring compliance with General Conference policies."},
     {term:"Technical Partner", def:"An external organization — either Adventist or non-Adventist — that collaborates with AHSIA-Office or individual Member Institutions to provide specialized clinical expertise, educational training, research development, logistical assistance, or strategic funding. Technical Partners are explicitly excluded from governance roles, hold no voting rights, and possess no direct administrative authority within AHSIA or its members. Examples include Loma Linda University Health (LLUH), AdventHealth Global Missions, Andrews University, and ADRA."},
     {term:"Senior Adviser", def:"A highly recognized healthcare, clinical, financial, or governance expert formally invited by AHSIA-Office to provide technical and strategic guidance. Senior Advisers act strictly in an advisory capacity, hold no governance or executive power, and do not possess voting rights on the Governing Board or its committees."},
     {term:"MAPS (Model of Adventist Primary healthcare Services)", def:"The official Seventh-day Adventist primary healthcare delivery framework. It provides a standardized, mission-driven operational template designed to deliver accessible, high-quality, and cost-effective primary care that incorporates lifestyle medicine, health education, and spiritual care."},
     {term:"AHSIA Accreditation Levels", def:"The progressive, four-tier evaluation system managed by AHSIA-Office to recognize, benchmark, and incentivize organizational excellence, quality of care, and mission integrity across the Network: Star Standard (foundational compliance with Adventist mission expectations, basic clinical safety requirements, and essential administrative systems); Silver Standard (measurable progression toward integrated systems performance, active community health programs, and strengthened governance practices); Gold Standard (high-level alignment with the Adventist Philosophy of Wholistic Health, consistent clinical and financial excellence, and sustained spiritual impact); Platinum Standard (exemplary, system-leading performance, seamless integration of clinical quality and mission, advanced operational maturity, and demonstrably superior community well-being outcomes)."},
     {term:"MSQ Framework (Mission Alignment, Systems Performance & Quality Assurance)", def:"The comprehensive, network-wide evaluation and reporting framework used by AHSIA-Office to assess and accredit Member Institutions. It monitors qualitative and quantitative indicators across three pillars: spiritual mission alignment, operational/financial system performance, and clinical quality/patient safety."},
     {term:"Total Health Movement (Philosophy of Wholistic Health)", def:"The theological and philosophical framework of the Seventh-day Adventist Church that views health as the complete restoration of the physical, mental, social, and spiritual dimensions of human life, modeled after the healing ministry of Jesus Christ."},
     {term:"Standing Committee", def:"A permanent advisory or preparatory organ established by the AHSIA Governing Board (or by an institutional board) to provide continuous, specialized oversight of a core functional area (e.g., Executive, Finance, Quality, or Mission Focus) and report its findings at regular board sessions."},
     {term:"Commission", def:"A temporary, ad-hoc, time-limited body appointed by the Governing Board to execute a specific, highly defined project or inquiry, which automatically dissolves upon the submission of its final report."},
     {term:"Constitution", def:"The foundational governing instrument of Adventist Healthcare Services Inter-America, which includes all core Articles (Articles I to XIII), their accompanying mandatory Annexes (Annexes I to IX), and this Appendix."}
   ]),
   H("Section 3 — Interpretation Principles"),
   P(null,"To guarantee legal stability and theological integrity, the interpretation of this Constitution and its bylaws shall be governed by the following six principles:"),
   L(null,[
     "3.1 Mission Priority: All clauses, sections, and definitions must be interpreted in a manner that prioritizes and advances the spiritual and physical healing mission of the Seventh-day Adventist Church. If a clause is open to multiple interpretations, the reading that best preserves the Christian witness, theological standards, and spiritual mission of the Network shall prevail.",
     "3.2 Consistency with General Conference and IAD Policies: In case of any ambiguity, omission, or perceived contradiction between this Constitution and the General Conference (GC) Working Policy or the Inter-American Division (IAD) Working Policy, the GC and IAD policies shall always be superior and prevail.",
     "3.3 Plain Meaning Rule: Unless a term is explicitly defined in Section 2 of this Appendix or within a specific article of this Constitution, words and phrases shall be interpreted according to their ordinary, natural, grammatical, and plain English meaning.",
     "3.4 Contextual Interpretation (Entirety Rule): The articles, sections, annexes, and appendices of this Constitution must be interpreted as a single, coherent, and integrated document. No clause shall be read in isolation to defeat or contradict the broader intent, governance structure, or operational harmony of AHSIA.",
     "3.5 No Implied Authority: No executive officer, board member, committee, or individual institution may claim, infer, or exercise any administrative power, governance right, or supervisory authority that is not explicitly and clearly granted to them in this Constitution or by formal, voted Board resolutions.",
     "3.6 Protection of Institutional Ownership: Under no circumstances shall any clause, definition, or principle of this Constitution be interpreted, applied, or modified in a way that alters, transfers, dilutes, or compromises the exclusive asset ownership, title deeds, land rights, or local corporate governance authority of a sponsoring Seventh-day Adventist Church entity over its owned Member Institution."
   ]),
   H("Section 4 — Resolution of Ambiguities"),
   P(null,"If any dispute, disagreement, or ambiguity arises regarding the meaning, scope, or application of any article, section, or annex of this Constitution:"),
   L(null,[
     "The AHSIA Governing Board holds the initial authority to interpret the text and issue a clarifying resolution.",
     "The Board's interpretation shall be formally submitted to the Inter-American Division Administration for final review, advisory counsel, and legal alignment.",
     "Once reviewed and ratified by the IAD Administration, the Governing Board's clarifying resolution shall be final, binding, and entered into the official registry of constitutional interpretations maintained by the AHSIA-Office Secretary."
   ]),
   H("Section 5 — Authoritative Language Version"),
   L(null,[
     "English Authority: While this Constitution, its Bylaws, and its Annexes may be translated into French, Spanish, or other regional languages of the Inter-American Division to facilitate local administration, the English version shall remain the sole official, legally binding, and authoritative text.",
     "Conflict Resolution: In the event of any translation discrepancy, semantic conflict, or interpretive disagreement between different language versions, the English text shall be used exclusively to resolve the conflict and establish the correct legal meaning."
   ])
 ]
};

var ANNEXES_ES = [
{id:"I", title:"Composición de la Junta Directiva y Pautas Operativas para las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Marco General"),
   L(null,[
     "Función y Propósito: La Junta Directiva (o Junta de Fideicomisarios) es el órgano estratégico de gobierno de las instituciones de salud de la División Interamericana (IAD).",
     "Constitución: La Junta Directiva es establecida formalmente por los constituyentes de la entidad patrocinadora durante su sesión regular cada cinco (5) años.",
     "Ciclo: Se recomienda encarecidamente que este mandato coincida con los ciclos administrativos regulares de cinco (5) años de la Iglesia Adventista del Séptimo Día a nivel mundial.",
     "Cumplimiento: La Junta Directiva opera en estricta conformidad con las políticas de la División Interamericana, los estándares de la Oficina de AHSIA y los principios fundamentales de gobernanza del sistema de salud adventista.",
     "Responsabilidades Primarias: La Junta Directiva es responsable principal de la misión, la calidad, el cumplimiento, la planificación estratégica y el presupuesto de la Institución Miembro."
   ]),
   H("Sección 2 — Composición de la Junta Directiva"),
   P(null,"Para asegurar una gestión profesional, un liderazgo espiritual y la rendición de cuentas a nivel local, la composición de la Junta constará de miembros estatutarios obligatorios y miembros opcionales."),
   L("2.1 Miembros Estatutarios (Obligatorios) — la Junta Directiva de cada Institución Miembro debe estar compuesta por:",[
     "Los administradores de la Entidad Patrocinadora (Presidente, Secretario, Tesorero).",
     "Si la Unión es la entidad patrocinadora, uno o más presidentes de un territorio/campo local.",
     "El Director de Ministerios de Salud de la Unión o del campo local correspondiente.",
     "El Director Ejecutivo (CEO) o Administrador de la institución.",
     "Profesionales laicos, locales o internacionales, con experiencia avanzada en campos pertinentes (incluyendo, sin limitarse a: gestión, finanzas, derecho, salud y medicina).",
     "Un laico adventista del séptimo día que represente a la comunidad de usuarios de la institución de salud."
   ]),
   L("2.2 Miembros Opcionales — a discreción de la Unión patrocinadora, la Junta también podrá incluir:",[
     "Un representante de la Oficina de AHSIA (altamente recomendado para hospitales e instituciones de salud de gran tamaño).",
     "Representantes de socios nacionales o internacionales."
   ]),
   H("Sección 3 — Liderazgo de la Junta"),
   L(null,[
     "Presidente de la Junta Directiva: El Presidente de la Entidad Patrocinadora, o su designado, se desempeñará como Presidente.",
     "Secretario de la Junta Directiva: El CEO de la Institución Miembro se desempeñará como Secretario."
   ]),
   H("Sección 4 — Mandato y Responsabilidades"),
   P(null,"La Junta Directiva ejercerá las siguientes funciones para asegurar el éxito institucional y la alineación misional:"),
   L(null,[
     "Definir y salvaguardar la visión estratégica y misional de la institución.",
     "Aprobar las políticas institucionales mayores y los procedimientos operativos.",
     "Supervisar el desempeño financiero y operativo de la institución.",
     "Asegurar el pleno cumplimiento de las leyes locales, nacionales y regionales, así como de los estándares de la Oficina de AHSIA, la División Interamericana y los Ministerios de Salud de la Asociación General.",
     "Garantizar la calidad clínica, la seguridad del paciente y una gestión integral de riesgos.",
     "Fortalecer la integración misional y la identidad adventista del séptimo día en todos los servicios.",
     "Establecer comités de búsqueda para los nombramientos administrativos clave (tales como los miembros del equipo administrativo) cuando se considere necesario, y proceder con las nominaciones.",
     "Validar los presupuestos operativos anuales, las auditorías independientes y los planes de inversión de capital.",
     "Realizar la evaluación anual de desempeño del CEO y del equipo de liderazgo ejecutivo."
   ]),
   H("Sección 5 — Comités Permanentes de la Junta"),
   P(null,"Para agilizar la gobernanza y brindar una supervisión enfocada, la Junta Directiva establecerá comités permanentes con mandatos claros:"),
   TB(["Comité","Presidente","Función Primaria"],[
     ["Comité Ejecutivo","Presidente de la Junta","Atiende decisiones urgentes, realiza una supervisión operativa cercana y da seguimiento a las resoluciones de la junta."],
     ["Comité de Finanzas y Auditoría","Tesorero de la Entidad Patrocinadora","Supervisa los presupuestos institucionales, las auditorías independientes, las inversiones y la gestión de riesgos financieros."],
     ["Comité de Calidad y Seguridad del Paciente","Un miembro experto de la Junta","Monitorea la calidad clínica, el progreso de la acreditación de AHSIA, la seguridad del paciente y los indicadores de desempeño en salud."],
     ["Comité de Enfoque Misional","Miembro de la Junta designado","Salvaguarda la identidad adventista, la espiritualidad del personal y los pacientes, y promueve programas de salud enfocados en la misión."]
   ]),
   H("Sección 6 — Disposiciones Administrativas"),
   L(null,[
     "Período de Mandato: Los miembros de la Junta son nombrados por un período de cinco (5) años, alineado con el ciclo administrativo de la Unión patrocinadora, y podrán ser reelegidos.",
     "Reuniones: La Junta Directiva se reunirá al menos dos (2) veces al año. Los comités permanentes se reunirán trimestralmente o según sea necesario.",
     "Quórum: El quórum lo constituyen de cinco (5) a siete (7) miembros con derecho a voto.",
     "Ética y Confidencialidad: Todos los miembros de la junta y de los comités deberán firmar anualmente una Declaración de Confidencialidad y una Declaración de Conflicto de Intereses.",
     "Revisión: Estas pautas y normas de composición podrán ser revisadas por la Entidad Patrocinadora en cualquier momento que se considere necesario."
   ])
 ]},
{id:"II", title:"Comité Ejecutivo de la Junta Directiva de las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Autoridad"),
   P(null,"El Comité Ejecutivo de la Junta Directiva de cada Institución Miembro se establece para asistir a la Junta en sus funciones de gobierno entre sesiones regulares. Actúa como un órgano asesor y ejecutivo, atendiendo asuntos administrativos delegados para asegurar la operación continua y eficiente de la institución de salud."),
   L(null,[
     "Subordinación: El Comité Ejecutivo es un órgano subordinado de la Junta Directiva local. No posee autoridad para enmendar los estatutos institucionales, aprobar los presupuestos operativos anuales, nombrar al Director Ejecutivo (CEO), ni anular decisiones tomadas por la Junta Directiva en pleno.",
     "Autoridad Delegada: La Junta Directiva en pleno podrá delegar formalmente al Comité Ejecutivo facultades de decisión específicas y no reservadas, a fin de facilitar una respuesta administrativa rápida."
   ]),
   H("Sección 2 — Composición y Liderazgo"),
   P(null,"Para mantener la alineación administrativa con la entidad eclesiástica patrocinadora y el liderazgo ejecutivo de la institución, el Comité Ejecutivo se estructurará de la siguiente manera:"),
   L(null,[
     "Presidente: El Presidente de la Junta Directiva (típicamente el Presidente de la Unión patrocinadora o del campo eclesiástico local) se desempeñará como Presidente del Comité Ejecutivo.",
     "Secretario: El Director Ejecutivo (CEO) / Administrador de la institución de salud se desempeñará como Secretario.",
     "Miembros con Derecho a Voto: el Tesorero de la entidad eclesiástica patrocinadora (o su designado); al menos un (1) miembro profesional o laico de la Junta Directiva; miembros clave del equipo administrativo de la institución (por ejemplo, el Director Financiero, el Director Médico o el Director de Enfermería) podrán ser designados como miembros con derecho a voto o como invitados, según lo determinen los reglamentos de la junta local de la entidad patrocinadora."
   ]),
   H("Sección 3 — Mandato y Responsabilidades Clave"),
   P(null,"El Comité Ejecutivo desempeñará las siguientes funciones:"),
   L(null,[
     "Decisiones Urgentes: Revisar y actuar sobre asuntos institucionales urgentes que surjan entre las reuniones regulares de la Junta Directiva y que no puedan esperar a una sesión plena de la junta.",
     "Supervisión Operativa: Brindar una supervisión cercana y continua de las operaciones administrativas diarias de la institución, asegurando la alineación con el plan estratégico aprobado por la Junta Directiva.",
     "Seguimiento de Resoluciones: Monitorear y asegurar la implementación sistemática de todas las políticas, resoluciones y directrices estratégicas votadas por la Junta Directiva en pleno.",
     "Asesoría Estratégica: Actuar como caja de resonancia para el CEO en asuntos operativos críticos, la gestión de emergencias y las relaciones comunitarias.",
     "Recomendaciones de Política: Preparar y recomendar pautas operativas y políticas administrativas para su revisión y aprobación formal por parte de la Junta Directiva en pleno."
   ]),
   H("Sección 4 — Reuniones, Quórum e Informes"),
   L(null,[
     "Frecuencia: El Comité Ejecutivo se reunirá al menos trimestralmente, o con mayor frecuencia según sea convocado por el Presidente o solicitado por el Secretario (CEO) en respuesta a necesidades operativas urgentes.",
     "Quórum: El quórum para cualquier reunión del Comité Ejecutivo consistirá en una mayoría simple de sus miembros con derecho a voto, la cual deberá incluir al Presidente (o a su suplente designado) y al Secretario.",
     "Informes: El Secretario deberá levantar actas detalladas de todas las reuniones del Comité Ejecutivo. Un informe integral de todas las acciones, deliberaciones y decisiones tomadas por el Comité Ejecutivo deberá presentarse a la Junta Directiva en pleno para su revisión y ratificación formal en su próxima sesión programada."
   ])
 ]},
{id:"III", title:"Comité de Finanzas y Auditoría de la Junta Directiva de las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Autoridad"),
   P(null,"El Comité de Finanzas y Auditoría es un comité permanente de la Junta Directiva de cada Institución Miembro. Se establece para asegurar la mayordomía financiera, la transparencia, el control interno y el riguroso cumplimiento financiero en todas las operaciones institucionales, en armonía con las políticas financieras de la Iglesia Adventista del Séptimo Día."),
   H("Sección 2 — Composición y Liderazgo"),
   P(null,"Para garantizar una supervisión financiera profesional y una integración fluida con la red financiera de la Iglesia:"),
   L(null,[
     "Presidente: El Tesorero de la Entidad Patrocinadora (la Unión o el campo eclesiástico local) se desempeñará como Presidente.",
     "Secretario: El Director Financiero (CFO) / Tesorero de la Institución Miembro se desempeñará como Secretario.",
     "Miembros: al menos dos (2) miembros de la Junta Directiva con experiencia financiera, contable o empresarial; el Director Ejecutivo (CEO) de la institución (ex oficio, con o sin derecho a voto, según lo determinen las políticas de la junta local); profesionales laicos con experiencia financiera corporativa o de auditoría, designados por la Junta Directiva."
   ]),
   H("Sección 3 — Responsabilidades Clave"),
   P(null,"El Comité de Finanzas y Auditoría desempeñará las siguientes funciones:"),
   L(null,[
     "Análisis y Validación del Presupuesto: Realizar un análisis exhaustivo y la validación de los presupuestos operativos anuales y de inversión de capital antes de que sean presentados formalmente a la Junta Directiva en pleno para su aprobación.",
     "Control Interno y Gestión de Riesgos: Monitorear y supervisar los sistemas de control interno, las políticas financieras y los procedimientos contables para mitigar riesgos, prevenir el fraude y proteger los activos institucionales.",
     "Coordinación de Auditorías: Coordinar directamente con los auditores externos, incluyendo el Servicio de Auditoría de la Asociación General (GCAS) o firmas de auditoría independientes autorizadas. El comité revisará los informes de auditoría, evaluará las cartas de gerencia y monitoreará la implementación de los planes de acción correctiva.",
     "Reporte Financiero de Todo el Sistema (MSQ): Asegurar que la institución prepare y presente sus Estados Financieros mensuales a la Oficina de AHSIA a más tardar el día 15 del mes siguiente. Este reporte es obligatorio para la evaluación comparativa financiera, el análisis comparativo y la evaluación MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad)."
   ]),
   H("Sección 4 — Reuniones e Informes"),
   L(null,[
     "Frecuencia: El Comité de Finanzas y Auditoría se reunirá al menos trimestralmente, antes de las sesiones regulares de la Junta Directiva.",
     "Informes: El comité presentará informes financieros integrales, evaluaciones de auditoría y recomendaciones presupuestarias a la Junta Directiva en cada una de sus reuniones regulares."
   ])
 ]},
{id:"IV", title:"Comité de Calidad y Seguridad del Paciente de la Junta Directiva de las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Autoridad"),
   P(null,"El Comité de Calidad y Seguridad del Paciente es un comité permanente de la Junta Directiva de cada Institución Miembro. Se establece para salvaguardar la excelencia clínica, asegurar una atención centrada en el paciente, minimizar los riesgos clínicos y guiar a la institución a través de estándares progresivos de mejora de la calidad."),
   H("Sección 2 — Composición y Liderazgo"),
   P(null,"Para mantener estándares clínicos profesionales y su debida supervisión:"),
   L(null,[
     "Presidente: Un miembro experto de la Junta Directiva (preferiblemente un médico, una enfermera titulada o un profesional de la salud pública) se desempeñará como Presidente.",
     "Secretario: El Director Médico (CMO), el Director de Enfermería (CNO), o el Director de Calidad de la Institución Miembro se desempeñará como Secretario.",
     "Miembros: el CEO de la institución; representantes del liderazgo médico y de enfermería; profesionales de la salud externos o expertos en sistemas de calidad designados por la Junta Directiva."
   ]),
   H("Sección 3 — Responsabilidades Clave"),
   P(null,"El Comité de Calidad y Seguridad del Paciente desempeñará las siguientes funciones:"),
   L(null,[
     "Vigilancia Clínica: Monitorear continuamente los indicadores clave de calidad y seguridad clínica, incluyendo, sin limitarse a: las tasas de reingreso, las infecciones adquiridas en el hospital (IAH), los resultados quirúrgicos, los errores de medicación y las tasas de mortalidad de pacientes.",
     "Gestión de Riesgos y Quejas: Supervisar programas proactivos de gestión de riesgos clínicos, investigar eventos centinela, realizar análisis de causa raíz, y revisar las quejas de los pacientes y los informes de satisfacción para recomendar medidas correctivas.",
     "Progresión en la Acreditación: Supervisar las autoevaluaciones, la preparación y la progresión estratégica de la institución a través de los cuatro Niveles de Acreditación incrementales de AHSIA (Estándar Estrella, Estándar Plata, Estándar Oro y Estándar Platino).",
     "Credencialización y Otorgamiento de Privilegios: Revisar las calificaciones y proporcionar recomendaciones formales a la Junta Directiva respecto de la credencialización y el otorgamiento de privilegios clínicos al personal médico, de enfermería y de profesiones de la salud afines, para asegurar que cumplan con los estándares profesionales y éticos."
   ]),
   H("Sección 4 — Reuniones e Informes"),
   L(null,[
     "Frecuencia: El Comité de Calidad y Seguridad del Paciente se reunirá al menos trimestralmente.",
     "Informes: El comité presentará informes detallados sobre los indicadores de calidad clínica, los eventos centinela, las evaluaciones de riesgo y el grado de preparación para la acreditación a la Junta Directiva en cada sesión regular."
   ])
 ]},
{id:"V", title:"Comité de Enfoque Misional de la Junta Directiva de las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Autoridad"),
   P(null,"El Comité de Enfoque Misional es un comité permanente de la Junta Directiva de cada Institución Miembro. Se establece para proteger, nutrir y evaluar la identidad adventista del séptimo día, los valores, el ministerio de sanidad y la vida espiritual singulares de la institución de salud."),
   H("Sección 2 — Composición y Liderazgo"),
   P(null,"Para asegurar un liderazgo espiritual sólido y la continuidad misional:"),
   L(null,[
     "Presidente: Un miembro de la Junta Directiva designado por la Junta (tal como un administrador de la Unión o campo patrocinador, o el Director de Ministerios de Salud de la Unión) se desempeñará como Presidente.",
     "Secretario: El Director de Integración Misional, el Capellán, o el Coordinador de Cuidado Espiritual de la Institución Miembro se desempeñará como Secretario.",
     "Miembros: el CEO de la institución; el Director de Enfermería (CNO) o un representante del personal clínico; pastores adventistas del séptimo día locales o distritales que representen a la comunidad; el Director de Ministerios de Salud del campo local patrocinador."
   ]),
   H("Sección 3 — Responsabilidades Clave"),
   P(null,"El Comité de Enfoque Misional desempeñará las siguientes funciones:"),
   L(null,[
     "Identidad Adventista y Ética: Salvaguardar el carácter adventista del séptimo día de la institución, asegurando el estricto cumplimiento de la ética médica adventista, las posturas bioéticas, los principios de salud integral (wholística), los estándares de nutrición vegetariana/limpia y las pautas de guarda del sábado.",
     "Capellanía y Cuidado Espiritual: Supervisar el funcionamiento del departamento de capellanía, la coordinación de los programas de cuidado espiritual para pacientes, familias y personal, y la provisión de consejería espiritual.",
     "Liderazgo Espiritual y Cultura: Promover la vida devocional regular, los retiros espirituales y los programas de capacitación ética profesional para los empleados, fomentando una cultura de cuidado compasivo inspirada en el ministerio de sanidad de Jesucristo.",
     "Salud Comunitaria y Movimiento de Salud Total: Colaborar con las iglesias adventistas locales, las asociaciones y los actores comunitarios para ejecutar iniciativas de salud pública, programas de estilo de vida y actividades evangelísticas de alcance en salud alineadas con el Movimiento de Salud Total.",
     "Evaluación Comparativa Espiritual MSQ: Monitorear y evaluar los indicadores de cuidado espiritual y las métricas de impacto misional bajo el marco MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad), reportando los resultados a la Junta Directiva y a la Oficina de AHSIA."
   ]),
   H("Sección 4 — Reuniones e Informes"),
   L(null,[
     "Frecuencia: El Comité de Enfoque Misional se reunirá al menos trimestralmente.",
     "Informes: El comité presentará un informe integral de actividades espirituales, cumplimiento ético e impacto misional a la Junta Directiva en cada sesión regular."
   ])
 ]},
{id:"VI", title:"Carta de Derechos y Responsabilidades del Paciente, el Empleado y el Usuario para las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Fundamento Teológico"),
   P(null,"Siguiendo el ministerio de sanidad de Jesucristo, quien cuidó a la persona en su totalidad — cuerpo, mente y espíritu —, las Instituciones Miembro de AHSIA se comprometen a brindar una atención clínica que promueva la salud integral (wholística), la dignidad personal y el servicio compasivo. Esta Carta define los derechos y responsabilidades mutuos de los pacientes, empleados, visitantes e instituciones dentro de la Red de Salud Adventista. Su propósito es:"),
   L(null,["Fomentar un entorno seguro, sanador y colaborativo.","Fortalecer la confianza y la rendición de cuentas compartida entre los proveedores de salud, los pacientes y las familias.","Alinear las operaciones institucionales con los valores adventistas del séptimo día, el Movimiento de Salud Total y los estándares del marco MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad)."]),
   H("Sección 2 — Derechos del Paciente"),
   P(null,"Todo paciente que reciba atención en una Institución Miembro de AHSIA tiene derecho a:"),
   L(null,[
     "Atención Digna y Respetuosa: Recibir una atención compasiva y respetuosa, libre de toda forma de discriminación por motivos de raza, etnia, religión, género, edad, nacionalidad o discapacidad.",
     "Apoyo Espiritual: Acceder a un cuidado integral (wholístico) y espiritual, incluyendo servicios de capellanía, oración y apoyo que respete las creencias religiosas personales del paciente. Se da la bienvenida a las visitas del clero adventista del séptimo día patrocinador y de ministros de todos los credos.",
     "Participación en las Decisiones: Ser informado plenamente sobre su diagnóstico, pronóstico, opciones de tratamiento, riesgos y beneficios, y participar activamente en la planificación de su cuidado y tratamiento.",
     "Consentimiento Informado y Rechazo: Otorgar su consentimiento informado antes de cualquier procedimiento clínico o participación en investigaciones, y tener derecho a rechazar el tratamiento en la medida permitida por la ley, después de haber sido informado de las consecuencias clínicas de dicho rechazo.",
     "Privacidad y Confidencialidad: Esperar una confidencialidad estricta respecto de todos sus datos clínicos, financieros y personales, en cumplimiento con la Carta de Gobernanza de Datos de AHSIA. Se respetará la privacidad física durante los exámenes, tratamientos y consultas.",
     "Atención de Calidad y Segura: Recibir atención en un entorno limpio, seguro, protegido y profesional, que cumpla o supere los estándares clínicos nacionales y las métricas de calidad de AHSIA.",
     "Acceso a la Información: Solicitar y recibir información clara y comprensible respecto de su historial médico, sus estados de cuenta y las políticas institucionales, incluyendo aquellas relacionadas con la asistencia financiera o los planes de pago.",
     "Mecanismo de Quejas y Reclamos: Expresar quejas, inquietudes u observaciones respecto de su atención sin temor a represalias, y recibir una revisión oportuna, transparente y justa de su queja a través del sistema formal de reclamos de la institución."
   ]),
   H("Sección 3 — Responsabilidades del Paciente"),
   P(null,"Para asegurar la seguridad, la efectividad y el respeto mutuo de la relación de atención en salud, los pacientes son responsables de:"),
   L(null,[
     "Proporcionar Información Precisa: Proporcionar información completa y veraz respecto de su historial médico, enfermedades pasadas, hospitalizaciones, medicamentos, alergias y otros asuntos relacionados con su salud.",
     "Cumplir el Plan de Tratamiento: Seguir el plan de tratamiento acordado, las recomendaciones clínicas y las instrucciones del equipo de salud, y comunicar claramente si no pueden o no desean seguirlas.",
     "Respetar al Personal y a Otros: Tratar a todos los profesionales de la salud, al personal administrativo, a los voluntarios y a los demás pacientes con cortesía, respeto y dignidad.",
     "Cumplir con las Normas: Acatar las reglas y reglamentos operativos de la institución, incluyendo el mantenimiento de un entorno sanador y tranquilo, el respeto de los horarios de visita, y el cumplimiento de la prohibición de tabaco, alcohol, drogas ilícitas y posesión de armas.",
     "Ambiente Sabático: Respetar la santidad del sábado (desde la puesta del sol del viernes hasta la puesta del sol del sábado), cooperando con el esfuerzo de la institución por mantener un ambiente sabático pacífico y de reposo, el cual limita las actividades rutinarias y las intervenciones clínicas que no sean de emergencia.",
     "Obligaciones Financieras: Cumplir puntualmente con sus acuerdos financieros y obligaciones administrativas, o trabajar en colaboración con la oficina de facturación para establecer arreglos de pago aceptables.",
     "Formular Preguntas: Buscar aclaración del equipo médico o de enfermería siempre que no comprendan su diagnóstico, plan de tratamiento o instrucciones."
   ]),
   H("Sección 4 — Derechos del Empleado"),
   P(null,"Los empleados, como agentes vivos del ministerio de sanidad adventista del séptimo día, tienen derecho a:"),
   L(null,[
     "Entorno de Trabajo Seguro y Protegido: Trabajar en un entorno limpio, profesional y seguro, libre de abuso físico, verbal o psicológico, acoso o riesgos laborales.",
     "Trato Justo y Equitativo: Ser tratados con dignidad, justicia y respeto profesional por el liderazgo, los miembros de la junta, sus compañeros y los usuarios de la institución.",
     "Desarrollo Profesional: Tener acceso a capacitación continua, educación permanente y programas de desarrollo de competencias para mantener su competencia profesional y su crecimiento clínico.",
     "Apoyo Espiritual: Recibir cuidado espiritual, apoyo pastoral y consejería profesional para prevenir el agotamiento y fomentar una cultura laboral de apoyo enfocada en la misión.",
     "Debido Proceso: Tener derecho a procedimientos administrativos claros, transparentes y justos respecto de los términos de empleo, las evaluaciones de desempeño, los reclamos y las medidas disciplinarias, en armonía con las políticas de recursos humanos de la Unión y de la institución."
   ]),
   H("Sección 5 — Responsabilidades del Empleado"),
   P(null,"Los empleados de las Instituciones Miembro de AHSIA son responsables de:"),
   L(null,[
     "Apoyo e Integración de la Misión: Apoyar, modelar e integrar activamente la filosofía adventista del séptimo día de salud integral (wholística) y los valores cristianos en todas sus tareas profesionales.",
     "Excelencia Profesional: Brindar una atención o apoyo administrativo competente, basado en evidencia, seguro y de alta calidad, dentro del alcance de sus credenciales y licencias.",
     "Confidencialidad y Seguridad de Datos: Mantener estrictamente la confidencialidad y privacidad de todos los datos del paciente, financieros y organizacionales, y prevenir la divulgación no autorizada de cualquier registro sensible.",
     "Integridad Ética: Cumplir con el Código de Ética de AHSIA, incluyendo evitar conflictos de intereses, practicar una comunicación transparente y tratar a los pacientes y colegas con un respeto cristiano incondicional.",
     "Deber de Reportar Inquietudes: Reportar con prontitud cualquier violación ética, riesgo clínico, error clínico, peligro para la seguridad del paciente, o presunta mala conducta, a través de los canales institucionales apropiados, en un espíritu de mejora constructiva y rendición de cuentas."
   ]),
   H("Sección 6 — Derechos y Responsabilidades del Usuario, el Visitante y la Familia"),
   L("6.1 Derechos de los Visitantes y Usuarios:",[
     "Ser tratados con respeto, amabilidad y cortesía por todo el personal institucional.",
     "Visitar a sus seres queridos hospitalizados de acuerdo con las pautas institucionales, la seguridad clínica y la preferencia del paciente.",
     "Recibir información clara respecto de las normas de visita, los protocolos de control de infecciones y las pautas de seguridad.",
     "Tener acceso a espacios espirituales, salas de oración y apoyo de capellanía, si así lo desean."
   ]),
   L("6.2 Responsabilidades de los Visitantes y Usuarios:",[
     "Respetar la privacidad, la dignidad y la necesidad de un entorno sanador tranquilo de todos los pacientes y del personal.",
     "Cumplir estrictamente con las políticas institucionales, incluyendo la higiene de manos, el control de infecciones, los horarios de visita designados y las instrucciones de seguridad.",
     "Ayudar a mantener un entorno sanador tranquilo, pacífico y libre de humo, alcohol y drogas.",
     "Abstenerse de cualquier comportamiento disruptivo, agresivo o inseguro, lo cual podrá resultar en su remoción inmediata de las instalaciones."
   ]),
   H("Sección 7 — Obligaciones de la Institución Miembro"),
   P(null,"Para incorporar esta Carta a la cultura institucional, la Junta Directiva y la Administración de cada Institución Miembro deberán:"),
   L(null,[
     "Exhibición de la Carta: Exhibir de manera visible una copia de esta Carta de Derechos y Responsabilidades (en inglés y en los idiomas locales) en las salas de espera de pacientes, las oficinas de admisión, los vestíbulos y el sitio web institucional.",
     "Capacitación del Personal: Realizar programas regulares de orientación y capacitación para todos los empleados, el personal médico y los voluntarios sobre los principios y la aplicación de los derechos del paciente y del empleado.",
     "Sistema de Resolución de Quejas: Mantener un sistema funcional, accesible y confidencial para recibir, investigar y resolver los reclamos de pacientes y empleados, asegurando que las quejas se documenten, se les dé seguimiento y se reporten al Comité de Calidad y Seguridad del Paciente de la Junta.",
     "Evaluación Comparativa MSQ: Integrar las tasas de satisfacción del paciente, las métricas de rotación de personal, las auditorías de cuidado espiritual y los tiempos de resolución de quejas como indicadores clave dentro del marco MSQ.",
     "Cumplimiento Ético: Asegurar que los procedimientos clínicos, las iniciativas de investigación y las prácticas administrativas se alineen estrictamente con los estándares éticos adventistas del séptimo día y con la Declaración de Principios Operativos (FH 20)."
   ]),
   H("Sección 8 — Mayordomía del Sistema por parte de la Oficina de AHSIA"),
   P(null,"La Oficina de AHSIA actuará como mayordoma del sistema respecto de esta Carta mediante:"),
   L(null,[
     "El desarrollo, mantenimiento y actualización de las plantillas estandarizadas y los recursos educativos para esta Carta.",
     "El monitoreo del cumplimiento de estos derechos y responsabilidades durante las visitas regulares de Acreditación de AHSIA.",
     "El análisis de los datos de quejas y satisfacción de todo el sistema, para identificar áreas de mejora de la calidad, apoyo de asesoría y capacitación específica."
   ])
 ]},
{id:"VII", title:"Código de Ética para las Instituciones Miembro de AHSIA",
 blocks:[
   L(null,[
     "Sección 1 — Preámbulo y Fundamentos Teológicos: Conecta profundamente la misión clínica con el ministerio de sanidad de Jesucristo y la restauración integral (wholística) — física, mental, social y espiritual — promovida por el Movimiento de Salud Total.",
     "Sección 2 — Alcance y Carácter Vinculante: Detalla explícitamente las obligaciones vinculantes para cada nivel de la institución, incluyendo a los miembros de la junta local, los administradores ejecutivos (CEO, CFO, CMO, CNO), los médicos, el personal de enfermería, el personal de apoyo, los voluntarios y los contratistas externos.",
     "Sección 3 — Valores y Principios Éticos Fundamentales: Define de manera integral los siete principios fundamentales (Integridad Cristiana, Excelencia Clínica, Dignidad Humana, Confidencialidad, Mayordomía Fiel, Integración Misional y Equidad).",
     "Sección 4 — Liderazgo Ético y Gobernanza: Impone pautas estrictas para eliminar el nepotismo, garantizar una selección de proveedores libre de conflictos (con referencia al Artículo XI), y definir los límites profesionales con las Uniones patrocinadoras.",
     "Sección 5 — Mayordomía Financiera y Anticorrupción: Prohíbe explícitamente los sobornos, las comisiones ilícitas y los regalos inapropiados de proveedores, a la vez que exige el estricto cumplimiento de las políticas financieras de la Asociación General (AG) y la División Interamericana (IAD), así como de protocolos de adquisición transparentes.",
     "Sección 6 — Ética Clínica y Estándares Bioéticos: Establece límites éticos claros para la atención del paciente, enfatizando el consentimiento informado, la privacidad del paciente y el estricto cumplimiento de las posturas bioéticas adventistas del séptimo día (incluyendo la prohibición de la eutanasia activa, el suicidio asistido y las restricciones al aborto según lo definido por la AG).",
     "Sección 7 — Principios Operativos Denominacionales: Detalla los protocolos operativos para preservar la santidad del sábado (limitando las acciones clínicas únicamente a la atención de emergencia), promover pautas de alimentación vegetariana/limpia en los servicios culinarios para pacientes y personal, y hacer cumplir una prohibición absoluta de alcohol, tabaco y drogas recreativas en todas las instalaciones.",
     "Sección 8 — Reporte de Violaciones y Protección al Denunciante: Establece una estructura de reporte clara y de múltiples niveles (Oficial de Ética → CEO → Presidente de la Junta → Oficina de AHSIA), con una estricta política de tolerancia cero ante represalias contra denunciantes de buena fe.",
     "Sección 9 — Cumplimiento, Sanciones y Compromiso Anual: Detalla las consecuencias administrativas y de credencialización por las violaciones, y exige que todo el personal reciba capacitación anual y firme la Declaración Anual de Compromiso Ético (cuyo texto está redactado íntegramente en el apéndice)."
   ])
 ]},
{id:"VIII", title:"Carta de Gobernanza de Datos y Confidencialidad para las Instituciones Miembro de AHSIA",
 blocks:[
   H("Sección 1 — Propósito y Fundamento Teológico"),
   P(null,"Los datos son un activo organizacional y de mayordomía vital. En alineación con el compromiso adventista del séptimo día con la integridad, el respeto por la dignidad personal y la gestión ética de los recursos, esta Carta establece los principios estándar, los requisitos operativos y las obligaciones de confidencialidad para la gestión segura, ética y alineada con la misión de toda la información clínica, administrativa, financiera, operativa y misional en toda la Red de AHSIA."),
   H("Sección 2 — Aplicabilidad"),
   P(null,"Esta Carta se aplicará a todas las Instituciones Miembro de AHSIA, incluyendo a:"),
   L(null,["Los miembros de la Junta Directiva local.","Los oficiales ejecutivos, administradores y directores (CEO, CFO, CMO, CNO).","Los empleados clínicos, profesionales, logísticos y administrativos.","Los contratistas, consultores y proveedores externos.","Los voluntarios y estudiantes.","Cualquier persona o entidad que actúe en nombre de una Institución Miembro con acceso autorizado a sus sistemas de datos o registros sensibles."]),
   H("Sección 3 — Principios Fundamentales de la Gobernanza de Datos"),
   P(null,"Todos los datos dentro de la Red de AHSIA deberán gestionarse de conformidad con los siguientes cinco principios fundamentales:"),
   L(null,[
     "Confidencialidad: La protección de la información sensible o personal frente al acceso, la exposición o la divulgación no autorizados.",
     "Integridad: Asegurar que los datos permanezcan precisos, completos, confiables y protegidos contra la modificación o manipulación no autorizada.",
     "Disponibilidad: Garantizar que el personal autorizado tenga acceso oportuno y seguro a la información necesaria para brindar atención clínica o ejecutar funciones administrativas.",
     "Uso Ético: Restringir la recopilación, el procesamiento y el intercambio de datos estrictamente a fines que se alineen con el ministerio de sanidad adventista del séptimo día, el bienestar del paciente y la eficiencia organizacional.",
     "Cumplimiento: La adhesión total a las leyes locales y nacionales de privacidad de datos aplicables, las regulaciones de salud, y las políticas de la División Interamericana y la Asociación General."
   ]),
   H("Sección 4 — Información y Privacidad del Paciente (Datos Clínicos)"),
   P(null,"Para proteger la confianza sagrada entre los pacientes y los proveedores de salud adventistas del séptimo día, cada Institución Miembro deberá:"),
   L(null,[
     "Registros Electrónicos Seguros: Implementar y mantener Registros de Salud Electrónicos (EHR) seguros y sistemas de bases de datos clínicas con control de acceso basado en roles, asegurando que únicamente el personal clínico y administrativo autorizado tenga acceso a los registros de los pacientes.",
     "Prevenir la Divulgación: Establecer salvaguardas físicas y digitales estrictas para prevenir la divulgación no autorizada de los detalles clínicos, psiquiátricos o personales del paciente.",
     "Consentimiento y Autorización: Utilizar los datos clínicos del paciente exclusivamente para la atención médica directa, las revisiones de calidad clínica autorizadas y la evaluación comparativa de todo el sistema. Cualquier uso secundario de los datos del paciente (tal como la investigación clínica o el reporte de salud pública) deberá contar con el consentimiento explícito y por escrito del paciente o de su tutor legal, en estricto cumplimiento con las regulaciones nacionales."
   ]),
   H("Sección 5 — Datos Institucionales, Reportes y Evaluación Comparativa"),
   L(null,[
     "Obligaciones de Reporte: Las Instituciones Miembro presentarán a la Oficina de AHSIA los estados financieros mensuales, las evaluaciones MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad) y los datos de desempeño clínico.",
     "Seguridad de los Datos durante la Transmisión: Las Instituciones Miembro deberán asegurar que todos los datos transmitidos a la Oficina de AHSIA o compartidos dentro de la red se envíen a través de canales seguros, cifrados y autorizados.",
     "Reciprocidad de la Oficina de AHSIA: La Oficina de AHSIA está obligada a mantener la confidencialidad de todos los datos institucionales recibidos, utilizándolos únicamente para la evaluación comparativa de todo el sistema, el análisis de tendencias, las revisiones de calidad y las evaluaciones de acreditación. Los datos individuales de una institución no serán publicados externamente sin el consentimiento por escrito de la Unión patrocinadora."
   ]),
   H("Sección 6 — Salud Digital, Ciberseguridad y Sistemas de Información"),
   P(null,"Las Instituciones Miembro deberán proteger activamente sus sistemas operativos e infraestructura mediante:"),
   L(null,[
     "La Implementación de Salvaguardas: El establecimiento de medidas robustas de ciberseguridad, incluyendo protecciones de cortafuegos, copias de seguridad regulares del sistema, software antivirus actualizado, protocolos de red seguros y autenticación multifactor (MFA) para los sistemas críticos.",
     "La Auditoría de Sistemas: La realización de auditorías de seguridad periódicas y evaluaciones de vulnerabilidad de todos los servidores locales, estaciones de trabajo y bases de datos clínicas.",
     "Estándares de Interoperabilidad: El cumplimiento de las pautas estándar de salud digital e interoperabilidad técnica promovidas por la Oficina de AHSIA, para facilitar una comunicación segura y fluida en toda la red.",
     "Capacitación en Ciberseguridad: La provisión de capacitación obligatoria de concientización en ciberseguridad para todos los empleados, a fin de mitigar los riesgos asociados con el phishing, el malware y la ingeniería social."
   ]),
   H("Sección 7 — Obligaciones de Confidencialidad"),
   L(null,[
     "Restricción de Acceso: El acceso autorizado a datos sensibles no confiere la propiedad ni el derecho de distribuir dicha información. Todas las personas con acceso a archivos confidenciales (incluyendo registros clínicos, expedientes de personal, auditorías y presupuestos estratégicos) deberán mantener esta información en estricta confidencialidad.",
     "Acuerdos de Confidencialidad (NDA): Todos los miembros de junta, administradores ejecutivos, personal clínico y contratistas externos deberán firmar un Acuerdo de Confidencialidad (NDA) formal y por escrito, o una Declaración de Confidencialidad, al momento de su nombramiento o contratación.",
     "Devolución de Materiales: Al finalizar el rol, el empleo o el contrato de una persona, esta deberá devolver inmediatamente o destruir de forma segura todas las copias físicas y digitales de los materiales institucionales confidenciales que tenga en su poder. El acceso a todos los portales electrónicos, EHR y sistemas de bases de datos será revocado de inmediato."
   ]),
   H("Sección 8 — Violación de la Confidencialidad e Incidentes de Seguridad"),
   L(null,[
     "Reporte Inmediato: Cualquier violación sospechada, potencial o confirmada de la confidencialidad de datos, incidente de ciberseguridad, o divulgación no autorizada de datos, deberá reportarse de inmediato (dentro de las 24 horas siguientes a su descubrimiento) al CEO de la institución, al Oficial de Protección de Datos local (o Director de TI), y a la Oficina de AHSIA.",
     "Mitigación e Investigación: La Institución Miembro activará de inmediato su protocolo de respuesta a incidentes para contener la violación, investigar su causa raíz y mitigar cualquier daño potencial a los pacientes, los empleados o la organización.",
     "Consecuencias y Responsabilidad: Cualquier persona que viole deliberadamente esta Carta, quebrante la confidencialidad, o haga un uso indebido de los datos institucionales, estará sujeta a medidas disciplinarias inmediatas, hasta e incluyendo la terminación del empleo, la remoción de las juntas de gobierno, la descalificación de los equipos de acreditación de AHSIA, y una posible acción legal civil o penal conforme a las leyes locales."
   ]),
   H("Sección 9 — Límites de la Propiedad de los Datos"),
   P(null,"Para salvaguardar los activos locales y la integridad del sistema:"),
   L(null,[
     "Autonomía Institucional: Las Instituciones Miembro conservan la propiedad exclusiva de sus datos clínicos, financieros y operativos brutos a nivel institucional.",
     "Propiedad a Nivel de Sistema: La Oficina de AHSIA conserva la propiedad de todos los análisis a nivel de sistema, los datos agregados, los informes MSQ, las puntuaciones de acreditación, las evaluaciones comparativas y los archivos históricos.",
     "Restricción para Socios Externos: Los Socios Técnicos, los Asesores Principales y los consultores externos no poseen derechos de propiedad sobre ningún dato generado, analizado o compartido dentro de la Red de AHSIA. Tienen estrictamente prohibido almacenar, exportar o utilizar los datos de la red para fines comerciales o profesionales independientes, sin el consentimiento expreso y por escrito de la Oficina de AHSIA y de la Unión patrocinadora."
   ]),
   H("Sección 10 — Retención y Archivo de Datos"),
   L(null,[
     "Archivo Estandarizado: Las Instituciones Miembro mantendrán archivos seguros, organizados y conformes con la ley de todos los registros médicos clínicos, los estados financieros, las actas de junta y las presentaciones regulatorias.",
     "Plazos de Retención: Las políticas de retención de datos deberán cumplir con los estatutos legales nacionales, así como con las pautas de retención estándar establecidas por la División Interamericana y la Asociación General de los Adventistas del Séptimo Día."
   ])
 ]},
{id:"IX", title:"El Sistema de Acreditación de AHSIA y el Marco MSQ para las Instituciones Miembro",
 blocks:[
   H("Sección 1 — Propósito y Objetivo Central"),
   L(null,[
     "1.1 Propósito: Con el fin de alcanzar la excelencia clínica, la sostenibilidad estratégica y una alineación misional profunda en toda la División Interamericana, todas las Instituciones Miembro se integran en un proceso de evaluación unificado y de alcance sistémico, conocido como el Sistema de Acreditación de AHSIA.",
     "1.2 El Objetivo Central: Esta transición del sistema está diseñada para que las instalaciones de salud locales dejen de operar como clínicas independientes y débilmente coordinadas, y pasen a formar parte de una red profesional, de alto desempeño e impulsada por la misión, unificada bajo el tablero de indicadores MSQ (Alineación Misional, Desempeño de Sistemas y Aseguramiento de la Calidad)."
   ]),
   H("Sección 2 — Las Dimensiones del Tablero de Indicadores MSQ"),
   P(null,"La Acreditación de AHSIA se fundamenta en tres dimensiones fundamentales e interdependientes. Cada Institución Miembro debe medir, documentar y presentar continuamente los indicadores de desempeño en estas dimensiones:"),
   L(null,[
     "Alineación Misional (M): Mide la integración activa por parte de la institución del ministerio de sanidad adventista del séptimo día, el Movimiento de Salud Total y los estándares de cuidado espiritual descritos en el Anexo V. Las métricas clave incluyen el desarrollo espiritual del personal, la integración del cuidado espiritual del paciente, el cumplimiento de la medicina del estilo de vida (nutrición vegetariana/limpia) y las operaciones de guarda del sábado.",
     "Desempeño de Sistemas (S): Evalúa la eficiencia operativa, el profesionalismo administrativo y la sostenibilidad financiera de la institución. Las métricas clave incluyen el cumplimiento de los plazos de reporte financiero descritos en el Anexo III (informes mensuales presentados a más tardar el día 15), el grado de preparación en ciberseguridad (conforme al Anexo VIII), las evaluaciones del liderazgo administrativo y la precisión de la facturación.",
     "Aseguramiento de la Calidad (Q): Monitorea la calidad clínica, la seguridad del paciente y el cumplimiento institucional de los estándares internacionales de salud. Las métricas clave incluyen las tasas de satisfacción del paciente, las tasas de reingreso clínico, los indicadores de control de infecciones, el reporte de eventos centinela, y los estándares de licenciamiento/credencialización profesional descritos en el Anexo IV."
   ]),
   H("Sección 3 — Los Cuatro Estándares Progresivos de Acreditación"),
   P(null,"El proceso de acreditación se estructura en cuatro estándares progresivos y escalonados. Las Instituciones Miembro deben avanzar sistemáticamente a través de estos niveles para demostrar crecimiento, madurez y excelencia:"),
   TB(["Nivel de Acreditación","Enfoque y Criterios Operativos"],[
     ["Nivel 1: Estándar Estrella","Se enfoca en el cumplimiento operativo básico, la licencia sanitaria, los protocolos de seguridad esenciales y la alineación misional introductoria."],
     ["Nivel 2: Estándar Plata","Marca el establecimiento de sistemas de gestión formalizados, controles internos financieros estables y comités activos de la junta local."],
     ["Nivel 3: Estándar Oro","Representa la excelencia clínica, la integración avanzada de salud digital, una gestión de riesgos robusta y programas activos de salud comunitaria."],
     ["Nivel 4: Estándar Platino","El nivel más alto de liderazgo en la red, que representa una calidad clínica de talla mundial, plena independencia financiera y una integración completa del modelo."]
   ]),
   H("Sección 4 — El Ciclo y el Proceso de Acreditación"),
   P(null,"Todas las Instituciones Miembro deben participar en el ciclo formal de acreditación administrado por la Oficina de AHSIA, el cual consta de las siguientes fases:"),
   L(null,[
     "4.1 Autoevaluación Anual: Cada Institución Miembro realizará una auditoría interna anual utilizando la herramienta estandarizada de autoevaluación MSQ. Los resultados, aprobados por la Junta Directiva local, deberán presentarse a la Oficina de AHSIA.",
     "4.2 Visita de Evaluación Cuatrienal: La Oficina de AHSIA encargará y desplegará un Equipo Externo de Evaluación de Acreditación para realizar una evaluación intensiva en el sitio de la Institución Miembro, una vez cada cuatro (4) años.",
